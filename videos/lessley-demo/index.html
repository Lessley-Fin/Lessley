<!DOCTYPE html>
<!-- No dir="rtl" on <html>: it previews fine but renders a fully black video.
     Direction is scoped to #root and to each scene's own text instead. -->

      body { margin: 0; background: oklch(19% 0.028 245); }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      /* Opaque stage-ground: guards against a white flash showing through at seams. */
      #stage-ground {
        position: absolute;
        inset: 0;
        background: oklch(19% 0.028 245);
      }
    </style>
  </head>
