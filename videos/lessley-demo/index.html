      <!-- Music bed. Source track is assets/music/bed.mp3 (161.9s) — shorter than
           the 253s film, so assets/music/bed-loop.mp3 is a pre-baked 253.000s
           extension of it. It is NOT a naive repeat: the source has a near-silent
           breakdown at 96-100s (-45 dB at 98s), and the loop seam is hidden inside
           that trough, where there is nothing playing to hear a cut in. So the seam
           needs no beat alignment and is inaudible. Rebuild with:

             ffmpeg -y -i bed.mp3 -i bed.mp3 -filter_complex "\
               [0:a]atrim=0:99,asetpts=N/SR/TB[a];\
               [1:a]atrim=5:161,asetpts=N/SR/TB[b];\
               [a][b]acrossfade=d=2:c1=qsin:c2=qsin[x];\
               [x]afade=t=out:st=251.5:d=1.5,atrim=0:253,asetpts=N/SR/TB[o]" \
               -map "[o]" -c:a libmp3lame -b:a 192k -ar 44100 -ac 2 bed-loop.mp3

           Resulting arrangement against the film (source time = film time - 92 after
           the seam), which happens to track the story:
             0-16s     quiet intro pad     - scene 01 logo / 02 problem opens
             16-96s    full body
             96-99s    breakdown (seam)    - lands on the cut into scene 09 nav-map
             99-107s   intro pad returns   - scene 09 nav-map / 10 optimizer input
             107-188s  full body           - energy is up for the payoff at 124.5
             188-192s  breakdown           - scene 17 recs-matches
             192-251s  full body
             251-253s  natural outro decay - resolves on the brand lockup, not a cut
           Track 8; SFX are on 9 and 10. -->
      <audio data-hf-id="hf-69ed" id="bgm" class="clip" src="assets/music/bed-loop.mp3" data-start="0" data-duration="253" data-track-index="8" data-volume="0.17" data-media-start="0"></audio>
