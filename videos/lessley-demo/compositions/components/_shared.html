<!doctype html>
<!--
  SHARED STYLE BLOCK — not a composition. Never mounted.

  Every scene file copies the <style id="lessley-shared"> element below VERBATIM as its
  first style element, then adds its own scene-specific <style> after it. Sub-compositions
  are transport-cloned from <template>, so styles cannot be linked or imported — inlining
  is the only render-safe path, and this file is the single authoring source.

  Design truth: ../../frame.md. Token values are copied from the real app
  (lessley-frontend/src/index.css) and must not be re-tinted.
-->
<html lang="he" dir="rtl">
  <body>
    <template>
      <style id="lessley-shared">
        /* ── Hebrew faces, self-embedded (assets/fonts/fonts.css is the generator's output) ── */
        @font-face { font-family: "Heebo"; font-style: normal; font-weight: 400; font-display: block;
          src: url("assets/fonts/heebo-400-hebrew.woff2") format("woff2");
          unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
        @font-face { font-family: "Heebo"; font-style: normal; font-weight: 400; font-display: block;
          src: url("assets/fonts/heebo-400-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
        @font-face { font-family: "Heebo"; font-style: normal; font-weight: 600; font-display: block;
          src: url("assets/fonts/heebo-600-hebrew.woff2") format("woff2");
          unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
        @font-face { font-family: "Heebo"; font-style: normal; font-weight: 600; font-display: block;
          src: url("assets/fonts/heebo-600-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
        @font-face { font-family: "Heebo"; font-style: normal; font-weight: 800; font-display: block;
          src: url("assets/fonts/heebo-800-hebrew.woff2") format("woff2");
          unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
        @font-face { font-family: "Heebo"; font-style: normal; font-weight: 800; font-display: block;
          src: url("assets/fonts/heebo-800-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
        @font-face { font-family: "Frank Ruhl Libre"; font-style: normal; font-weight: 700; font-display: block;
          src: url("assets/fonts/frank-ruhl-libre-700-hebrew.woff2") format("woff2");
          unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
        @font-face { font-family: "Frank Ruhl Libre"; font-style: normal; font-weight: 700; font-display: block;
          src: url("assets/fonts/frank-ruhl-libre-700-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }

        /* ── tokens ───────────────────────────────────────────────────────── */
        #root {
          /* stage — outside the phone */
          --stage-bg: oklch(19% 0.028 245);
          --stage-surface: oklch(24% 0.030 240);
          --stage-ink: hsl(203 36% 96%);
          --stage-ink-muted: hsl(203 13% 67%);
          --stage-accent: hsl(180 45% 62%);
          --stage-accent-deep: hsl(182 38% 36%);
          --stage-gold: hsl(33 86% 61%);
          /* in-phone — the app's real tokens, verbatim */
          --background: 203 34% 96%;   --foreground: 209 37% 15%;
          --card: 0 0% 100%;           --primary: 182 38% 36%;
          --muted: 198 28% 94%;        --muted-foreground: 208 11% 46%;
          --accent: 179 50% 88%;       --accent-foreground: 182 73% 18%;
          --success: 150 60% 45%;      --warning: 33 86% 61%;
          --border: 201 21% 89%;       --navy: 208 34% 17%;
          --input: 201 21% 89%;        --ring: 182 38% 36%;
          --shadow-card: 0 1px 2px oklch(30% 0.03 240 / 0.04), 0 8px 24px oklch(30% 0.03 240 / 0.06);
          --shadow-float: 0 8px 32px oklch(25% 0.03 240 / 0.18);

          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: var(--stage-bg);
          color: var(--stage-ink);
          direction: rtl;
          font-family: "Heebo", system-ui, sans-serif;
          font-feature-settings: "tnum" 0;
        }

        /* Currency and figures never flip in an RTL run. */
        .num { unicode-bidi: isolate; direction: ltr; font-variant-numeric: tabular-nums; }

        /* ── stage layout ─────────────────────────────────────────────────── */
        .bg-layer { position: absolute; inset: 0; pointer-events: none; }
        .bg-glow {
          position: absolute; width: 1100px; height: 1100px; border-radius: 50%;
          background: radial-gradient(circle, hsl(182 38% 36% / 0.16), transparent 62%);
          left: 60px; top: -50px;
        }
        .bg-grid {
          position: absolute; inset: 0; opacity: 0.03;
          background-image:
            linear-gradient(to right, var(--stage-ink) 1px, transparent 1px),
            linear-gradient(to bottom, var(--stage-ink) 1px, transparent 1px);
          background-size: 120px 120px;
        }
        .bg-ghost {
          position: absolute; bottom: -90px; right: -40px;
          font-family: "Frank Ruhl Libre", serif; font-size: 340px; font-weight: 700;
          color: var(--stage-ink); opacity: 0.04; letter-spacing: -0.03em; line-height: 1;
        }
        .bg-grain { position: absolute; inset: 0; opacity: 0.03; mix-blend-mode: overlay;
          background-image: radial-gradient(hsl(0 0% 100%) 0.5px, transparent 0.5px);
          background-size: 3px 3px; }

        .stage { position: absolute; inset: 0; display: flex; align-items: center;
          gap: 72px; padding: 96px; }
        .col-text { flex: 1; display: flex; flex-direction: column; gap: 26px;
          text-align: right; max-width: 800px; }
        .scene-title { font-family: "Frank Ruhl Libre", serif; font-size: 76px; font-weight: 700;
          line-height: 1.08; letter-spacing: -0.01em; margin: 0; }
        .scene-body { font-size: 30px; line-height: 1.5; color: var(--stage-ink-muted); margin: 0; }
        .scene-kicker { font-size: 20px; font-weight: 600; letter-spacing: 0.06em;
          color: var(--stage-accent); margin: 0; }

        .chapter { position: absolute; top: 64px; left: 96px; font-size: 20px; font-weight: 600;
          letter-spacing: 0.06em; color: var(--stage-ink-muted); direction: ltr; }
        .rail { position: absolute; bottom: 60px; left: 96px; right: 96px; height: 3px;
          background: hsl(203 36% 96% / 0.14); }
        .rail > i { display: block; height: 100%; background: var(--stage-accent);
          transform-origin: right center; }

        /* ── the device — the film's carrier ─────────────────────────────── */
        .device { position: relative; width: 430px; height: 932px; flex: none; }
        .device-body {
          position: absolute; inset: 0; border-radius: 62px; padding: 10px; box-sizing: border-box;
          background: oklch(28% 0.010 250);
          box-shadow: 0 0 0 2px hsl(210 8% 62%), 0 40px 90px oklch(12% 0.02 245 / 0.6);
        }
        .device-screen {
          position: relative; width: 100%; height: 100%; border-radius: 52px; overflow: hidden;
          background: hsl(var(--background)); color: hsl(var(--foreground));
          background-image:
            radial-gradient(ellipse 90% 60% at 50% -15%, hsl(182 38% 36% / 0.14), transparent 55%),
            radial-gradient(ellipse 70% 50% at 100% 10%, hsl(186 43% 32% / 0.10), transparent 50%);
          display: flex; flex-direction: column;
        }
        .device-island {
          position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
          width: 126px; height: 37px; border-radius: 20px; background: oklch(12% 0 0); z-index: 9;
        }
        /* The screen's own camera wrapper: scenes push into a card by transforming this. */
        .screen-world { position: absolute; inset: 0; transform-origin: 50% 50%; }

        /* ── app UI primitives — real tokens, 1.5x logical scale ─────────── */
        .app { position: absolute; inset: 0; display: flex; flex-direction: column;
          padding: 0; font-size: 22px; }
        .app-header { display: flex; align-items: center; gap: 14px;
          padding: 62px 22px 16px; border-bottom: 1px solid hsl(var(--border) / 0.7);
          background: hsl(var(--card) / 0.8); }
        .app-header .brand { flex: 1; min-width: 0; }
        .app-header .brand b { display: block; font-size: 23px; font-weight: 800; line-height: 1.1; }
        .app-header .brand span { display: block; font-size: 17px; color: hsl(var(--muted-foreground)); }
        .app-icon { width: 54px; height: 54px; border-radius: 50%; flex: none;
          display: grid; place-items: center; border: 1px solid hsl(var(--border));
          background: hsl(var(--card)); box-shadow: var(--shadow-card); font-size: 22px; }
        .app-avatar { width: 54px; height: 54px; border-radius: 50%; flex: none;
          display: grid; place-items: center; font-weight: 800; font-size: 22px;
          background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
        .app-main { flex: 1; overflow: hidden; padding: 20px 22px; display: flex;
          flex-direction: column; gap: 16px; }
        .app-h1 { font-size: 34px; font-weight: 800; line-height: 1.15; margin: 0; }
        .app-sub { font-size: 20px; line-height: 1.35; color: hsl(var(--muted-foreground)); margin: 0; }

        .card { border-radius: 26px; border: 1px solid hsl(0 0% 100% / 0.9);
          background: hsl(var(--card)); box-shadow: var(--shadow-card); padding: 22px; }
        .card-inset { border-radius: 20px; border: 1px solid hsl(var(--border) / 0.6);
          background: hsl(var(--muted) / 0.55); padding: 16px; }

        .field { display: flex; align-items: center; justify-content: space-between; gap: 12px;
          border: 1px solid hsl(var(--input)); border-radius: 20px; background: hsl(var(--card));
          padding: 20px 22px; font-size: 22px; }
        .field .lbl { color: hsl(var(--muted-foreground)); }
        .field .val { font-weight: 700; }
        .field.is-active { border-color: hsl(var(--ring, var(--primary)));
          box-shadow: 0 0 0 3px hsl(var(--primary) / 0.16); }

        .btn { display: block; text-align: center; border-radius: 999px; padding: 22px;
          font-size: 24px; font-weight: 700; background: hsl(var(--primary));
          color: hsl(182 37% 98%); box-shadow: var(--shadow-card); }
        .btn-ghost { background: transparent; color: hsl(var(--primary)); box-shadow: none; }

        .pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px;
          padding: 8px 16px; font-size: 18px; font-weight: 700; }
        .pill-save { background: hsl(var(--warning) / 0.18); color: hsl(29 75% 22%); }
        .pill-ok { background: hsl(var(--success) / 0.16); color: hsl(150 60% 22%); }

        .tabs { display: flex; gap: 6px; }
        .tab { flex: 1; text-align: center; border-radius: 999px; padding: 13px 6px;
          font-size: 19px; color: hsl(var(--muted-foreground)); }
        .tab.on { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); font-weight: 700; }

        .steps { display: flex; gap: 6px; }
        .step { flex: 1; text-align: center; font-size: 16px; padding: 10px 2px;
          border-radius: 999px; color: hsl(var(--muted-foreground));
          background: hsl(var(--muted)); }
        .step.on { background: hsl(var(--primary)); color: hsl(182 37% 98%); font-weight: 700; }

        .nav { margin: 0 22px 34px; display: flex; align-items: center; justify-content: space-between;
          border-radius: 999px; padding: 10px; background: linear-gradient(150deg, oklch(31% 0.036 246), oklch(24% 0.03 240));
          box-shadow: var(--shadow-float); }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
          border-radius: 999px; padding: 12px 4px; font-size: 16px; font-weight: 500;
          color: hsl(203 13% 67%); }
        .nav-tab.on { background: hsl(179 50% 88%); color: hsl(182 73% 18%); box-shadow: var(--shadow-card); }

        .hero-figure { font-size: 76px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
        .hero-label { font-size: 20px; color: hsl(var(--muted-foreground)); }

        .toast { border-radius: 24px; padding: 20px 22px; background: hsl(var(--card));
          border: 1px solid hsl(var(--border)); box-shadow: var(--shadow-float); font-size: 20px; }

        /* Oversized macOS-style pointer for cursor-led scenes. */
        .cursor { position: absolute; width: 46px; height: 46px; z-index: 20;
          filter: drop-shadow(0 4px 10px oklch(15% 0.02 245 / 0.45)); pointer-events: none; }
      </style>
    </template>
  </body>
</html>
