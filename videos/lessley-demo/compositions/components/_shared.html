  first style element, then adds its own scene-specific <style> after it. Sub-compositions
  are transport-cloned from <template>, so styles cannot be linked or imported — inlining

  <body>
    <template>
      <style id="lessley-shared">

          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }

        /* ── tokens ───────────────────────────────────────────────────────── */
        #root {
          /* stage — outside the phone */
          --stage-bg: oklch(19% 0.028 245);
          --stage-surface: oklch(24% 0.030 240);
          --stage-ink: hsl(203 36% 96%);
          --stage-ink-muted: hsl(203 13% 67%);
          --stage-accent: hsl(180 45% 62%);
          --stage-accent-deep: hsl(182 38% 36%);
          --stage-gold: hsl(33 86% 61%);
          /* in-phone — the app's real tokens, verbatim */
          --background: 203 34% 96%;   --foreground: 209 37% 15%;
          --card: 0 0% 100%;           --primary: 182 38% 36%;
          --muted: 198 28% 94%;        --muted-foreground: 208 11% 46%;
          --accent: 179 50% 88%;       --accent-foreground: 182 73% 18%;
          --success: 150 60% 45%;      --warning: 33 86% 61%;
          --border: 201 21% 89%;       --navy: 208 34% 17%;
          --input: 201 21% 89%;        --ring: 182 38% 36%;
          --secondary: 195 33% 94%;    --secondary-foreground: 209 28% 20%;
          --navy-foreground: 203 36% 96%;
          --navy-muted: 203 13% 67%;
          --gradient-navy: linear-gradient(150deg, oklch(31% 0.036 246), oklch(24% 0.03 240));
          --shadow-card: 0 1px 2px oklch(30% 0.03 240 / 0.04), 0 8px 24px oklch(30% 0.03 240 / 0.06);
          --shadow-float: 0 8px 32px oklch(25% 0.03 240 / 0.18);

          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: var(--stage-bg);
          color: var(--stage-ink);
          direction: rtl;
          font-family: "Heebo", system-ui, sans-serif;
          font-feature-settings: "tnum" 0;
        }

        /* Currency and figures never flip in an RTL run. */
        .num { unicode-bidi: isolate; direction: ltr; font-variant-numeric: tabular-nums; }

        /* ── stage layout ─────────────────────────────────────────────────── */
        .bg-layer { position: absolute; inset: 0; pointer-events: none; }
        .bg-glow {
          position: absolute; width: 1100px; height: 1100px; border-radius: 50%;
          background: radial-gradient(circle, hsl(182 38% 36% / 0.16), transparent 62%);
          left: 60px; top: -50px;
        }
        .bg-grid {
          position: absolute; inset: 0; opacity: 0.03;
          background-image:
            linear-gradient(to right, var(--stage-ink) 1px, transparent 1px),
            linear-gradient(to bottom, var(--stage-ink) 1px, transparent 1px);
          background-size: 120px 120px;
        }
        .bg-ghost {
          position: absolute; bottom: -90px; right: -40px;
          font-family: "Frank Ruhl Libre", serif; font-size: 340px; font-weight: 700;
          color: var(--stage-ink); opacity: 0.04; letter-spacing: -0.03em; line-height: 1;
        }
        .bg-grain { position: absolute; inset: 0; opacity: 0.03; mix-blend-mode: overlay;
          background-image: radial-gradient(hsl(0 0% 100%) 0.5px, transparent 0.5px);
          background-size: 3px 3px; }

        .stage { position: absolute; inset: 0; display: flex; align-items: center;
          gap: 56px; padding: 42px 80px; }
        .col-text { flex: 1; display: flex; flex-direction: column; gap: 26px;
          text-align: right; max-width: 800px; }
        .scene-title { font-family: "Frank Ruhl Libre", serif; font-size: 76px; font-weight: 700;
          line-height: 1.08; letter-spacing: -0.01em; margin: 0; }
        .scene-body { font-size: 30px; line-height: 1.5; color: var(--stage-ink-muted); margin: 0; }
        .scene-kicker { font-size: 20px; font-weight: 600; letter-spacing: 0.06em;
          color: var(--stage-accent); margin: 0; }

        .chapter { position: absolute; top: 64px; left: 96px; font-size: 20px; font-weight: 600;
          letter-spacing: 0.06em; color: var(--stage-ink-muted); direction: ltr; }
        .rail { position: absolute; bottom: 60px; left: 96px; right: 96px; height: 3px;
          background: hsl(203 36% 96% / 0.14); }
        .rail > i { display: block; height: 100%; background: var(--stage-accent);
          transform-origin: right center; }

        /* ── the device — the film's carrier ─────────────────────────────── */
        .device { position: relative; width: 460px; height: 997px; flex: none; }
        .device-body {
          position: absolute; inset: 0; border-radius: 62px; padding: 10px; box-sizing: border-box;
          background: oklch(28% 0.010 250);
          box-shadow: 0 0 0 2px hsl(210 8% 62%), 0 40px 90px oklch(12% 0.02 245 / 0.6);
        }
        .device-screen {
          position: relative; width: 100%; height: 100%; border-radius: 52px; overflow: hidden;
          background: hsl(var(--background)); color: hsl(var(--foreground));
          background-image:
            radial-gradient(ellipse 90% 60% at 50% -15%, hsl(182 38% 36% / 0.14), transparent 55%),
            radial-gradient(ellipse 70% 50% at 100% 10%, hsl(186 43% 32% / 0.10), transparent 50%);
          display: flex; flex-direction: column;
        }
        .device-island {
          position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
          width: 126px; height: 37px; border-radius: 20px; background: oklch(12% 0 0); z-index: 9;
        }
        /* The screen's own camera wrapper: scenes push into a card by transforming this. */
        .screen-world { position: absolute; inset: 0; transform-origin: 50% 50%; }
        /* ══ app UI primitives ══════════════════════════════════════════════
           Reproduced from screenshots of the running app (frame.md § The real UI).
           Sizes are the app's REAL sizes — the device is held large in frame
           instead of magnified, and there is NO in-phone camera. Do not scale
           these up "for legibility"; that decision was withdrawn on 18/08.     */

        .app { position: absolute; inset: 0; display: flex; flex-direction: column;
          font-size: 15px; }

        /* — header — */
        .app-header { display: flex; align-items: center; gap: 12px; flex: none;
          padding: 58px 18px 14px; background: hsl(var(--card));
          border-bottom: 1px solid hsl(var(--border) / 0.7); }
        .app-header .brand { display: flex; align-items: center; gap: 10px; order: 1;
          margin-inline-end: auto; }
        .app-header .brand-text { text-align: right; }
        .app-header .brand-text b { display: block; font-size: 23px; font-weight: 800;
          line-height: 1.05; letter-spacing: -0.01em; }
        .app-header .brand-text span { display: block; font-size: 15px;
          color: hsl(var(--muted-foreground)); }
        .app-logo { width: 46px; height: 46px; flex: none; }
        .app-icon { width: 44px; height: 44px; border-radius: 50%; flex: none; order: 2;
          display: grid; place-items: center; border: 1px solid hsl(var(--border));
          background: hsl(var(--card)); box-shadow: var(--shadow-card); }
        .app-icon svg { width: 21px; height: 21px; }
        .app-avatar { width: 44px; height: 44px; border-radius: 50%; flex: none; order: 3;
          display: grid; place-items: center; font-weight: 700; font-size: 19px;
          background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }

        .app-main { flex: 1; min-height: 0; overflow: hidden;
          padding: 18px 18px 0; display: flex; flex-direction: column; gap: 14px; }

        /* — page head — */
        .app-h1 { font-size: 34px; font-weight: 800; line-height: 1.15; margin: 0; }
        .app-sub { font-size: 18px; line-height: 1.35; margin: 0;
          color: hsl(var(--muted-foreground)); }

        /* — period selector: white track, ACTIVE = filled navy — */
        .period { display: flex; gap: 4px; padding: 6px; border-radius: 999px;
          background: hsl(var(--card)); box-shadow: var(--shadow-card); }
        .period > span { flex: 1; text-align: center; border-radius: 999px; padding: 12px 4px;
          font-size: 17px; color: hsl(var(--muted-foreground)); }
        .period > span.on { background: hsl(var(--navy)); color: hsl(var(--navy-foreground));
          font-weight: 700; }

        /* — savings hero: dark navy card — */
        .hero { position: relative; border-radius: 26px; padding: 26px 22px;
          background: var(--gradient-navy); color: hsl(var(--navy-foreground)); }
        .hero-cap { font-size: 14px; font-weight: 700; letter-spacing: 0.10em;
          text-transform: uppercase; color: hsl(var(--navy-muted)); text-align: right; }
        .hero-figure { font-size: 58px; font-weight: 800; line-height: 1.05;
          letter-spacing: -0.02em; text-align: right; margin-top: 18px; }
        .hero-sub { font-size: 15px; color: hsl(var(--navy-muted)); text-align: right;
          margin-top: 8px; }
        .hero-help { position: absolute; top: 22px; left: 22px; width: 40px; height: 40px;
          border-radius: 50%; display: grid; place-items: center; font-size: 18px;
          font-weight: 700; background: hsl(0 0% 100% / 0.10);
          color: hsl(var(--navy-foreground)); }

        /* — stat cards — */
        .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat { border-radius: 22px; padding: 18px; background: hsl(var(--card));
          box-shadow: var(--shadow-card); text-align: right; }
        .stat-lbl { display: flex; align-items: center; gap: 7px;
          font-size: 15px; font-weight: 700; color: hsl(var(--muted-foreground)); }
        .stat-val { font-size: 30px; font-weight: 800; margin-top: 6px; }
        .stat-cap { font-size: 14px; color: hsl(var(--muted-foreground)); margin-top: 2px; }

        /* — cards — */
        .card { border-radius: 26px; background: hsl(var(--card));
          box-shadow: var(--shadow-card); padding: 20px; }
        .card-inset { border-radius: 20px; background: hsl(var(--secondary) / 0.7);
          padding: 16px; }

        /* — deal card: discount pill LEFT, rank badge RIGHT — */
        .deal { position: relative; border-radius: 26px; background: hsl(var(--card));
          box-shadow: var(--shadow-card); padding: 20px; text-align: right; }
        .deal-pct { position: absolute; top: 16px; left: 16px; border-radius: 999px;
          padding: 9px 16px; font-size: 17px; font-weight: 700;
          background: hsl(var(--primary)); color: hsl(182 37% 98%); }
        .deal-rank { position: absolute; top: 16px; right: 16px; width: 42px; height: 42px;
          border-radius: 50%; display: grid; place-items: center; font-size: 18px;
          font-weight: 700; background: hsl(var(--card));
          border: 1px solid hsl(var(--border)); }
        .deal-art { height: 108px; display: grid; place-items: center; margin: 12px 0 6px; }
        .deal-art svg { width: 76px; height: 76px; }
        .deal-store { font-size: 20px; font-weight: 700; }
        .deal-cat { font-size: 15px; color: hsl(var(--muted-foreground)); }
        .deal-title { font-size: 20px; font-weight: 700; margin-top: 10px; line-height: 1.3; }
        /* flex-start, not flex-end: under direction:rtl the row's start edge IS the
           right edge, so flex-end would pack the chips left of a right-aligned card. */
        .deal-meta { display: flex; align-items: center; justify-content: flex-start; gap: 10px;
          margin-top: 12px; }
        .chip { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px;
          padding: 8px 14px; font-size: 15px; background: hsl(var(--secondary));
          color: hsl(var(--secondary-foreground)); }
        .chip-muted { background: transparent; color: hsl(var(--muted-foreground)); }

        /* — tabs: white track, ACTIVE = filled teal — */
        .tabs { display: flex; gap: 4px; padding: 6px; border-radius: 999px;
          background: hsl(var(--card)); box-shadow: var(--shadow-card); }
        .tabs > span { flex: 1; text-align: center; border-radius: 999px; padding: 14px 4px;
          font-size: 18px; color: hsl(var(--foreground)); }
        .tabs > span.on { background: hsl(var(--primary)); color: hsl(182 37% 98%);
          font-weight: 700; }

        /* — signup step rail — */
        .steps { display: flex; gap: 5px; }
        .step { flex: 1; text-align: center; font-size: 14px; padding: 9px 2px;
          border-radius: 999px; background: hsl(var(--muted));
          color: hsl(var(--muted-foreground)); }
        .step.on { background: hsl(var(--primary)); color: hsl(182 37% 98%); font-weight: 700; }

        /* — form — */
        .field { display: flex; align-items: center; justify-content: space-between; gap: 12px;
          border-radius: 18px; background: hsl(var(--secondary) / 0.8);
          border: 1px solid transparent; padding: 18px 20px; font-size: 18px; }
        .field .lbl { color: hsl(var(--muted-foreground)); }
        .field .val { font-weight: 700; }
        .field.is-active { border-color: hsl(var(--primary) / 0.45);
          background: hsl(var(--card)); }

        .btn { display: block; text-align: center; border-radius: 999px; padding: 20px;
          font-size: 22px; font-weight: 700; background: hsl(var(--primary));
          color: hsl(182 37% 98%); }
        .btn-soft { background: hsl(var(--primary) / 0.55); }
        .btn-ghost { background: transparent; color: hsl(var(--primary)); }

        /* — winning stack: teal band + white body — */
        .stack { border-radius: 26px; overflow: hidden; background: hsl(var(--card));
          box-shadow: var(--shadow-card); }
        .stack-band { display: flex; align-items: center; gap: 14px; padding: 20px;
          background: hsl(var(--primary)); color: hsl(182 37% 98%); text-align: right; }
        .stack-band .trophy { width: 46px; height: 46px; border-radius: 50%; flex: none;
          display: grid; place-items: center; background: hsl(0 0% 100% / 0.16); }
        .stack-band b { display: block; font-size: 21px; font-weight: 700; }
        .stack-band span { display: block; font-size: 15px; opacity: 0.85; }
        .stack-body { padding: 24px 20px; text-align: center; }
        .stack-lbl { font-size: 17px; color: hsl(var(--muted-foreground)); }
        .stack-pay { font-size: 52px; font-weight: 800; color: hsl(var(--primary));
          line-height: 1.05; margin: 6px 0 12px; }
        .stack-save { display: inline-flex; align-items: center; gap: 12px; }
        .pill-save { border-radius: 999px; padding: 9px 16px; font-size: 17px; font-weight: 700;
          background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
        .was { font-size: 17px; color: hsl(var(--muted-foreground));
          text-decoration: line-through; }

        /* — one stack step — */
        .sstep { border-radius: 22px; background: hsl(var(--secondary) / 0.75); padding: 18px;
          text-align: right; }
        .sstep-top { display: flex; align-items: flex-start; gap: 12px; }
        .sstep-n { width: 40px; height: 40px; border-radius: 50%; flex: none; order: 1;
          display: grid; place-items: center; font-size: 18px; font-weight: 700;
          background: hsl(var(--primary)); color: hsl(182 37% 98%); }
        .sstep-id { flex: 1; order: 2; }
        .sstep-id b { display: block; font-size: 19px; font-weight: 700; line-height: 1.3; }
        .sstep-off { order: 3; text-align: left; }
        .sstep-off .pct { border-radius: 999px; padding: 8px 14px; font-size: 16px;
          font-weight: 700; background: hsl(var(--accent));
          color: hsl(var(--accent-foreground)); }
        .sstep-off .amt { display: block; margin-top: 7px; font-size: 17px; font-weight: 700;
          color: hsl(var(--primary)); }
        .sstep-rows { margin-top: 14px; padding-top: 14px;
          border-top: 1px solid hsl(var(--border) / 0.8); }
        .sstep-rows > div { display: flex; justify-content: space-between; gap: 12px;
          font-size: 17px; padding: 3px 0; }
        .sstep-rows .k { color: hsl(var(--muted-foreground)); }
        .sstep-rows .v { font-weight: 700; }
        .sstep-btns { display: flex; justify-content: center; gap: 12px; margin-top: 14px; }
        .sstep-btns > span { border-radius: 999px; padding: 10px 18px; font-size: 16px;
          background: hsl(var(--card)); border: 1px solid hsl(var(--border));
          display: inline-flex; align-items: center; gap: 8px; }

        /* — club match row: mint card + right-filling progress track — */
        .club { border-radius: 22px; background: hsl(var(--secondary) / 0.75); padding: 18px;
          text-align: right; }
        .club-top { display: flex; align-items: center; gap: 12px; }
        .club-n { width: 42px; height: 42px; border-radius: 50%; flex: none; order: 1;
          display: grid; place-items: center; font-size: 18px; font-weight: 700;
          background: hsl(var(--card)); }
        .club-id { flex: 1; order: 2; }
        .club-id b { display: block; font-size: 20px; font-weight: 700; }
        .club-id span { display: block; font-size: 16px; color: hsl(var(--muted-foreground)); }
        .club-pct { order: 3; border-radius: 999px; padding: 8px 14px; font-size: 16px;
          font-weight: 700; background: hsl(var(--accent));
          color: hsl(var(--accent-foreground)); }
        .club-track { height: 12px; border-radius: 999px; background: hsl(var(--card));
          margin-top: 14px; overflow: hidden; display: flex; justify-content: flex-start; }
        .club-fill { height: 100%; border-radius: 999px; background: hsl(var(--primary));
          transform-origin: right center; }

        /* — settings rows — */
        .srow { display: flex; align-items: center; gap: 14px; padding: 18px 4px;
          text-align: right; }
        .srow-ic { width: 46px; height: 46px; border-radius: 50%; flex: none; order: 1;
          display: grid; place-items: center; background: hsl(var(--accent));
          color: hsl(var(--accent-foreground)); }
        .srow-ic svg { width: 21px; height: 21px; }
        .srow-tx { flex: 1; order: 2; }
        .srow-tx b { display: block; font-size: 20px; font-weight: 700; }
        .srow-tx span { display: block; font-size: 16px; color: hsl(var(--muted-foreground)); }
        .srow-ch { order: 3; color: hsl(var(--muted-foreground)); }

        /* — preference chips — */
        .pchip { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px;
          padding: 12px 18px; font-size: 17px; background: hsl(var(--card));
          border: 1px solid hsl(var(--border)); }
        .pchip.on { background: hsl(var(--accent)); border-color: hsl(var(--primary) / 0.5);
          color: hsl(var(--accent-foreground)); }

        /* — bottom nav: navy bar, ACTIVE = teal pill — */
        .nav { flex: none; margin: 12px 16px 28px; display: flex; align-items: center;
          border-radius: 999px; padding: 9px; background: var(--gradient-navy);
          box-shadow: var(--shadow-float); }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
          border-radius: 999px; padding: 12px 4px; font-size: 13px; font-weight: 500;
          color: hsl(var(--navy-muted)); }
        .nav-tab svg { width: 22px; height: 22px; }
        .nav-tab.on { background: hsl(var(--primary)); color: hsl(182 37% 98%);
          font-weight: 700; }

        .toast { border-radius: 22px; padding: 18px 20px; background: hsl(var(--card));
          border: 1px solid hsl(var(--border)); box-shadow: var(--shadow-float);
          font-size: 18px; text-align: right; }

        /* Oversized macOS-style pointer for cursor-led scenes. */
        .cursor { position: absolute; width: 46px; height: 46px; z-index: 20;
          filter: drop-shadow(0 4px 10px oklch(15% 0.02 245 / 0.45)); pointer-events: none; }
      </style>
    </template>
  </body>
</html>
