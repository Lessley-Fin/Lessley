      <script>
        (function () {
          var ID = "03-signup-account";
          var ROOT = document.querySelector('[data-composition-id="' + ID + '"]') || document;
          function el(id) { return ROOT.querySelector('[id="' + id + '"]'); }
          function all(sel) { return Array.prototype.slice.call(ROOT.querySelectorAll(sel)); }

          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          window.__timelines[ID] = tl;

          function whip(target, at, offset, dur) {
            tl.fromTo(target, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, at);
            tl.fromTo(target, { y: offset }, { y: 0, duration: dur, ease: "power4.out" }, at);
          }
          function rise(target, at, dur, dy) {
            tl.fromTo(
              target,
              { y: dy, opacity: 0 },
              { y: 0, opacity: 1, duration: dur, ease: "power3.out" },
              at
            );
          }

          // .field idle vs focused, straight off the shared primitive:
          // idle   background hsl(var(--secondary) / 0.8), transparent border
          // active background hsl(var(--card)),            border hsl(var(--primary) / 0.45)
          var IDLE_BG = "rgba(235,242,245,0.8)";
          var LIVE_BG = "rgba(255,255,255,1)";
          var IDLE_BD = "rgba(57,124,127,0)";
          var LIVE_BD = "rgba(57,124,127,0.45)";

          // discrete-text-sequence — smooth character slice (plain typing, no edits)
          // plus a deterministic sin square-wave caret on the same timeline.
          function typeInto(textEl, caretEl, full, at, dur) {
            var st = { n: 0 };
            tl.fromTo(
              st, { n: 0 },
              {
                n: full.length, duration: dur, ease: "power1.inOut", immediateRender: false,
                onUpdate: function () { textEl.textContent = full.substring(0, Math.floor(st.n)); }
              },
              at
            );
            var span = dur + 0.6;
            var cycles = Math.max(1, Math.round(span / 0.62));
            var bl = { p: 0 };
            tl.fromTo(
              bl, { p: 0 },
              {
                p: Math.PI * 2 * cycles, duration: span, ease: "none", immediateRender: false,
                onUpdate: function () {
                  caretEl.style.opacity = Math.sin(bl.p) > 0 ? "1" : "0.12";
                }
              },
              at - 0.18
            );
            tl.fromTo(
              caretEl, { opacity: 0.12 },
              { opacity: 0, duration: 0.20, ease: "none", immediateRender: false },
              at + span - 0.18
            );
          }

          // cursor-click-ripple — move (eased) → click depression → single expanding ring
          var cursor = el("f03-cursor");
          function moveTo(fx, fy, x, y, at, dur, first) {
            tl.fromTo(
              cursor,
              { x: fx, y: fy },
              { x: x, y: y, duration: dur, ease: "power3.out", immediateRender: !!first },
              at
            );
          }
          function click(ripple, field, at) {
            tl.fromTo(cursor, { scale: 1 }, { scale: 0.84, duration: 0.09, ease: "power2.in", immediateRender: false }, at);
            tl.fromTo(cursor, { scale: 0.84 }, { scale: 1, duration: 0.09, ease: "power2.out", immediateRender: false }, at + 0.09);
            tl.fromTo(field, { scale: 1 }, { scale: 0.965, duration: 0.09, ease: "power2.in", immediateRender: false }, at);
            tl.fromTo(field, { scale: 0.965 }, { scale: 1, duration: 0.09, ease: "power2.out", immediateRender: false }, at + 0.09);
            tl.fromTo(
              ripple, { scale: 0, opacity: 0.85 },
              { scale: 3.4, opacity: 0, duration: 0.72, ease: "power2.out", immediateRender: false },
              at + 0.04
            );
          }
          function activate(field, at) {
            tl.fromTo(
              field,
              { borderColor: IDLE_BD, backgroundColor: IDLE_BG },
              { borderColor: LIVE_BD, backgroundColor: LIVE_BG, duration: 0.26, ease: "power2.out", immediateRender: false },
              at
            );
          }
          function deactivate(field, at) {
            tl.fromTo(
              field,
              { borderColor: LIVE_BD, backgroundColor: LIVE_BG },
              { borderColor: IDLE_BD, backgroundColor: IDLE_BG, duration: 0.30, ease: "power2.out", immediateRender: false },
              at
            );
          }

          /* ---- persistent rail ---------------------------------------------- */
          gsap.set(el("f03-rail"), { scaleX: 0.111 });
          tl.fromTo(el("f03-rail"), { scaleX: 0.111 }, { scaleX: 0.149, duration: 10, ease: "none" }, 0);

          gsap.set([el("f03-r1"), el("f03-r2"), el("f03-r3"), el("f03-r4")],
                   { xPercent: -50, yPercent: -50, scale: 0 });
          gsap.set(cursor, { x: 300, y: 1060 });

          /* ---- 0.0–2.9s — the cut lands and the wizard builds itself --------- */
          // No camera and no entry settle: the phone is simply there on frame 0 and
          // the screen fills with staged reveals.
          tl.fromTo(el("f03-glow"), { opacity: 0.5 }, { opacity: 0.86, duration: 1.2, ease: "power2.out" }, 0);

          whip(el("f03-title"), 0.12, 80, 0.18);
          tl.fromTo(el("f03-underline"), { scaleX: 0 }, { scaleX: 1, duration: 0.44, ease: "power3.out" }, 0.28);

          rise(el("f03-back"), 0.18, 0.36, 18);

          // waterfall-entry — the five-step rail arrives as one accelerating wave
          var steps = all(".f03-steps .step");
          var F = 1 / 60;
          var st = 0.42;
          var sOff = [66, 52, 48, 46, 44];
          var sDur = [0.16, 0.13, 0.12, 0.11, 0.11];
          for (var s = 0; s < steps.length; s++) {
            whip(steps[s], st, sOff[s], sDur[s]);
            st = st + sDur[s] - (s < 2 ? 0 : F);
          }
          // step 1 becomes the live step — the rail that stays lit through frame 07
          tl.fromTo(
            el("f03-step1"),
            { backgroundColor: "rgb(235,240,243)", color: "rgb(105,115,124)", fontWeight: 400 },
            {
              backgroundColor: "rgb(57,124,127)", color: "rgb(248,253,253)", fontWeight: 700,
              duration: 0.36, ease: "power2.out", immediateRender: false
            },
            0.96
          );
          whip(el("f03-kicker"), 1.00, 30, 0.12);
          whip(el("f03-b1"), 0.50, 44, 0.14);

          // the account card, then its contents — content arriving, one beat at a time
          rise(el("f03-card"), 1.18, 0.44, 34);
          rise(el("f03-ctitle"), 1.44, 0.34, 20);
          rise(el("f03-about"), 1.60, 0.30, 16);
          rise(el("f03-f1"), 1.78, 0.34, 26);
          rise(el("f03-f2"), 1.93, 0.34, 26);
          rise(el("f03-f3"), 2.06, 0.34, 26);
          rise(el("f03-f4"), 2.18, 0.34, 26);
          rise(el("f03-btnwrap"), 2.36, 0.38, 24);
          rise(el("f03-foot"), 2.54, 0.34, 16);

          /* ---- 2.42–8.48s — the cursor drives the four fields. The cut comes out
             of travel and post-typing dwell, not out of the typing itself. ------ */
          tl.fromTo(cursor, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 2.42);
          moveTo(300, 1060, 130, 336, 2.46, 0.54, true);
          click(el("f03-r1"), el("f03-f1"), 3.06);
          activate(el("f03-f1"), 3.10);
          typeInto(el("f03-t1"), el("f03-c1"), "dor.h", 3.24, 0.72);

          deactivate(el("f03-f1"), 4.10);
          moveTo(130, 336, 130, 414, 4.10, 0.38, false);
          click(el("f03-r2"), el("f03-f2"), 4.54);
          activate(el("f03-f2"), 4.58);
          typeInto(el("f03-t2"), el("f03-c2"), "dor@example.com", 4.72, 1.08);

          deactivate(el("f03-f2"), 5.96);
          moveTo(130, 414, 130, 492, 5.96, 0.34, false);
          click(el("f03-r3"), el("f03-f3"), 6.36);
          activate(el("f03-f3"), 6.40);
          typeInto(el("f03-t3"), el("f03-c3"), "••••••••", 6.52, 0.62);

          deactivate(el("f03-f3"), 7.30);
          moveTo(130, 492, 130, 570, 7.30, 0.34, false);
          click(el("f03-r4"), el("f03-f4"), 7.70);
          activate(el("f03-f4"), 7.74);
          typeInto(el("f03-t4"), el("f03-c4"), "••••••••", 7.86, 0.62);

          /* ---- stage explainer — the locked script gives this frame two body
             lines, so the third late beat (f03-b3) is retired with its element. --- */
          whip(el("f03-b2"), 3.84, 46, 0.15);

          /* ---- 8.68–10.0s — the cursor rests on המשך; nothing is submitted --- */
          deactivate(el("f03-f4"), 8.68);
          moveTo(130, 570, 220, 656, 8.68, 0.52, false);
          // spring-pop-entrance — the hover backdrop blooms under the primary action
          tl.fromTo(
            el("f03-halo"),
            { scale: 0.82, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.54, ease: "power3.out", immediateRender: false },
            9.32
          );
          // the glow answers the finished form — a one-shot reaction, not a loop
          tl.fromTo(
            el("f03-glow"),
            { opacity: 0.86 },
            { opacity: 0.98, duration: 0.60, ease: "power2.out", immediateRender: false },
            9.40
          );
        })();
      </script>
