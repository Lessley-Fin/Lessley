              {
                p: Math.PI * 2 * cycles, duration: span, ease: "none", immediateRender: false,
                onUpdate: function () {
                  caretEl.style.opacity = Math.sin(bl.p) > 0 ? "1" : "0.12";
                }
              },
              at - 0.20
            );
            tl.fromTo(
              caretEl, { opacity: 0.12 },
              { opacity: 0, duration: 0.22, ease: "none", immediateRender: false },
              at + span - 0.20
            );
          }

          // cursor-click-ripple — move (eased) → click depression → single expanding ring
          var cursor = el("f03-cursor");
          function moveTo(fx, fy, x, y, at, dur, first) {
            tl.fromTo(
              cursor,
              { x: fx, y: fy },
              { x: x, y: y, duration: dur, ease: "power3.out", immediateRender: !!first },
              at
            );
          }
          function click(ripple, field, at) {
            tl.fromTo(cursor, { scale: 1 }, { scale: 0.84, duration: 0.09, ease: "power2.in", immediateRender: false }, at);
            tl.fromTo(cursor, { scale: 0.84 }, { scale: 1, duration: 0.09, ease: "power2.out", immediateRender: false }, at + 0.09);
            tl.fromTo(field, { scale: 1 }, { scale: 0.965, duration: 0.09, ease: "power2.in", immediateRender: false }, at);
            tl.fromTo(field, { scale: 0.965 }, { scale: 1, duration: 0.09, ease: "power2.out", immediateRender: false }, at + 0.09);
            tl.fromTo(
              ripple, { scale: 0, opacity: 0.85 },
              { scale: 3.4, opacity: 0, duration: 0.72, ease: "power2.out", immediateRender: false },
              at + 0.04
            );
          }
          function activate(field, at) {
            tl.fromTo(
              field,
              { borderColor: IDLE, boxShadow: GHOST },
              { borderColor: LIVE, boxShadow: RING, duration: 0.26, ease: "power2.out", immediateRender: false },
              at
            );
          }
          function deactivate(field, at) {
            tl.fromTo(
              field,
              { borderColor: LIVE, boxShadow: RING },
              { borderColor: IDLE, boxShadow: GHOST, duration: 0.30, ease: "power2.out", immediateRender: false },
              at
            );
          }

          /* ---- persistent rail ---------------------------------------------- */
          gsap.set(el("f03-rail"), { scaleX: 0.111 });
          tl.fromTo(el("f03-rail"), { scaleX: 0.111 }, { scaleX: 0.149, duration: 12, ease: "none" }, 0);

          gsap.set([el("f03-r1"), el("f03-r2"), el("f03-r3")], { xPercent: -50, yPercent: -50, scale: 0 });
          gsap.set(cursor, { x: 330, y: 1010 });

          /* ---- Scene 1 (0.0–2.2s) — the cut lands, the wizard lights up ------ */
          // Entry: the phone is on screen at t=0 and settles out of frame 02's forward
          // creep — a short decelerating scale-down, mirrored against that vector.
          tl.fromTo(el("f03-world"), { scale: 1.07 }, { scale: 1, duration: 0.62, ease: "power3.out" }, 0);
          tl.fromTo(
            el("f03-world"), { filter: "blur(3px)" },
            { filter: "blur(0px)", duration: 0.38, ease: "power2.out" },
            0
          );
          tl.fromTo(el("f03-glow"), { opacity: 0.5 }, { opacity: 0.86, duration: 1.4, ease: "power2.out" }, 0);

          whip(el("f03-title"), 0.14, 80, 0.20);
          tl.fromTo(el("f03-underline"), { scaleX: 0 }, { scaleX: 1, duration: 0.52, ease: "power3.out" }, 0.34);

          rise(el("f03-hdr"), 0.34, 0.45, 20);

          // waterfall-entry — the five-step rail arrives as one accelerating wave
          var steps = all(".f03-steps .step");
          var F = 1 / 60;
          var st = 0.56;
          var sOff = [66, 52, 48, 46, 44];
          var sDur = [0.18, 0.15, 0.14, 0.13, 0.13];
          for (var s = 0; s < steps.length; s++) {
            whip(steps[s], st, sOff[s], sDur[s]);
            st = st + sDur[s] - (s < 2 ? 0 : F);
          }
          // step 1 becomes the live step — the rail that stays lit through frame 7
          tl.fromTo(
            el("f03-step1"),
            { backgroundColor: "hsl(198 28% 94%)", color: "hsl(208 11% 46%)", fontWeight: 400 },
            {
              backgroundColor: "hsl(182 38% 36%)", color: "hsl(182 37% 98%)", fontWeight: 700,
              duration: 0.42, ease: "power2.out", immediateRender: false
            },
            1.18
          );
          whip(el("f03-kicker"), 1.24, 30, 0.14);

          rise(el("f03-titlein"), 1.32, 0.46, 22);
          rise(el("f03-card"), 1.58, 0.55, 34);
          rise(el("f03-foot"), 2.00, 0.45, 18);
          whip(el("f03-b1"), 1.66, 44, 0.16);

          /* ---- camera phase 1 (1.9–3.1s) — partial travel toward the field --- */
          // The in-phone camera pins its origin on the password field's centre
          // (50% / 55.26% of the 410x912 screen); the unscaled y offset walks the
          // target to the middle of the screen as the scale ramps.
          var world = el("f03-screenworld");
          gsap.set(world, { transformOrigin: "50% 55.263%" });
          tl.fromTo(world, { scale: 1, y: 0 }, { scale: 1.26, y: -25, duration: 1.20, ease: "power2.inOut" }, 1.90);

          /* ---- Scene 2 (2.1–9.0s) — the cursor drives the form -------------- */
          tl.fromTo(cursor, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 2.06);
          moveTo(330, 1010, 205, 340, 2.10, 0.78, true);
          click(el("f03-r1"), el("f03-f1"), 2.98);
          activate(el("f03-f1"), 3.02);
          typeInto(el("f03-t1"), el("f03-c1"), "dor.h", 3.24, 1.10);

          deactivate(el("f03-f1"), 4.52);
          moveTo(205, 340, 205, 422, 4.52, 0.58, false);
          click(el("f03-r2"), el("f03-f2"), 5.18);
          activate(el("f03-f2"), 5.22);
          typeInto(el("f03-t2"), el("f03-c2"), "dor@example.com", 5.42, 1.58);

          deactivate(el("f03-f2"), 7.18);
          moveTo(205, 422, 205, 504, 7.18, 0.52, false);
          click(el("f03-r3"), el("f03-f3"), 7.80);
          activate(el("f03-f3"), 7.84);
          typeInto(el("f03-t3"), el("f03-c3"), "••••••••", 8.02, 1.10);

          /* ---- stage explainer — paced to the three voiceover sentences ------ */
          whip(el("f03-b2"), 4.80, 46, 0.17);
          whip(el("f03-b3"), 8.30, 42, 0.15);

          /* ---- camera phase 2 (7.4–9.5s) — lock onto the camera target ------- */
          tl.fromTo(
            world, { scale: 1.26, y: -25 },
            { scale: 1.60, y: -48, duration: 2.10, ease: "power2.inOut", immediateRender: false },
            7.40
          );

          /* ---- Scene 3 (9.6–12.0s) — the payoff: the cursor rests on המשך ---- */
          deactivate(el("f03-f3"), 9.62);
          moveTo(205, 504, 205, 592, 9.72, 0.80, false);
          // spring-pop-entrance — the hover backdrop blooms under the primary action
          tl.fromTo(
            el("f03-halo"),
            { scale: 0.82, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out", immediateRender: false },
            10.48
          );
          // the camera settles with a slow forward creep — a live, not frozen, hold
          tl.fromTo(
            world, { scale: 1.60 },
            { scale: 1.665, duration: 2.50, ease: "power1.in", immediateRender: false },
            9.50
          );
        })();
      </script>
    </template>
