                    <svg class="rm-navico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">

  </div>

  <script>
    (function () {
      var ID = "17-recs-matches";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var q = function (s) { return root.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines[ID] = tl;

      /* ── in-phone camera ──────────────────────────────────────────────── */
      var world = q("#rm-world");
      var W = world.offsetWidth || 410;
      var H = world.offsetHeight || 912;

      function centerOf(el, fallbackY) {
        var px = W / 2, py = fallbackY, t = 0, l = 0, n = el, guard = 0;
        while (n && n !== world && guard < 24) { t += n.offsetTop; l += n.offsetLeft; n = n.offsetParent; guard++; }
        if (n === world && el.offsetHeight) { py = t + el.offsetHeight / 2; px = l + el.offsetWidth / 2; }
        return { x: px, y: py };
      }
      function cam(p, s) { return { scale: s, x: -(p.x - W / 2) * s, y: -(p.y - H / 2) * s }; }

      var pCard = centerOf(q("#rm-card"), H * 0.47);
      var camIn = cam(pCard, 1.45);
      var camEnd = cam(pCard, 1.52);

      var F = 1 / 60;

      function whip(sel, off, dur, at) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, at);
        tl.fromTo(sel, { y: off }, { y: 0, duration: dur, ease: "power4.out" }, at);
      }
      function pop(sel, from, dur, at, rise) {
        tl.fromTo(sel,
          { scale: from, opacity: 0, y: rise || 0 },
          { scale: 1, opacity: 1, y: 0, duration: dur, ease: "power3.out" }, at);
      }
      function wipe(sel, dur, at) {
        tl.fromTo(sel,
          { clipPath: "inset(0px 0px 0px 100%)", opacity: 1 },
          { clipPath: "inset(0px 0px 0px 0%)", duration: dur, ease: "power2.out" }, at);
      }

      /* persistent rail: 16/21 -> 17/21 */
      tl.fromTo("#rm-rail", { scaleX: 0.7619 }, { scaleX: 0.8095, duration: 15, ease: "none" }, 0);

      /* ── Scene 1 (0.0–2.6s): the screen settles, the board sets up ────── */
      tl.fromTo(world, { scale: 1.05, x: 0, y: 0 },
        { scale: 1, x: 0, y: 0, duration: 0.55, ease: "power3.out" }, 0);

      tl.fromTo("#rm-header", { opacity: 0, y: -16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.04);
      tl.fromTo("#rm-chapter", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.1);

      whip("#rm-t1", 80, 0.18, 0.15);
      whip("#rm-t2", 62, 0.16, 0.15 + 0.18 + 2 * F);
      tl.fromTo("#rm-rule-fill", { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.62);
      whip("#rm-apph1", 48, 0.16, 0.50);
      tl.fromTo("#rm-appsub", { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.70);
      whip("#rm-p1", 44, 0.15, 1.05);

      qa(".rm-tab").forEach(function (el, i) {
        tl.fromTo(el, { opacity: 0, y: 16, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "power3.out" }, 1.55 + i * 0.09);
      });

      /* ── Scene 2 (2.0–5.6s): the card lands and the score is COMPUTED ── */
      pop("#rm-card", 0.9, 0.62, 2.05, 24);
      whip("#rm-club", 34, 0.15, 2.38);
      tl.fromTo("#rm-clubsub", { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 2.56);

      // coordinate-target-zoom: push into the match card and hold
      tl.fromTo(world, { scale: 1, x: 0, y: 0 },
        { scale: camIn.scale, x: camIn.x, y: camIn.y, duration: 2.0, ease: "power2.inOut", immediateRender: false }, 2.60);

      pop("#rm-ringwrap", 0.86, 0.5, 2.90);

      // svg-path-draw — measured, never guessed
      var ring = q("#rm-prog");
      var LEN = (ring.getTotalLength && ring.getTotalLength()) || 314.159;
      ring.style.strokeDasharray = String(LEN);
      ring.style.strokeDashoffset = String(LEN);

      var DRAW_AT = 3.55, DRAW_DUR = 1.9, PCT = 0.72;
      tl.fromTo(ring, { strokeDashoffset: LEN },
        { strokeDashoffset: LEN * (1 - PCT), duration: DRAW_DUR, ease: "power2.out" }, DRAW_AT);

      // counting-dynamic-scale — number and ring share start, ease and duration
      var pctEl = q("#rm-pctval");
      var counter = { v: 0 };
      tl.fromTo(counter, { v: 0 }, {
        v: 72, duration: DRAW_DUR, ease: "power2.out",
        onUpdate: function () { pctEl.textContent = Math.round(counter.v); }
      }, DRAW_AT);
      tl.fromTo("#rm-pctval", { scale: 0.82 },
        { scale: 1, duration: DRAW_DUR, ease: "power2.out" }, DRAW_AT);

      /* ── Scene 3 (5.5–8.0s): the badge lands as the draw completes ───── */
      pop("#rm-badge", 0, 0.5, DRAW_AT + DRAW_DUR - 0.05);

      // stat-bars-and-fills: 7 of the 10 stores light up
      qa(".rm-hit").forEach(function (el, i) {
        tl.fromTo(el, { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 6.30 + i * 0.12);
      });

      /* ── Scene 4 (7.9–12.4s): the ranking below it ───────────────────── */
      whip("#rm-p2", 46, 0.16, 7.90);

      whip("#rm-run1", 44, 0.16, 8.90);
      tl.fromTo("#rm-fill1", { scaleX: 0 },
        { scaleX: 0.61, duration: 0.9, ease: "power2.out" }, 9.25);
      whip("#rm-run2", 42, 0.15, 9.85);
      tl.fromTo("#rm-fill2", { scaleX: 0 },
        { scaleX: 0.48, duration: 0.9, ease: "power2.out" }, 10.20);

      // ambient-glow-bloom behind the hero card
      tl.fromTo("#rm-cardglow", { opacity: 0 },
        { opacity: 0.55, duration: 1.0, ease: "power2.out" }, 11.30);
      tl.fromTo("#rm-cardglow", { opacity: 0.55 },
        { opacity: 0.34, duration: 1.1, ease: "power1.inOut", immediateRender: false }, 12.40);

      /* ── Scene 5 (12.4–15s): focus resolves on the leader ────────────── */
      tl.fromTo("#rm-runs", { opacity: 1, filter: "blur(0px)" },
        { opacity: 0.5, filter: "blur(2.4px)", duration: 1.1, ease: "power2.inOut", immediateRender: false }, 13.10);

      tl.fromTo(world, { scale: camIn.scale, x: camIn.x, y: camIn.y },
        { scale: camEnd.scale, x: camEnd.x, y: camEnd.y, duration: 2.6, ease: "none", immediateRender: false }, 12.40);
    })();
  </script>
</template>
