          var letters = all(".f01-wordmark i");
          var lt = 0.62;
          var lOff = [70, 48, 44, 44, 42, 40, 74];
          var lDur = [0.18, 0.15, 0.14, 0.14, 0.13, 0.13, 0.17];
          var lGap = [2 * F, -F, -F, -F, -2 * F, -2 * F, 0];
          for (var i = 0; i < letters.length; i++) {
            whip(letters[i], lt, lOff[i], lDur[i]);
            lt = lt + lDur[i] + lGap[i];
          }

          // title — the cascade's anchor beat, then the accent underline sweeps beneath it
          whip(el("f01-title"), 1.30, 80, 0.20);
          tl.fromTo(el("f01-underline"), { scaleX: 0 }, { scaleX: 1, duration: 0.52, ease: "power3.out" }, 1.48);
          whip(el("f01-b1"), 1.74, 46, 0.16);
          whip(el("f01-b2"), 1.96, 42, 0.15);

          /* ---- Scene 2 (2.3–3.6s) — the carrier is born --------------------- */
          // the phone rises from below and lands; the background reacts to the landing
          tl.fromTo(
            el("f01-anchor"),
            { y: 1180, scale: 1.05 },
            { y: 0, scale: 1, duration: 1.05, ease: "power3.out" },
            2.30
          );
          tl.fromTo(el("f01-glow"), { opacity: 0.55 }, { opacity: 0.9, duration: 0.9, ease: "power2.out", immediateRender: false }, 2.55);
          tl.fromTo(el("f01-grid"), { y: -18 }, { y: 0, duration: 0.75, ease: "power2.out" }, 3.05);

          /* ---- Scene 3 (3.4–8.0s) — the screen fills, on the voiceover cues -- */
          rise(el("f01-hdr"), 3.40, 0.52, 22);
          pop(el("f01-brandcard"), 3.94, 0.60, 0.88);
          rise(el("f01-herocard"), 4.62, 0.60, 30);

          // counting-dynamic-scale — value + transform scale share position, duration and ease
          var countEl = el("f01-count");
          var cState = { v: 0 };
          tl.fromTo(
            cState,
            { v: 0 },
            {
              v: 1284, duration: 2.2, ease: "power3.out",
              onUpdate: function () { countEl.textContent = group(cState.v); }
            },
            5.10
          );
          tl.fromTo(el("f01-fig"), { scale: 0.62 }, { scale: 1, duration: 2.2, ease: "power3.out" }, 5.10);

          rise(el("f01-inforow"), 6.85, 0.50, 20);
          rise(el("f01-nav"), 7.35, 0.60, 46);

          // the glow answers the payoff landing — reaction, never idle breathing
          tl.fromTo(el("f01-glow"), { scale: 1, opacity: 0.9 }, { scale: 1.14, opacity: 1, duration: 0.40, ease: "power2.out", immediateRender: false }, 8.10);
          tl.fromTo(el("f01-glow"), { scale: 1.14, opacity: 1 }, { scale: 1.02, opacity: 0.86, duration: 0.95, ease: "power2.out", immediateRender: false }, 8.52);

          /* ---- Scene 4 (8.6–12.2s) — the camera travels into the lockup ------ */
          // The in-phone camera: transform-origin pinned on the brand card's centre
          // (50% / 32.18% of the 410x912 screen), so the scale pins the target and the
          // unscaled y offset walks it to the middle of the screen.
          var world = el("f01-screenworld");
          gsap.set(world, { transformOrigin: "50% 32.18%" });
          tl.fromTo(world, { scale: 1, y: 0 }, { scale: 1.55, y: 162, duration: 3.60, ease: "power2.inOut" }, 8.60);

          /* ---- Scene 5 (12.2–15.0s) — the Z-forward push into the screen ----- */
          // Exit vector for the seam: accelerating (power3.in), still moving at the last frame.
          tl.to(world, { scale: 2.90, duration: 2.80, ease: "power3.in" }, 12.20);
          tl.fromTo(el("f01-world"), { scale: 1 }, { scale: 1.30, duration: 2.80, ease: "power3.in" }, 12.20);
          tl.fromTo(
            el("f01-textcol"),
            { filter: "blur(0px)" },
            { filter: "blur(7px)", duration: 2.80, ease: "power3.in" },
            12.20
          );
        })();
      </script>
    </template>
