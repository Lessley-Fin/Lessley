      <div class="rail"><i id="ms-rail"></i></div>
    </div>
  </div>

  <script>
    (function () {
      var ID = "18-recs-missed";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var q = function (s) { return root.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines[ID] = tl;

      /* ── in-phone camera ──────────────────────────────────────────────── */
      var world = q("#ms-world");
      var W = world.offsetWidth || 410;
      var H = world.offsetHeight || 912;

      function centerOf(el, fallbackY) {
        var px = W / 2, py = fallbackY, t = 0, l = 0, n = el, guard = 0;
        while (n && n !== world && guard < 24) { t += n.offsetTop; l += n.offsetLeft; n = n.offsetParent; guard++; }
        if (n === world && el.offsetHeight) { py = t + el.offsetHeight / 2; px = l + el.offsetWidth / 2; }
        return { x: px, y: py };
      }
      function cam(p, s) { return { scale: s, x: -(p.x - W / 2) * s, y: -(p.y - H / 2) * s }; }

      var pCard = centerOf(q("#ms-card"), H * 0.42);
      var pBands = centerOf(q("#ms-bands"), H * 0.76);
      var camA = cam(pCard, 1.30);
      var camB = cam(pBands, 1.48);
      var camEnd = cam(pBands, 1.53);

      var F = 1 / 60;

      // waterfall-entry: BINARY opacity, then the y whip
      function whip(sel, off, dur, at) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, at);
        tl.fromTo(sel, { y: off }, { y: 0, duration: dur, ease: "power4.out" }, at);
      }
      function pop(sel, from, dur, at, rise) {
        tl.fromTo(sel,
          { scale: from, opacity: 0, y: rise || 0 },
          { scale: 1, opacity: 1, y: 0, duration: dur, ease: "power3.out" }, at);
      }
      function wipe(sel, dur, at) {
        tl.fromTo(sel,
          { clipPath: "inset(0px 0px 0px 100%)", opacity: 1 },
          { clipPath: "inset(0px 0px 0px 0%)", duration: dur, ease: "power2.out" }, at);
      }

      /* persistent rail: 17/21 -> 18/21 */
      tl.fromTo("#ms-rail", { scaleX: 0.8095 }, { scaleX: 0.8571, duration: 18, ease: "none" }, 0);

      /* ── Scene 1 (0.0–1.6s): title sets the concept ──────────────────── */
      tl.fromTo(world, { scale: 1.05, x: 0, y: 0 },
        { scale: 1, x: 0, y: 0, duration: 0.55, ease: "power3.out" }, 0);

      tl.fromTo("#ms-header", { opacity: 0, y: -16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.04);
      tl.fromTo("#ms-chapter", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.1);

      whip("#ms-t1", 80, 0.18, 0.15);
      whip("#ms-t2", 62, 0.16, 0.15 + 0.18 + 2 * F);
      whip("#ms-t3", 50, 0.14, 0.15 + 0.18 + 0.16 + F);
      tl.fromTo("#ms-rule-fill", { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.72);

      qa(".ms-tab").forEach(function (el, i) {
        tl.fromTo(el, { opacity: 0, y: 16, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "power3.out" }, 0.62 + i * 0.09);
      });
      whip("#ms-p1", 44, 0.15, 1.10);

      /* ── Scene 2 (1.6–8.8s): tab A arrives from the RIGHT wing ───────── */
      // split-tilt-cards: mirrored book-open entry, +tilt from the right
      tl.fromTo("#ms-missed",
        { x: 250, rotateY: 24, scale: 0.9, opacity: 0 },
        { x: 0, rotateY: 0, scale: 1, opacity: 1, duration: 0.95, ease: "power3.out" }, 1.60);

      // copy fades up during the settle, not after
      tl.fromTo("#ms-missed-h", { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 2.05);
      tl.fromTo("#ms-missed-s", { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 2.20);

      // coordinate-target-zoom onto the missed-savings card
      tl.fromTo(world, { scale: 1, x: 0, y: 0 },
        { scale: camA.scale, x: camA.x, y: camA.y, duration: 2.3, ease: "power2.inOut", immediateRender: false }, 2.55);

      whip("#ms-store", 34, 0.15, 3.00);
      wipe("#ms-lbl", 0.45, 3.45);

      // the savings payoff — the one gold spend in this scene
      pop("#ms-amt", 0, 0.5, 3.60);
      var amtEl = q("#ms-amtval");
      var amt = { v: 0 };
      tl.fromTo(amt, { v: 0 }, {
        v: 340, duration: 0.9, ease: "power2.out",
        onUpdate: function () { amtEl.textContent = Math.round(amt.v); }
      }, 3.60);

      // the stage glow answers the payoff (never idles — it reacts)
      tl.fromTo("#ms-goldglow", { opacity: 0 },
        { opacity: 0.62, duration: 0.85, ease: "power2.out" }, 4.45);
      tl.fromTo("#ms-goldglow", { opacity: 0.62 },
        { opacity: 0.3, duration: 1.3, ease: "power1.inOut", immediateRender: false }, 5.90);

      wipe("#ms-meta", 0.5, 6.10);
      pop("#ms-cat", 0, 0.45, 6.90);
      wipe("#ms-club", 0.6, 8.15);

      /* ── Scene 3 (9.3–13.8s): tab B arrives from the LEFT wing ───────── */
      tl.fromTo("#ms-shops",
        { x: -250, rotateY: -24, scale: 0.9, opacity: 0 },
        { x: 0, rotateY: 0, scale: 1, opacity: 1, duration: 0.95, ease: "power3.out" }, 9.30);

      tl.fromTo("#ms-shops-h", { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 9.75);
      tl.fromTo("#ms-shops-s", { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 9.92);

      tl.fromTo(world, { scale: camA.scale, x: camA.x, y: camA.y },
        { scale: camB.scale, x: camB.x, y: camB.y, duration: 2.8, ease: "power2.inOut", immediateRender: false }, 11.00);

      whip("#ms-p2a", 46, 0.16, 12.30);
      whip("#ms-p2b", 40, 0.14, 12.30 + 0.16 + 2 * F);
      wipe("#ms-count", 0.5, 12.70);

      /* ── Scene 4 (14.6–18s): the certainty trio lands as ONE beat ────── */
      // waterfall-entry proper: overlapping, gaps shrinking, the last one snaps
      whip("#ms-band1", 74, 0.19, 14.60);
      whip("#ms-band2", 52, 0.16, 14.60 + 0.19 + 2 * F);
      whip("#ms-band3", 46, 0.14, 14.60 + 0.19 + 0.16 + F);

      wipe("#ms-hint1", 0.5, 15.40);
      wipe("#ms-hint2", 0.5, 15.75);
      wipe("#ms-hint3", 0.5, 16.10);

      qa(".ms-pip-a").forEach(function (el, i) {
        tl.fromTo(el, { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.36, ease: "power3.out" }, 16.60 + i * 0.09);
      });

      // still travelling at the last frame — the seam hands the camera on
      tl.fromTo(world, { scale: camB.scale, x: camB.x, y: camB.y },
        { scale: camEnd.scale, x: camEnd.x, y: camEnd.y, duration: 0.7, ease: "none", immediateRender: false }, 17.30);
    })();
  </script>
</template>
