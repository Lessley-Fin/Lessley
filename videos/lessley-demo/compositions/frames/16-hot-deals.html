      // waterfall-entry: BINARY opacity 0->1, then a y whip on power4.out
      function whip(sel, off, dur, at) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, at);
        tl.fromTo(sel, { y: off }, { y: 0, duration: dur, ease: "power4.out" }, at);
      }
      // spring-pop-entrance: smooth long-tail settle, no overshoot
      function pop(sel, from, dur, at, rise) {
        tl.fromTo(sel,
          { scale: from, opacity: 0, y: rise || 0 },
          { scale: 1, opacity: 1, y: 0, duration: dur, ease: "power3.out" }, at);
      }
      // RTL clip wipe — reveals from the right edge leftward
      function wipe(sel, dur, at) {
        tl.fromTo(sel,
          { clipPath: "inset(0px 0px 0px 100%)", opacity: 1 },
          { clipPath: "inset(0px 0px 0px 0%)", duration: dur, ease: "power2.out" }, at);
      }

      /* ── persistent rail: 15/21 -> 16/21 across the whole scene ───────── */
      tl.fromTo("#hd-rail", { scaleX: 0.7143 }, { scaleX: 0.7619, duration: 12, ease: "none" }, 0);

      /* ── Scene 1 (0.0–3.4s): open + the deals cascade in ──────────────── */
      // the carried-in push: the screen arrives still moving inward, then settles
      tl.fromTo(world, { scale: 1.05, x: 0, y: 0 },
        { scale: 1, x: 0, y: 0, duration: 0.55, ease: "power3.out" }, 0);

      tl.fromTo("#hd-header", { opacity: 0, y: -16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.04);
      tl.fromTo("#hd-chapter", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.1);

      whip("#hd-title", 80, 0.18, 0.15);                       // anchor, heaviest
      tl.fromTo("#hd-rule-fill", { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.15 + 0.18 + 2 * F);
      whip("#hd-apph1", 48, 0.16, 0.42);
      tl.fromTo("#hd-appsub", { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.62);
      whip("#hd-p1", 44, 0.15, 0.95);

      // grid-card-assemble: items slide a short distance directly into their slot
      whip("#hd-deal1", 46, 0.17, 1.80);
      pop("#hd-pill1", 0, 0.45, 2.06);
      whip("#hd-deal2", 44, 0.16, 2.34);
      pop("#hd-pill2", 0, 0.45, 2.58);
      whip("#hd-deal3", 42, 0.15, 2.86);
      pop("#hd-pill3", 0, 0.45, 3.08);

      /* ── Scene 2 (3.4–7.3s): camera pushes into the list, glow sweeps ─── */
      tl.fromTo(world, camRest,
        { scale: camIn.scale, x: camIn.x, y: camIn.y, duration: 2.8, ease: "power2.inOut", immediateRender: false }, 3.30);

      // ambient-glow-bloom: one traveling pass across the assembled list
      tl.fromTo("#hd-sweep", { xPercent: -230, opacity: 0 },
        { xPercent: 0, opacity: 1, duration: 0.55, ease: "power1.out" }, 6.15);
      tl.fromTo("#hd-sweep", { xPercent: 0, opacity: 1 },
        { xPercent: 230, opacity: 0, duration: 0.85, ease: "power1.in", immediateRender: false }, 6.70);

      /* ── Scene 3 (7.3–12s): re-frame, the curation card lands ─────────── */
      whip("#hd-p2", 46, 0.16, 7.25);

      tl.fromTo(world, { scale: camIn.scale, x: camIn.x, y: camIn.y },
        { scale: camOut.scale, x: camOut.x, y: camOut.y, duration: 1.85, ease: "power2.inOut", immediateRender: false }, 7.55);

      pop("#hd-info", 0.9, 0.62, 7.92, 26);
      wipe("#hd-info-h", 0.5, 8.55);
      wipe("#hd-info-a", 0.62, 9.15);
      wipe("#hd-info-b", 0.7, 10.25);

      // the glow answers the curation beat, then the camera keeps creeping to the seam
      tl.fromTo("#hd-glow", { opacity: 0.72, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out" }, 9.15);

      tl.fromTo(world, { scale: camOut.scale, x: camOut.x, y: camOut.y },
        { scale: camEnd.scale, x: camEnd.x, y: camEnd.y, duration: 1.1, ease: "none", immediateRender: false }, 10.90);
    })();
  </script>
</template>
