  <script>
    (function () {
      var ID = "13-deal-finder";
      var root = document.querySelector('[data-composition-id="' + ID + '"]') || document;
      function q(s) { return root.querySelector(s); }

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines[ID] = tl;

      /* ── NO in-phone camera ────────────────────────────────────────────
         `.screen-world` holds scale 1 / x 0 / y 0 and `.device` is never
         transformed by the timeline (frame.md § Fidelity outranks
         everything, revised 18/08). Legibility is bought with frame real
         estate; every tween below moves CONTENT.                          */

      var F = 1 / 60;
      var BORDER = "rgb(221,229,233)";
      var TEAL   = "rgb(57,124,127)";
      var MINT   = "rgb(209,240,239)";
      var WHITE  = "rgb(255,255,255)";
      var INK    = "rgb(104,118,130)";
      var DEEP   = "rgb(12,77,79)";

      // waterfall-entry: BINARY opacity, then a y whip on power4.out
      function whip(sel, off, dur, at) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, at);
        tl.fromTo(sel, { y: off }, { y: 0, duration: dur, ease: "power4.out" }, at);
      }
      // spring-pop-entrance: long-tail settle, no overshoot
      function pop(sel, from, dur, at) {
        tl.fromTo(sel, { scale: from, opacity: 0 },
          { scale: 1, opacity: 1, duration: dur, ease: "power3.out" }, at);
      }
      // RTL clip wipe — reveals from the right edge leftward
      function wipe(sel, dur, at) {
        tl.fromTo(sel, { clipPath: "inset(0px 0px 0px 100%)", opacity: 1 },
          { clipPath: "inset(0px 0px 0px 0%)", duration: dur, ease: "power2.out" }, at);
      }
      // press: the pointer dips, the target answers
      function press(at, sel, down) {
        tl.fromTo(sel, { scale: 1 },
          { scale: down, duration: 0.08, ease: "power2.in", immediateRender: false }, at);
        tl.fromTo(sel, { scale: down },
          { scale: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, at + 0.08);
      }

      /* ── cursor geometry — measured once, authored fallbacks ───────────
         This is pointer targeting, not a camera: nothing here feeds a
         zoom. `.cursor` is positioned inside `.app`, so offsets are walked
         up to that element.                                              */
      var appEl = q(".app");
      var TIP_X = 7.7, TIP_Y = 3.8;
      function pt(sel, fbx, fby) {
        var el = q(sel), x = 0, y = 0, n = el, guard = 0;
        while (n && n !== appEl && guard < 24) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; guard++; }
        if (n !== appEl || !el.offsetWidth) { return { x: fbx, y: fby }; }
        return { x: x + el.offsetWidth / 2, y: y + el.offsetHeight / 2 };
      }
      var pStore  = pt("#dl-f-store", 220, 300);
      var pChip1  = pt("#dl-chip-1",  330, 470);
      var pChip2  = pt("#dl-chip-2",  240, 470);
      var pSearch = pt("#dl-search",  220, 560);
      var pCard   = pt("#dl-d1",      220, 894);   // read after the list scroll below
      var pCopy   = pt("#dl-copy",     63, 640);

      // The results list is scrolled under the viewport, so the card's on-screen
      // point is its laid-out point plus the authored scroll offset. Four real FOX
      // deals now fill the list, so the second stop sits deeper than it used to.
      var SCROLL_A = -300, SCROLL_B = -560;
      var pCardOn = { x: pCard.x, y: pCard.y + SCROLL_B };
      var pCopyOn = { x: pCopy.x, y: pCopy.y };

      function moveTo(from, to, at, dur, ease) {
        tl.fromTo("#dl-cursor", { x: from.x - TIP_X, y: from.y - TIP_Y },
          { x: to.x - TIP_X, y: to.y - TIP_Y, duration: dur, ease: ease, immediateRender: false }, at);
      }

      gsap.set("#dl-cursor", { x: -70, y: 1010 });
      gsap.set("#dl-scrim", { opacity: 0 });
      gsap.set("#dl-dialog", { opacity: 0 });

      /* ── chrome: the film-long rail advances 12/21 → 13/21 ───────────── */
      tl.fromTo("#dl-rail", { scaleX: 0.571429 }, { scaleX: 0.619048, duration: 14, ease: "none" }, 0);

      /* ── Beat 1 (0.0–1.2s) — the scene enters mid-move ────────────────
         The pointer is already travelling at t=0, so the cut from frame 12
         lands on continuing motion rather than a dead frame.              */
      tl.fromTo("#dl-cursor", { x: -70 - TIP_X, y: 1010 - TIP_Y },
        { x: pStore.x - TIP_X, y: pStore.y - TIP_Y, duration: 0.86, ease: "power2.out" }, 0);

      whip("#dl-h1", 80, 0.18, 0.10);
      tl.fromTo("#dl-rule-fill", { scaleX: 0 },
        { scaleX: 1, duration: 0.46, ease: "power3.out" }, 0.10 + 0.18 + 2 * F);
      whip("#dl-p1", 46, 0.16, 0.38);
      tl.fromTo("#dl-chapter", { opacity: 0 }, { opacity: 1, duration: 0.36, ease: "power1.out" }, 0.18);

      // the store filter is taken — FOX - פוקס, the film's running example
      var CLICK_STORE = 0.92;
      press(CLICK_STORE, "#dl-cursor", 0.84);
      tl.fromTo("#dl-f-store", { borderColor: "rgba(57,124,127,0)", backgroundColor: "rgba(235,242,245,0.8)" },
        { borderColor: "rgba(57,124,127,0.45)", backgroundColor: WHITE, duration: 0.28, ease: "power2.out" }, CLICK_STORE);
      tl.fromTo("#dl-v-store", { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, CLICK_STORE + 0.08);

      /* ── Beat 2 (1.3–2.9s) — two category chips are selected ─────────── */
      moveTo(pStore, pChip1, 1.30, 0.42, "power2.inOut");
      var CLICK_C1 = 1.84;
      press(CLICK_C1, "#dl-cursor", 0.84);
      press(CLICK_C1, "#dl-chip-1", 0.94);
      tl.fromTo("#dl-chip-1", { backgroundColor: WHITE, borderColor: BORDER, color: INK },
        { backgroundColor: MINT, borderColor: "rgba(57,124,127,0.5)", color: DEEP, duration: 0.26, ease: "power2.out" }, CLICK_C1 + 0.04);
      tl.fromTo("#dl-chip-1 .dl-check", { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.28, ease: "power3.out" }, CLICK_C1 + 0.08);

      moveTo(pChip1, pChip2, 2.14, 0.36, "power2.inOut");
      var CLICK_C2 = 2.58;
      press(CLICK_C2, "#dl-cursor", 0.84);
      press(CLICK_C2, "#dl-chip-2", 0.94);
      tl.fromTo("#dl-chip-2", { backgroundColor: WHITE, borderColor: BORDER, color: INK },
        { backgroundColor: MINT, borderColor: "rgba(57,124,127,0.5)", color: DEEP, duration: 0.26, ease: "power2.out" }, CLICK_C2 + 0.04);
      tl.fromTo("#dl-chip-2 .dl-check", { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.28, ease: "power3.out" }, CLICK_C2 + 0.08);

      /* ── Beat 3 (2.9–3.5s) — the search is run ───────────────────────── */
      moveTo(pChip2, pSearch, 2.88, 0.40, "power2.inOut");
      var CLICK_GO = 3.34;
      press(CLICK_GO, "#dl-cursor", 0.82);
      press(CLICK_GO, "#dl-search", 0.965);
      tl.fromTo("#dl-prompt", { opacity: 1 },
        { opacity: 0, duration: 0.22, ease: "power2.in", immediateRender: false }, CLICK_GO + 0.05);
      // the page follows its own results down — an in-app scroll, not a camera
      tl.fromTo("#dl-scroll", { y: 0 },
        { y: SCROLL_A, duration: 0.62, ease: "power2.inOut" }, CLICK_GO + 0.10);

      // the hand withdraws while the results pour in — it never hovers idly
      var pRest = { x: 62, y: 930 };
      moveTo(pSearch, pRest, 3.66, 0.54, "power2.inOut");

      /* ── Beat 4 (3.5–5.1s) — deal card 1 assembles, part by part ──────
         Card 1 is the film's running example: the real Hever gift-card deal
         on FOX - פוקס, 30% capped at ₪300.                                */
      whip("#dl-d1", 46, 0.16, 3.52);
      pop("#dl-art1", 0.82, 0.42, 3.68);
      pop("#dl-rank1", 0.4, 0.36, 3.84);
      pop("#dl-pct1", 0.4, 0.38, 3.96);
      wipe("#dl-store1", 0.36, 4.12);
      wipe("#dl-cat1", 0.32, 4.28);
      wipe("#dl-dt1", 0.46, 4.46);
      pop("#dl-club1", 0.5, 0.36, 4.80);
      pop("#dl-date1", 0.5, 0.36, 4.94);

      whip("#dl-p2", 46, 0.16, 4.40);

      /* ── Beat 5 (5.1–6.6s) — the list keeps pouring ──────────────────
         Three more real FOX deals — PaisPlus Networks, HOT and TopCash —
         arrive whole so the screen reads as a populated results list, not
         a two-card stub with white beneath it.                            */
      tl.fromTo("#dl-scroll", { y: SCROLL_A },
        { y: SCROLL_B, duration: 0.66, ease: "power2.inOut", immediateRender: false }, 5.06);
      whip("#dl-d2", 44, 0.16, 5.12);
      pop("#dl-pct2", 0.45, 0.36, 5.24);
      whip("#dl-d3", 44, 0.16, 5.58);
      pop("#dl-pct3", 0.45, 0.36, 5.70);
      whip("#dl-d4", 44, 0.16, 6.04);
      pop("#dl-pct4", 0.45, 0.36, 6.16);

      /* ── Beat 6 (6.5–7.3s) — the card is opened ──────────────────────── */
      moveTo(pRest, pCardOn, 6.52, 0.62, "power2.inOut");
      var OPEN = 7.20;
      press(OPEN, "#dl-cursor", 0.84);
      press(OPEN, "#dl-d1", 0.985);
      tl.fromTo("#dl-scrim", { opacity: 0 },
        { opacity: 0.28, duration: 0.38, ease: "power2.out" }, OPEN + 0.06);
      tl.fromTo("#dl-dialog", { opacity: 0, scale: 0.93, y: 26 },
        { opacity: 1, scale: 1, y: 0, duration: 0.50, ease: "power3.out" }, OPEN + 0.08);

      /* ── Beat 7 (7.7–10.6s) — the deal-terms sheet reads out ─────────
         Brisk, so the sheet is fully populated well before the climax
         instead of holding a half-empty white box.                       */
      wipe("#dl-dlg-head", 0.32, 7.70);
      wipe("#dl-dlg-title", 0.36, 7.92);
      pop("#dl-dlg-c1", 0.5, 0.26, 8.16);
      pop("#dl-dlg-c2", 0.5, 0.26, 8.23);
      pop("#dl-dlg-c3", 0.5, 0.26, 8.30);
      pop("#dl-dlg-c4", 0.5, 0.26, 8.37);
      wipe("#dl-sec", 0.24, 8.50);
      wipe("#dl-t1", 0.28, 8.66);
      wipe("#dl-t2", 0.28, 8.86);
      wipe("#dl-fine-t", 0.24, 9.08);
      wipe("#dl-fine-b", 0.78, 9.26);
      tl.fromTo("#dl-coupon", { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 9.92);
      pop("#dl-get", 0.92, 0.38, 10.16);
      tl.fromTo("#dl-visit", { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 10.38);

      /* ── Beat 8 (11.1–13.5s) — one press copies the code ────────────── */
      moveTo(pCardOn, pCopyOn, 11.06, 0.72, "power2.inOut");
      var COPY = 12.30;
      press(COPY, "#dl-cursor", 0.82);
      press(COPY, "#dl-copy", 0.88);
      tl.fromTo("#dl-coupon",
        { backgroundColor: "rgb(235,242,245)", borderColor: BORDER },
        { backgroundColor: MINT, borderColor: TEAL, duration: 0.24, ease: "power2.out", immediateRender: false }, COPY + 0.03);
      tl.fromTo("#dl-code", { scale: 1 },
        { scale: 1.06, duration: 0.5, ease: "power3.out", immediateRender: false }, COPY + 0.06);
      // the stage glow answers the beat — it reacts, it never idles
      tl.fromTo("#dl-glow", { opacity: 0.86, scale: 0.97 },
        { opacity: 1, scale: 1, duration: 1.1, ease: "power2.out" }, COPY + 0.04);
    })();
  </script>
