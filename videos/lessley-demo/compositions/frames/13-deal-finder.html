<script>
  (function () {
    var ID = "13-deal-finder";
    var root = document.querySelector('[data-composition-id="' + ID + '"]');
    var q = function (s) { return root.querySelector(s); };
    var world = q("#dl-world");

    var SW = 410, SH = 912, CX = SW / 2, CY = SH / 2;
    var SCROLL = -120;          // scroller offset once the deal card is opened
    var BODY_H = 270;           // MUST equal the .dl-mask CSS height
    var TIP_X = 7.7, TIP_Y = 3.8;
    var BORDER = "rgb(220,229,233)", RING = "rgb(57,127,127)";

    // One-time layout read walked up to the screen-world; authored fallback if unlaid-out.
    function pt(el, fbx, fby, dy) {
      var x = 0, y = 0, n = el;
      while (n && n !== world) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
      if (!el || !el.offsetWidth) return { x: fbx, y: fby + (dy || 0) };
      return { x: x + el.offsetWidth / 2, y: y + el.offsetHeight / 2 + (dy || 0) };
    }
    // Clamped so the screen-world always covers the screen — a 366px card in a
    // 410px screen only allows (k-1)/2 of travel before the ground shows through.
    function cam(p, k) {
      var mx = (k - 1) * SW / 2, my = (k - 1) * SH / 2;
      var x = -k * (p.x - CX), y = -k * (p.y - CY);
      return {
        scale: k,
        x: Math.max(-mx, Math.min(mx, x)),
        y: Math.max(-my, Math.min(my, y))
      };
    }
    function st(s, extra) {
      var o = { scale: s.scale, x: s.x, y: s.y };
      for (var key in extra) { o[key] = extra[key]; }
      return o;
    }

    var pTabs   = pt(q("#dl-tabs"),    205, 178, 0);
    var pFilt   = pt(q("#dl-filters"), 205, 300, 0);
    var pCard   = pt(q("#dl-card"),    205, 692, SCROLL);
    var pCoupon = pt(q("#dl-coupon"),  205, 790, SCROLL);
    var pStore  = pt(q("#dl-f-store"), 205, 250, 0);
    var pCat    = pt(q("#dl-f-cat"),   205, 306, 0);
    var pQ      = pt(q("#dl-f-q"),     205, 362, 0);
    var pBtn    = pt(q("#dl-search"),  205, 424, 0);
    var pHead   = pt(q("#dl-head"),    205, 542, SCROLL);
    var pCopy   = pt(q("#dl-copy"),     70, 790, SCROLL);

    var tl = gsap.timeline({ paused: true });

    /* ── chrome: the film-long progress rail keeps advancing ─────── */
    tl.fromTo("#dl-rail", { scaleX: 0.5556 }, { scaleX: 0.6095, duration: 17, ease: "none" }, 0);

    /* ── stage copy — waterfall entry under the opening words ────── */
    tl.fromTo(["#dl-h1", "#dl-p1", "#dl-p2"],
      { opacity: 0, y: 34 },
      { opacity: 1, y: 0, duration: 0.66, ease: "power3.out", stagger: 0.12 }, 0.12);

    /* ── in-phone camera: the chase through the interaction beats ── */
    // `e` is the ease of the leg ENDING at that stop.
    var pCouponLow = { x: 205, y: pCoupon.y + 30 };
    var CAM = [
      { t: 0.00,  s: { scale: 1.06, x: 0, y: 22 }, e: "none" },
      { t: 1.85,  s: { scale: 1.12, x: 0, y: 6 },  e: "power1.out" },
      { t: 3.45,  s: cam(pFilt, 1.19),             e: "power2.inOut" },
      { t: 7.10,  s: cam(pFilt, 1.21),             e: "none" },
      { t: 9.00,  s: cam(pCard, 1.26),             e: "power2.inOut" },
      { t: 13.40, s: cam(pCard, 1.27),             e: "none" },
      { t: 15.60, s: cam(pCard, 1.28),             e: "none" },
      { t: 17.00, s: cam(pCouponLow, 1.30),        e: "power2.in" }
    ];
    gsap.set(world, st(CAM[0].s));
    for (var i = 1; i < CAM.length; i++) {
      tl.fromTo(world, st(CAM[i - 1].s),
        st(CAM[i].s, {
          duration: CAM[i].t - CAM[i - 1].t, ease: CAM[i].e, immediateRender: false
        }), CAM[i - 1].t);
    }

    /* ── cursor path (app coordinates — it rides the camera) ─────── */
    var CUR = [
      { t: 0.00,  d: 0.00, p: { x: -90, y: 1010 }, e: "none" },
      { t: 0.55,  d: 0.72, p: pTabs,  e: "power2.inOut" },
      { t: 3.45,  d: 0.46, p: pStore, e: "power3.out" },
      { t: 4.60,  d: 0.40, p: pCat,   e: "power3.out" },
      { t: 5.55,  d: 0.38, p: pQ,     e: "power3.out" },
      { t: 6.25,  d: 0.42, p: pBtn,   e: "power3.out" },
      { t: 7.15,  d: 0.48, p: pHead,  e: "power2.inOut" },
      { t: 13.20, d: 0.62, p: pCopy,  e: "power2.inOut" }
    ];
    gsap.set("#dl-cursor", { x: CUR[0].p.x, y: CUR[0].p.y, scale: 1 });
    for (var c = 1; c < CUR.length; c++) {
      var prev = CUR[c - 1];
      var from = (c === 1)
        ? { x: prev.p.x, y: prev.p.y }
        : { x: prev.p.x - TIP_X, y: prev.p.y - TIP_Y };
      tl.fromTo("#dl-cursor", from, {
        x: CUR[c].p.x - TIP_X, y: CUR[c].p.y - TIP_Y,
        duration: CUR[c].d, ease: CUR[c].e, immediateRender: false
      }, CUR[c].t);
    }

    // press depression (explicit down/up, no yoyo) + the ripple burst
    function press(at, sel, down) {
      tl.fromTo(sel, { scale: 1 },
        { scale: down, duration: 0.08, ease: "power2.in", immediateRender: false }, at);
      tl.fromTo(sel, { scale: down },
        { scale: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, at + 0.08);
    }
    function click(at, ripple, target, p) {
      press(at, "#dl-cursor", 0.84);
      if (target) { press(at, target, 0.955); }
      gsap.set(ripple, { left: p.x, top: p.y, xPercent: -50, yPercent: -50, scale: 0, opacity: 0 });
      tl.fromTo(ripple, { scale: 0, opacity: 0.85 },
        { scale: 3.4, opacity: 0, duration: 0.72, ease: "power2.out" }, at + 0.03);
    }

    /* ── Scene 1 (0.0–3.4) — the tab is taken, results pour in ───── */
    gsap.set("#dl-hl", { x: 0 });
    click(1.32, "#dl-rip1", "#dl-tab-find", pTabs);
    tl.fromTo("#dl-hl", { x: 0 }, { x: -186, duration: 0.42, ease: "power3.out" }, 1.36);
    tl.fromTo("#dl-tab-opt", { color: "rgb(21,60,58)" },
      { color: "rgb(106,120,130)", duration: 0.34, ease: "power2.out" }, 1.36);
    tl.fromTo("#dl-tab-find", { color: "rgb(106,120,130)" },
      { color: "rgb(21,60,58)", duration: 0.34, ease: "power2.out" }, 1.36);

    tl.fromTo("#dl-prompt", { opacity: 1 },
      { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 1.66);
    tl.fromTo("#dl-results", { opacity: 0, y: 40 },
      { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 1.84);
    tl.fromTo(["#dl-card", "#dl-below"], { opacity: 0 },
      { opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.14 }, 1.9);

    /* ── Scene 2 (3.4–7.2) — three filters, then the search ─────── */
    click(3.98, "#dl-rip2", "#dl-f-store", pStore);
    tl.fromTo("#dl-f-store", { borderColor: BORDER, boxShadow: "0 0 0 0px rgba(57,127,127,0)" },
      { borderColor: RING, boxShadow: "0 0 0 3px rgba(57,127,127,0.16)", duration: 0.28, ease: "power2.out" }, 3.98);
    tl.fromTo("#dl-v-store", { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 4.06);

    click(5.06, "#dl-rip3", "#dl-f-cat", pCat);
    tl.fromTo("#dl-f-cat", { borderColor: BORDER, boxShadow: "0 0 0 0px rgba(57,127,127,0)" },
      { borderColor: RING, boxShadow: "0 0 0 3px rgba(57,127,127,0.16)", duration: 0.28, ease: "power2.out" }, 5.06);
    tl.fromTo("#dl-v-cat", { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 5.14);

    tl.fromTo("#dl-f-q", { borderColor: BORDER },
      { borderColor: RING, duration: 0.26, ease: "power2.out" }, 5.98);

    click(6.72, "#dl-rip4", "#dl-search", pBtn);
    tl.fromTo("#dl-results", { opacity: 1 },
      { opacity: 0.3, duration: 0.16, ease: "power2.in", immediateRender: false }, 6.78);
    tl.fromTo("#dl-results", { opacity: 0.3, y: 22 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 6.94);

    /* ── Scene 3 (7.2–13.4) — the card opens to the full terms ──── */
    click(7.68, "#dl-rip5", "#dl-head", pHead);
    // anchored-layout-expand: sheet + pushed content ride ONE tween off the head's edge
    tl.fromTo(["#dl-sheet", "#dl-below"], { y: -BODY_H },
      { y: 0, duration: 0.52, ease: "power3.out" }, 7.74);
    tl.fromTo("#dl-scroll", { y: 0 }, { y: SCROLL, duration: 0.62, ease: "power3.out" }, 7.74);
    tl.fromTo("#dl-sec", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 7.98);

    tl.fromTo("#dl-t1", { opacity: 0, x: 22 }, { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" }, 8.40);
    tl.fromTo("#dl-t2", { opacity: 0, x: 22 }, { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" }, 9.10);
    tl.fromTo("#dl-t3", { opacity: 0, x: 22 }, { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" }, 9.80);
    tl.fromTo("#dl-t4", { opacity: 0, x: 22 }, { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" }, 10.50);
    tl.fromTo("#dl-fine", { opacity: 0 }, { opacity: 1, duration: 0.36, ease: "power2.out" }, 11.30);
    tl.fromTo("#dl-coupon", { opacity: 0, y: 16 },
      { opacity: 1, y: 0, duration: 0.44, ease: "power3.out" }, 11.85);

    /* ── Scene 4 (13.4–17) — one press copies the code ──────────── */
    press(14.00, "#dl-cursor", 0.82);
    press(14.00, "#dl-copy", 0.9);
    tl.fromTo("#dl-coupon",
      { backgroundColor: "rgba(190,238,236,0.4)", borderColor: "rgba(57,127,127,0.55)" },
      { backgroundColor: "rgba(190,238,236,0.95)", borderColor: "rgb(57,127,127)", duration: 0.22, ease: "power2.out" }, 14.03);
    tl.fromTo("#dl-code", { scale: 1 }, { scale: 1.07, duration: 0.5, ease: "power3.out" }, 14.08);
    tl.fromTo("#dl-glow", { opacity: 0.85 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 14.03);

    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
</template>
