          }
          var camWide = cam(1.0, CX, CY);
          var camLock = cam(1.30, 205, 333);   // data-camera-target: the brand lockup

          var F = 1 / 60;
          var tl = gsap.timeline({ paused: true });

          // ── initial state ────────────────────────────────────────────────
          tl.set(world, { scale: 1, x: 0, y: 0 }, 0);
          tl.set(words, { opacity: 0 }, 0);
          tl.set(tiles, { opacity: 0 }, 0);
          tl.set(labels, { opacity: 0 }, 0);
          tl.set(trioRule, { scaleX: 0 }, 0);
          tl.set(brandRule, { scaleX: 0 }, 0);

          // ── the arrival: an inverse zoom settling around the phone ────────
          tl.fromTo(stageWorld, { scale: 1.13 }, { scale: 1, duration: 1.7, ease: "power3.out" }, 0);

          tl.fromTo(one(".scene-kicker"), { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.6);

          // headline — waterfall arrival, binary opacity, one direction
          var wt = 0.95;
          var wOff = [72, 46, 44, 78];
          var wDur = [0.18, 0.15, 0.14, 0.19];
          for (var i = 0; i < words.length; i++) {
            tl.set(words[i], { opacity: 1 }, wt);
            tl.fromTo(words[i], { y: wOff[i] }, { y: 0, duration: wDur[i], ease: "power4.out" }, wt);
            wt = wt + wDur[i] - F;
          }

          // ── the three promises land, each on its own line of the voiceover ──
          var promiseAt = [1.9, 7.3, 10.7];
          for (var p = 0; p < 3; p++) {
            var t0 = promiseAt[p];
            tl.set(tiles[p], { opacity: 1 }, t0);
            tl.fromTo(tiles[p], { y: 80 }, { y: 0, duration: 0.19, ease: "power4.out" }, t0);
            var t1 = t0 + 0.19 - 2 * F;
            tl.set(labels[p], { opacity: 1 }, t1);
            tl.fromTo(labels[p], { y: 46 }, { y: 0, duration: 0.15, ease: "power4.out" }, t1);
          }

          // ── icon enrichment: each icon wakes up as its promise settles ────
          // 1 · bank-grade security — the shackle draws and the lock closes
          tl.fromTo(shackle, { strokeDashoffset: 42 },
            { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 2.55);
          var keyPulse = { a: 0 };
          tl.fromTo(keyPulse, { a: 0 }, {
            a: Math.PI * 4, duration: 1.6, ease: "none",
            onUpdate: function () {
              var s = 1 + Math.sin(keyPulse.a) * 0.16;
              keyhole.setAttribute("transform", "translate(24 32) scale(" + s + ") translate(-24 -32)");
            }
          }, 3.3);
          // encrypted in transit — a single dash pass, an integer multiple of the dash period
          var flowState = { o: 0 };
          tl.fromTo(flowState, { o: 0 }, {
            o: -48, duration: 1.5, ease: "none",
            onUpdate: function () { flow.style.strokeDashoffset = String(flowState.o); }
          }, 3.4);

          // 2 · read-only — the eye reads, it never reaches in
          var eye = { a: 0 };
          tl.fromTo(eye, { a: 0 }, {
            a: Math.PI * 4, duration: 1.8, ease: "none",
            onUpdate: function () {
              var sd = 1 + Math.sin(eye.a) * 0.18;
              var sr = 1 + Math.sin(eye.a + Math.PI / 2) * 0.08;
              pupil.setAttribute("transform", "translate(24 24) scale(" + sd + ") translate(-24 -24)");
              iris.setAttribute("transform", "translate(24 24) scale(" + sr + ") translate(-24 -24)");
              iris.style.opacity = String(0.75 + Math.sin(eye.a) * 0.25);
            }
          }, 7.9);
          tl.fromTo(iris, { opacity: 0.75 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 9.72);

          // 3 · never sold — the slash strikes through the shield
          tl.fromTo(slash, { strokeDashoffset: 30 },
            { strokeDashoffset: 0, duration: 0.5, ease: "power3.out" }, 11.25);

          // ── the phone answers the ₪ recall (the film's one gold spend) ────
          tl.fromTo(savedGlow, { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 4.2);
          tl.fromTo(savedGlow, { opacity: 1 }, { opacity: 0.45, duration: 1.2, ease: "power2.inOut", immediateRender: false }, 5.1);
          tl.fromTo(glow, { opacity: 0.9 }, { opacity: 1.25, duration: 0.7, ease: "power2.out" }, 4.2);
          tl.fromTo(glow, { opacity: 1.25 }, { opacity: 1, duration: 1.4, ease: "power2.inOut", immediateRender: false }, 5.1);

          // ── the trio composes, then the logo locks the frame ─────────────
          tl.fromTo(trioRule, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 12.2);
          tl.fromTo(promises, { scale: 1 },
            { scale: 1.028, duration: 0.22, ease: "power2.out", stagger: 0.05 }, 12.3);
          tl.fromTo(promises, { scale: 1.028 },
            { scale: 1, duration: 0.5, ease: "power2.inOut", stagger: 0.05, immediateRender: false }, 12.55);

          tl.fromTo(world, camWide, {
            scale: camLock.scale, x: camLock.x, y: camLock.y, duration: 1.3, ease: "power3.out"
          }, 12.6);
          tl.fromTo(brandGlow, { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 12.7);
          tl.fromTo(brandRule, { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 12.95);

          // film-long progress rail — reaches 100% before the held final beat
          tl.fromTo(railFill, { scaleX: 0.952 }, { scaleX: 1, duration: 14, ease: "power1.out" }, 0);

          // 13.9 → 15.0 the frame is completely still. The film ends on a held lockup.

          window.__timelines = window.__timelines || {};
          window.__timelines[ID] = tl;
        })();
      </script>
</template>
