          var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

          var stageWorld = one(".f21-world");
          var words = all(".f21-title span");
          var promises = all(".f21-promise");
          var tiles = all(".f21-tile");
          var lines = all(".f21-pline");
          var trioRule = one(".f21-trio-rule");
          var glow = one(".bg-glow");
          var heroGlow = one(".f21-hero-glow");
          var brandGlow = one(".f21-brand-glow");
          var brandRule = one(".f21-brand-rule");
          var brandLogo = one(".f21-logo");
          var shackle = one(".f21-shackle");
          var keyhole = one(".f21-keyhole");
          var flow = one(".f21-flow");
          var iris = one(".f21-iris");
          var pupil = one(".f21-pupil");
          var slash = one(".f21-slash");
          var railFill = one(".rail > i");

          // No in-phone camera: .screen-world is never transformed. The only Z move in
          // this scene is the STAGE arrival below, which settles around the phone.
          var F = 1 / 60;

          // ── initial state ────────────────────────────────────────────────

          tl.fromTo(one(".scene-kicker"), { opacity: 0, y: 16 },

          // headline — waterfall arrival, binary opacity, one direction
          // "בטוח מהיסוד" is two words; the waterfall keeps the heavy first and
          // last beats of the original four-word cascade rather than splitting a
          // Hebrew word across spans.
          var wt = 0.85;
          var wOff = [72, 78];
          var wDur = [0.18, 0.19];

            tl.fromTo(words[i], { y: wOff[i] }, { y: 0, duration: wDur[i], ease: "power4.out" }, wt);
            wt = wt + wDur[i] - F;

          // ── the three promises land, each on its own line of the voiceover ──
          // The 20% retime is taken entirely out of the holds BETWEEN the promises;
          // every arrival keeps its original duration and ease, and the last second
          // of the film is still a completely held frame.
          var promiseAt = [1.7, 5.35, 8.0];

            var t0 = promiseAt[p];

          // keep the label entrance verbatim and land on the first and last tile.
          var lineAt = [1.7 + 0.19 - 2 * F, 8.0 + 0.19 - 2 * F];

            tl.fromTo(lines[L], { y: 46 }, { y: 0, duration: 0.15, ease: "power4.out" }, lineAt[L]);

          tl.fromTo(glow, { opacity: 0.9 }, { opacity: 1.25, duration: 0.6, ease: "power2.out" }, 3.6);

          tl.fromTo(trioRule, { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 9.25);
