      return {
        scale: k,
        x: Math.max(-mx, Math.min(mx, x)),
        y: Math.max(-my, Math.min(my, y))
      };
    }
    function st(s, extra) {
      var o = { scale: s.scale, x: s.x, y: s.y };
      for (var key in extra) { o[key] = extra[key]; }
      return o;
    }

    var pTabs = pt(q("#ih-tabs"), 205, 233);
    var pTab30 = pt(q("#ih-tab-30"), 226, 233);
    var pHero = pt(q("#ih-hero"), 205, 373);
    var pInfo = pt(q("#ih-info"), 43, 306);
    var pWide = { x: 205, y: 592 };
    var pWideLow = { x: 205, y: 622 };

    var tl = gsap.timeline({ paused: true });

    /* ── chrome ──────────────────────────────────────────────────── */
    tl.fromTo("#ih-rail", { scaleX: 0.6095 }, { scaleX: 0.6508, duration: 13, ease: "none" }, 0);

    /* ── stage copy ──────────────────────────────────────────────── */
    tl.fromTo(["#ih-h1", "#ih-p1", "#ih-p2"],
      { opacity: 0, y: 34 },
      { opacity: 1, y: 0, duration: 0.66, ease: "power3.out", stagger: 0.12 }, 0.12);

    /* ── camera: traverse to the hero metric, settle wider on the sheet ── */
    // `e` is the ease of the leg ENDING at that stop. The frame INHERITS the
    // previous scene's upward pan — it opens already travelling, not from rest.
    var CAM = [
      { t: 0.00,  s: { scale: 1.14, x: 0, y: 52 }, e: "none" },
      { t: 1.55,  s: { scale: 1.15, x: 0, y: 16 }, e: "power1.out" },
      { t: 3.00,  s: { scale: 1.16, x: 0, y: 12 }, e: "none" },
      { t: 4.70,  s: cam(pHero, 1.24),             e: "power2.inOut" },
      { t: 7.30,  s: cam(pHero, 1.26),             e: "none" },
      { t: 9.10,  s: cam(pWide, 1.12),             e: "power2.inOut" },
      { t: 11.20, s: cam(pWide, 1.13),             e: "none" },
      { t: 13.00, s: cam(pWideLow, 1.20),          e: "power2.in" }
    ];
    gsap.set(world, st(CAM[0].s));
    for (var i = 1; i < CAM.length; i++) {
      tl.fromTo(world, st(CAM[i - 1].s),
        st(CAM[i].s, {
          duration: CAM[i].t - CAM[i - 1].t, ease: CAM[i].e, immediateRender: false
        }), CAM[i - 1].t);
    }

    /* ── cursor: the hand that performs the two gestures ─────────── */
    var CUR = [
      { t: 0.00, d: 0.00, p: { x: 470, y: 1000 }, e: "none" },
      { t: 0.45, d: 0.82, p: pTab30, e: "power2.inOut" },
      { t: 6.30, d: 0.80, p: pInfo,  e: "power2.inOut" }
    ];
    gsap.set("#ih-cursor", { x: CUR[0].p.x, y: CUR[0].p.y, scale: 1 });
    for (var c = 1; c < CUR.length; c++) {
      var prev = CUR[c - 1];
      var from = (c === 1)
        ? { x: prev.p.x, y: prev.p.y }
        : { x: prev.p.x - TIP_X, y: prev.p.y - TIP_Y };
      tl.fromTo("#ih-cursor", from, {
        x: CUR[c].p.x - TIP_X, y: CUR[c].p.y - TIP_Y,
        duration: CUR[c].d, ease: CUR[c].e, immediateRender: false
      }, CUR[c].t);
    }
    function press(at, sel, down) {
      tl.fromTo(sel, { scale: 1 },
        { scale: down, duration: 0.08, ease: "power2.in", immediateRender: false }, at);
      tl.fromTo(sel, { scale: down },
        { scale: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, at + 0.08);
    }
    function ripple(at, sel, p) {
      gsap.set(sel, { left: p.x, top: p.y, xPercent: -50, yPercent: -50, scale: 0, opacity: 0 });
      tl.fromTo(sel, { scale: 0, opacity: 0.85 },
        { scale: 3.4, opacity: 0, duration: 0.72, ease: "power2.out" }, at);
    }

    /* ── the page begins un-resolved: skeletons where the data goes ── */
    gsap.set("#ih-hl", { x: 0 });
    gsap.set("#ih-scrim", { opacity: 0 });
    gsap.set("#ih-sheet", { y: 300 });

    /* ── EDIT BEAT 1 (control-target-sync) — the period is picked ─── */
    var EDIT1 = 1.74, PICK_DUR = 2.05, PICK_EASE = "power3.out";
    tl.addLabel("edit1", EDIT1);
    press(EDIT1, "#ih-cursor", 0.84);
    press(EDIT1, "#ih-tab-30", 0.955);
    ripple(EDIT1 + 0.03, "#ih-rip1", pTab30);

    // control side — the selection snaps onto 30 ימים
    tl.fromTo("#ih-hl", { x: 0 }, { x: -87, duration: 0.34, ease: "power3.out" }, "edit1");
    tl.fromTo("#ih-tab-7", { color: "rgb(21,60,58)" },
      { color: "rgb(106,120,130)", duration: 0.3, ease: "power2.out" }, "edit1");
    tl.fromTo("#ih-tab-30", { color: "rgb(106,120,130)" },
      { color: "rgb(21,60,58)", duration: 0.3, ease: "power2.out" }, "edit1");

    // bound side — the readout converts instantly, the figure counts on the same label
    tl.fromTo("#ih-subskel", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none" }, "edit1");
    tl.fromTo("#ih-sub", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, "edit1");
    tl.fromTo("#ih-skel", { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "none" }, "edit1");

    // counting-dynamic-scale — value + transform scale share duration AND ease
    var fig = q("#ih-fig");
    var state = { v: 0 };
    tl.fromTo(state, { v: 0 }, {
      v: 1284, duration: PICK_DUR, ease: PICK_EASE,
      onUpdate: function () { fig.textContent = "₪" + Math.round(state.v).toLocaleString("en-US"); }
    }, "edit1");
    tl.fromTo("#ih-fig", { scale: 0.52, opacity: 0 },
      { scale: 1, opacity: 1, duration: PICK_DUR, ease: PICK_EASE }, "edit1");
    // the bloom answers the payoff as the count peaks
    tl.fromTo("#ih-bloom", { opacity: 0.15, scale: 0.72 },
      { opacity: 1, scale: 1, duration: 1.5, ease: "power2.out" }, EDIT1 + 0.55);

    /* ── the linked accounts resolve under the landed figure ─────── */
    tl.fromTo("#ih-accounts", { opacity: 0, y: 22 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.90);
    tl.fromTo(".ih-cardchip", { opacity: 0, scale: 0.5 },
      { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.6)", stagger: 0.1 }, 3.20);

    /* ── BEAT 2 — the info sheet answers "is this an estimate?" ──── */
    var EDIT2 = 7.30;
    press(EDIT2, "#ih-cursor", 0.84);
    press(EDIT2, "#ih-info", 0.9);
    ripple(EDIT2 + 0.03, "#ih-rip2", pInfo);

    tl.fromTo("#ih-scrim", { opacity: 0 }, { opacity: 0.2, duration: 0.5, ease: "power2.out" }, EDIT2 + 0.1);
    tl.fromTo("#ih-sheet", { y: 300 }, { y: 0, duration: 0.62, ease: "back.out(1.05)" }, EDIT2 + 0.1);
    tl.fromTo("#ih-sheet-title", { opacity: 0, y: 18 },
      { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, EDIT2 + 0.42);
    tl.fromTo("#ih-sheet-body", { opacity: 0, y: 22 },
      { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, EDIT2 + 0.62);

    /* ── the stage glow lifts once on the savings payoff ─────────── */
    tl.fromTo("#ih-glow", { opacity: 0.72 }, { opacity: 1, duration: 1.6, ease: "power2.out" }, EDIT1 + 0.4);

    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
</template>
