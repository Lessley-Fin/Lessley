<script>
  (function () {
    var ID = "15-insights-slides";
    var root = document.querySelector('[data-composition-id="' + ID + '"]');
    var q = function (s) { return root.querySelector(s); };
    var qa = function (s) { return root.querySelectorAll(s); };
    var world = q("#is-world");

    var SW = 410, SH = 912;
    var STEP = 380;                     // slide width 366 + 14 gap
    var IR = { immediateRender: false };
    var MUTED = "rgb(220,229,233)", PRIMARY = "rgb(57,127,127)";

    function st(s, extra) {
      var o = { scale: s.scale, x: s.x, y: s.y };
      for (var key in extra) { o[key] = extra[key]; }
      return o;
    }

    var tl = gsap.timeline({ paused: true });

    /* ── chrome ──────────────────────────────────────────────────── */
    tl.fromTo("#is-rail", { scaleX: 0.6508 }, { scaleX: 0.7143, duration: 20, ease: "none" }, 0);

    /* ── stage copy ──────────────────────────────────────────────── */
    tl.fromTo(["#is-h1", "#is-p1", "#is-p2"],
      { opacity: 0, y: 34 },
      { opacity: 1, y: 0, duration: 0.66, ease: "power3.out", stagger: 0.12 }, 0.12);

    /* ── camera: inherits the previous scene's pan, then holds so the
          SWIPE is the motion, and leans in again for the hand-off ─── */
    var CAM = [
      { t: 0.00,  s: { scale: 1.18, x: 0, y: -8 },  e: "none" },
      { t: 1.30,  s: { scale: 1.22, x: 0, y: -42 }, e: "power1.out" },
      { t: 17.60, s: { scale: 1.22, x: 0, y: -46 }, e: "none" },
      { t: 20.00, s: { scale: 1.24, x: 0, y: -54 }, e: "power2.in" }
    ];
    gsap.set(world, st(CAM[0].s));
    for (var i = 1; i < CAM.length; i++) {
      tl.fromTo(world, st(CAM[i - 1].s),
        st(CAM[i].s, {
          duration: CAM[i].t - CAM[i - 1].t, ease: CAM[i].e, immediateRender: false
        }), CAM[i - 1].t);
    }

    /* ── the carousel: four nudge-curve swipes, one per narrated slide ─
          10% ramp-in (power3.in) → 65% linear burst → 25% power4.out tail.  */
    var SWIPE = [3.90, 7.80, 11.70, 15.60];
    gsap.set("#is-track", { x: 0 });
    for (var s = 0; s < SWIPE.length; s++) {
      var t0 = SWIPE[s], base = s * STEP;
      tl.fromTo("#is-track", { x: base },
        { x: base + STEP * 0.10, duration: 0.12, ease: "power3.in", immediateRender: false }, t0);
      tl.fromTo("#is-track", { x: base + STEP * 0.10 },
        { x: base + STEP * 0.75, duration: 0.11, ease: "none", immediateRender: false }, t0 + 0.12);
      tl.fromTo("#is-track", { x: base + STEP * 0.75 },
        { x: base + STEP, duration: 0.37, ease: "power4.out", immediateRender: false }, t0 + 0.23);
    }

    /* ── the dot indicator steps with each swipe ─────────────────── */
    gsap.set(".is-d", { scaleX: 0.25, backgroundColor: MUTED });
    gsap.set("#is-d0", { scaleX: 1, backgroundColor: PRIMARY });
    for (var d = 0; d < SWIPE.length; d++) {
      tl.fromTo("#is-d" + d, { scaleX: 1, backgroundColor: PRIMARY },
        { scaleX: 0.25, backgroundColor: MUTED, duration: 0.3, ease: "power2.out", immediateRender: false },
        SWIPE[d] + 0.14);
      tl.fromTo("#is-d" + (d + 1), { scaleX: 0.25, backgroundColor: MUTED },
        { scaleX: 1, backgroundColor: PRIMARY, duration: 0.3, ease: "power2.out", immediateRender: false },
        SWIPE[d] + 0.14);
    }

    /* ── each slide's chart is ALREADY MOVING as the slide arrives ─
          (fired mid-burst, so no slide reads as a card built from zero) */
    var C1 = 0.15, C2 = SWIPE[0] + 0.15, C3 = SWIPE[1] + 0.15,
        C4 = SWIPE[2] + 0.15, C5 = SWIPE[3] + 0.15;

    // 1 · period comparison — growth bars, scaleY from the baseline
    tl.fromTo(["#s1-prev", "#s1-cur"], { scaleY: 0 },
      { scaleY: 1, duration: 0.85, ease: "power3.out", stagger: 0.1 }, C1);
    tl.fromTo(".is-barlbl", { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.1 }, C1 + 0.35);

    // 2 · top category — measured ring draw + the legend under it
    var ring = q("#s2-ring");
    var LEN = (ring && ring.getTotalLength) ? ring.getTotalLength() : 282.74;
    ring.style.strokeDasharray = LEN;
    tl.fromTo(ring, { strokeDashoffset: LEN },
      { strokeDashoffset: LEN * (1 - 0.38), duration: 1.05, ease: "power2.out" }, C2);
    tl.fromTo(["#s2-pct", ".is-catname", ".is-catamt"], { opacity: 0, y: 16 },
      { opacity: 1, y: 0, duration: 0.46, ease: "power3.out", stagger: 0.09 }, C2 + 0.1);

    // 3 · top stores — rows cascade, fills run right-to-left
    tl.fromTo(".s3-row", { opacity: 0, x: 26 },
      { opacity: 1, x: 0, duration: 0.42, ease: "power3.out", stagger: 0.08 }, C3);
    var S3 = [1, 0.78, 0.6, 0.44], f3 = qa(".s3-fill");
    for (var a = 0; a < f3.length; a++) {
      tl.fromTo(f3[a], { scaleX: 0 },
        { scaleX: S3[a], duration: 0.9, ease: "power3.out" }, C3 + a * 0.08);
    }

    // 4 · recent transactions — the list pours in past the fold
    tl.fromTo(".s4-tx", { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.46, ease: "power3.out", stagger: 0.11 }, C4);

    // 5 · accounts — the per-card split fills
    tl.fromTo(".s5-row", { opacity: 0, x: 26 },
      { opacity: 1, x: 0, duration: 0.42, ease: "power3.out", stagger: 0.09 }, C5);
    var S5 = [1, 0.72, 0.5], f5 = qa(".s5-fill");
    for (var b = 0; b < f5.length; b++) {
      tl.fromTo(f5[b], { scaleX: 0 },
        { scaleX: S5[b], duration: 0.9, ease: "power3.out" }, C5 + b * 0.09);
    }

    /* ── the fixed stats row resolves once, under the whole carousel ── */
    tl.fromTo(".is-stat", { opacity: 0, y: 24 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.1 }, 0.55);

    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
