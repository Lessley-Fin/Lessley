  <script>
    (function () {
      var ID = "15-insights-slides";
      var root = document.querySelector('[data-composition-id="' + ID + '"]') || document;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines[ID] = tl;

      /* ── NO in-phone camera ────────────────────────────────────────────
         `.screen-world` holds scale 1 / x 0 / y 0 and `.device` is never
         transformed by the timeline (frame.md § Fidelity outranks
         everything, revised 18/08). The carousel is the app's own control:
         the TRACK moves, the frame does not.                              */

      function whip(sel, off, dur, at) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, at);
        tl.fromTo(sel, { y: off }, { y: 0, duration: dur, ease: "power4.out" }, at);
      }
      function rise(sel, dy, dur, at) {
        tl.fromTo(sel, { opacity: 0, y: dy },
          { opacity: 1, y: 0, duration: dur, ease: "power3.out" }, at);
      }
      function pop(sel, from, dur, at) {
        tl.fromTo(sel, { scale: from, opacity: 0 },
          { scale: 1, opacity: 1, duration: dur, ease: "power3.out" }, at);
      }
      function wipe(sel, dur, at) {
        tl.fromTo(sel, { clipPath: "inset(0px 0px 0px 100%)", opacity: 1 },
          { clipPath: "inset(0px 0px 0px 0%)", duration: dur, ease: "power2.out" }, at);
      }

      /* ── chrome: the film-long rail advances 14/21 → 15/21 ───────────── */
      tl.fromTo("#is-rail", { scaleX: 0.666667 }, { scaleX: 0.714286, duration: 16, ease: "none" }, 0);
      tl.fromTo("#is-chapter", { opacity: 0 }, { opacity: 1, duration: 0.36, ease: "power1.out" }, 0.18);

      /* ── stage copy ───────────────────────────────────────────────────── */
      whip("#is-h1", 80, 0.18, 0.10);
      tl.fromTo("#is-rule-fill", { scaleX: 0 },
        { scaleX: 1, duration: 0.46, ease: "power3.out" }, 0.30);
      whip("#is-p1", 46, 0.16, 0.46);
      whip("#is-p2", 46, 0.16, 1.80);

      /* ── the carousel — five slides, one track ────────────────────────
         RTL: the next slide sits to the LEFT, so the track travels +x.
         STEP = slide width 404 + gap 12. Sixteen seconds over five slides is
         3.2s each, so the swipe is shortened and every slide's chart is
         already running before its card finishes arriving.                */
      var STEP = 416;
      var GO = [3.05, 6.10, 9.15, 12.20];   // the four swipes
      var SWIPE = 0.52;
      for (var i = 0; i < GO.length; i++) {
        tl.fromTo("#is-track", { x: i * STEP },
          { x: (i + 1) * STEP, duration: SWIPE, ease: "power2.inOut", immediateRender: (i === 0) }, GO[i]);
      }

      /* pagination dots — the active slot's teal pill grows, the grey dot leaves */
      gsap.set(["#is-don1"], { scaleX: 1, opacity: 1 });
      gsap.set(["#is-doff1"], { opacity: 0 });
      gsap.set(["#is-don2", "#is-don3", "#is-don4", "#is-don5"], { scaleX: 0.25, opacity: 0 });
      gsap.set(["#is-doff2", "#is-doff3", "#is-doff4", "#is-doff5"], { opacity: 1 });
      for (var d = 0; d < GO.length; d++) {
        var at = GO[d] + 0.05;
        tl.fromTo("#is-don" + (d + 1), { scaleX: 1, opacity: 1 },
          { scaleX: 0.25, opacity: 0, duration: 0.30, ease: "power2.inOut", immediateRender: false }, at);
        tl.fromTo("#is-doff" + (d + 1), { opacity: 0 },
          { opacity: 1, duration: 0.30, ease: "power2.inOut", immediateRender: false }, at);
        tl.fromTo("#is-don" + (d + 2), { scaleX: 0.25, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.30, ease: "power2.inOut", immediateRender: false }, at);
        tl.fromTo("#is-doff" + (d + 2), { opacity: 1 },
          { opacity: 0, duration: 0.30, ease: "power2.inOut", immediateRender: false }, at);
      }

      /* ── Slide 1 (0.0–3.05s) — this period against the last ───────────
         The bars are ALREADY growing at t=0: the cut from frame 14 lands on
         a chart in motion, not on a chart building from zero.             */
      tl.fromTo("#is-bar-p", { scaleY: 0.34 }, { scaleY: 1, duration: 1.25, ease: "power3.out" }, 0);
      tl.fromTo("#is-bar-c", { scaleY: 0.34 }, { scaleY: 1, duration: 1.38, ease: "power3.out" }, 0);
      wipe("#is-s1-t", 0.36, 0.12);
      wipe("#is-s1-s", 0.36, 0.28);
      pop("#is-barv-p", 0.8, 0.36, 1.18);
      pop("#is-barv-c", 0.8, 0.36, 1.44);
      rise("#is-lg-p", 14, 0.36, 1.95);
      rise("#is-lg-c", 14, 0.36, 2.15);

      /* ── Slide 2 (3.57–6.10s) — the category donut ────────────────────
         ביגוד ואביזרים leads at ₪2,140 of ₪5,630. The donut is mid-sweep

      wipe("#is-s2-t", 0.34, 3.64);
      wipe("#is-s2-s", 0.34, 3.78);
      rise("#is-c1", 16, 0.38, 4.02);
      rise("#is-c2", 16, 0.38, 4.40);
      rise("#is-c3", 16, 0.38, 4.78);
      rise("#is-c4", 16, 0.38, 5.16);

      /* ── Slide 3 (6.62–9.15s) — the ranked stores ─────────────────────
         Real stores: FOX - פוקס leads the clothing spend. The first row is

      rise("#is-st1", 26, 0.42, 6.38);
      wipe("#is-s3-t", 0.34, 6.72);
      wipe("#is-s3-s", 0.34, 6.86);
      rise("#is-st2", 26, 0.42, 7.04);
      rise("#is-st3", 26, 0.42, 7.42);
      rise("#is-st4", 26, 0.42, 7.80);
      rise("#is-st5", 26, 0.42, 8.18);

      /* ── Slide 4 (9.67–12.20s) — the recent transactions ──────────────── */
      rise("#is-tx1", 24, 0.40, 9.43);
      wipe("#is-s4-t", 0.34, 9.76);
      wipe("#is-s4-s", 0.34, 9.90);
      rise("#is-tx2", 24, 0.40, 10.06);
      rise("#is-tx3", 24, 0.40, 10.42);

      rise("#is-tx5", 24, 0.40, 11.14);

      /* ── Slide 5 (12.72–16.0s) — the linked accounts ──────────────────── */

      // the stage glow answers the close of the deep dive — reaction, not idle
