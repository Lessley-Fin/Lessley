          var SCRUB = 0.9, SCRUB_EASE = "power2.inOut";

          gsap.set(".v6-ripple", { xPercent: -50, yPercent: -50, scale: 0, opacity: 0 });
          gsap.set("#v6-fill", { scaleX: STATES[0].pct });
          gsap.set(cursor, { x: -70, y: 1010 });

          var tl = gsap.timeline({ paused: true });

          /* ── the carrier rail ── */
          tl.fromTo("#v6-rail", { scaleX: 0.8222 }, { scaleX: 1, duration: DUR, ease: "none" }, 0);

          /* ── Scene 1 (0.0–1.4) — the couple establishes; the step carrier advances ── */
          tl.set(world, C0, 0);
          tl.fromTo("#v6-body", { x: -46, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0);
          tl.fromTo("#v6-s2",
            { backgroundColor: "hsl(198 28% 94%)", color: "hsl(208 11% 46%)" },
            { backgroundColor: ACCENT, color: "hsl(182 73% 18%)", duration: 0.45, ease: "power2.out" }, 0.15);
          tl.fromTo("#v6-s3",
            { backgroundColor: "hsl(198 28% 94%)", color: "hsl(208 11% 46%)" },
            { backgroundColor: TEAL, color: "hsl(182 37% 98%)", duration: 0.45, ease: "power2.out" }, 0.15);
          tl.fromTo("#v6-h1", { y: 26, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.15);
          tl.fromTo(".v6-line", { y: 18, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.14 }, 0.35);
          tl.fromTo(".v6-opt", { y: 20, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.5);
          tl.fromTo(".v6-preview", { y: 22, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.78);

          // the on-load selection (בינוני — the demo user's level) is already declared
          tl.fromTo("#v6-o1", { borderColor: BORDER, backgroundColor: WHITE },
            { borderColor: TEAL, backgroundColor: ACCENT, duration: 0.45, ease: "power2.out" }, 0.95);

          /* ── camera: one modest push that keeps BOTH halves of the couple in frame ── */
          tl.fromTo(world, C0, { scale: C1.scale, x: C1.x, y: C1.y, duration: 2.1, ease: "power2.inOut" }, 0.9);

          /* ── the readout copy snaps at each threshold, from the same STATES array.
                A zero-duration set renders under any seek, forward or backward. ── */
          STATES.forEach(function (st) { tl.set(descEl, { innerHTML: st.desc }, st.t); });

          /* ── Scenes 2–5 — four edit beats. Control and target move at ONE label,
                sharing duration AND ease: the pick and the filtered preview are one gesture. ── */
          var prevCur = { x: -70, y: 1010 };
          for (var k = 1; k < STATES.length; k++) {
            (function (k) {
              var s = STATES[k], p = STATES[k - 1];
              var T = s.t;
              var optEl = q("v6-o" + s.opt), oldEl = q("v6-o" + p.opt);
              var b = pos(optEl);
              var to = { x: b.x + b.w / 2 - 7, y: b.y + b.h / 2 - 3 };

              tl.addLabel("edit" + k, T);

              // the actor — cursor glide, settled before the press
              tl.fromTo(cursor, { x: prevCur.x, y: prevCur.y },
                { x: to.x, y: to.y, duration: 0.7, ease: k === 1 ? "power3.out" : "power2.inOut",
                  immediateRender: k === 1 }, T - 0.8);
              tl.fromTo(cursor, { scale: 1 }, { scale: 0.84, duration: 0.09, ease: "power2.in" }, T - 0.09);
              tl.fromTo(cursor, { scale: 0.84 },
                { scale: 1, duration: 0.13, ease: "power2.out", immediateRender: false }, T);
              tl.fromTo("#v6-rp" + s.opt, { scale: 0, opacity: 0.6 },
                { scale: 4.4, opacity: 0, duration: 0.75, ease: "power2.out", immediateRender: false }, T);

              // the control steps
              if (oldEl !== optEl) {
                tl.fromTo(oldEl, { borderColor: TEAL, backgroundColor: ACCENT },
                  { borderColor: BORDER, backgroundColor: WHITE, duration: SCRUB, ease: SCRUB_EASE,
                    immediateRender: false }, "edit" + k);
                tl.fromTo(optEl, { borderColor: BORDER, backgroundColor: WHITE },
                  { borderColor: TEAL, backgroundColor: ACCENT, duration: SCRUB, ease: SCRUB_EASE,
                    immediateRender: false }, "edit" + k);
              }

              // the bound surface answers in the SAME beat — same label, duration, ease
              tl.to(countEl, { innerText: s.n, duration: SCRUB, ease: SCRUB_EASE,
                snap: { innerText: 1 } }, "edit" + k);
              tl.fromTo("#v6-fill", { scaleX: p.pct },
                { scaleX: s.pct, duration: SCRUB, ease: SCRUB_EASE, immediateRender: false }, "edit" + k);

              prevCur = to;
            })(k);
          }

          // the glow answers the landed choice
          tl.fromTo("#v6-glow", { opacity: 0.72 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 13.8);

          // stillness through the edit beats, then the camera pushes on the landed choice
          // and is still travelling in at the cut
          tl.fromTo(world, { scale: C1.scale, x: C1.x, y: C1.y },
            { scale: C2.scale, x: C2.x, y: C2.y, duration: DUR - 12.5, ease: "power1.in",
              immediateRender: false }, 12.5);

          window.__timelines = window.__timelines || {};
          window.__timelines["06-signup-match"] = tl;
        })();
      </script>
