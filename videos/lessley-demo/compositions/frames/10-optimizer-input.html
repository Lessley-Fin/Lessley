    var S1 = 1.20, S2 = 1.06;                        /* push scale, settled scale */
    var T1x = -offPrice.x, T1y = -(offPrice.y + 40); /* T = -offset, biased so the
                                                        header leaves cleanly */
    var T2x = 0, T2y = 26;                           /* settle: the whole filled form */

    /* the submit control's canvas position at the settled framing (phone centred) */
    var btnX = 960 + (offBtn.x + T2x) * S2 * DS;
    var btnY = 540 + (offBtn.y + T2y) * S2 * DS;

    var tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;

    /* ── progress rail — the one element that runs the whole film ── */
    tl.fromTo(g("f10-rail"), { scaleX: 0.428571 }, { scaleX: 0.476190, duration: D, ease: "none" }, 0);

    /* ── Scene 0 (0.0–2.3s) — the phone at rest, the stage panel states the beat ── */
    tl.fromTo(g("f10-title"), { opacity: 0, x: 42 }, { opacity: 1, x: 0, duration: 0.72, ease: "power3.out" }, 0.10);
    tl.fromTo(g("f10-body"), { opacity: 0, x: 34 }, { opacity: 1, x: 0, duration: 0.72, ease: "power3.out" }, 0.30);
    tl.fromTo(g("f10-alt"), { opacity: 0 }, { opacity: 0.92, duration: 0.5, ease: "power2.out" }, 0.55);

    /* ── Scene 1 (2.3–3.0s) — nudge-curve: the phone takes true frame centre ──
       10 / 65 / 25 distance over 20 / 17 / 63 time; tail 3.1x the ramp-in.        */
    tl.fromTo(rig, { x: 0 }, { x: 34, duration: 0.14, ease: "power3.in" }, 2.30);
    tl.fromTo(rig, { x: 34 }, { x: 255, duration: 0.12, ease: "none", immediateRender: false }, 2.44);
    tl.fromTo(rig, { x: 255 }, { x: 340, duration: 0.44, ease: "power4.out", immediateRender: false }, 2.56);
    /* the panel clears inside the burst — the burst masks the change */
    tl.fromTo(g("f10-text"), { opacity: 1, x: 0 }, { opacity: 0, x: 86, duration: 0.44, ease: "power2.in" }, 2.44);
    /* the background reacts: the glow travels with the phone, the grid parallaxes */
    tl.fromTo(g("f10-glow"), { x: 0 }, { x: 350, duration: 0.98, ease: "power3.out" }, 2.30);
    tl.fromTo(g("f10-grid"), { x: 0 }, { x: 44, duration: 1.05, ease: "power3.out" }, 2.30);

    /* ── Scene 2 (2.7–4.1s) — the store is chosen ── */
    var ring = "0 0 0 3px hsl(182 38% 36% / 0.16)";
    var flat = "0 0 0 0px hsl(182 38% 36% / 0)";
    tl.fromTo(g("f10-f-store"), { boxShadow: flat, borderColor: "hsl(201 21% 89%)" },
      { boxShadow: ring, borderColor: "hsl(182 38% 36%)", duration: 0.34, ease: "power2.out" }, 2.70);

    /* discrete-text-sequence — whole-state swaps at thresholds, authored as zero-
       duration sets so every state is correct under a seek in either direction.  */
    function typeAt(el, at, states) {
      states.forEach(function (s) { tl.set(el, { textContent: s[1] }, at + s[0]); });
    }
    typeAt(g("f10-store"), 3.00, [
      [0.00, ""], [0.10, "ר"], [0.21, "רמ"], [0.31, "רמי"],
      [0.44, "רמי "], [0.55, "רמי ל"], [0.65, "רמי לו"], [0.78, "רמי לוי"]
    ]);
    tl.fromTo(g("f10-alt"), { opacity: 0.92 }, { opacity: 0.28, duration: 0.42, ease: "power2.out", immediateRender: false }, 3.62);
    tl.fromTo(g("f10-f-store"), { boxShadow: ring, borderColor: "hsl(182 38% 36%)" },
      { boxShadow: flat, borderColor: "hsl(201 21% 89%)", duration: 0.34, ease: "power2.in", immediateRender: false }, 4.06);

    /* ── camera move 1 (4.1–5.7s) — coordinate-target-zoom onto the cart-total field ──
       outer scales, inner counter-translates; shared position, duration and ease.    */
    tl.fromTo(cam, { scale: 1 }, { scale: S1, duration: 1.60, ease: "power3.inOut" }, 4.10);
    tl.fromTo(camin, { x: 0, y: 0 }, { x: T1x, y: T1y, duration: 1.60, ease: "power3.inOut" }, 4.10);

    /* ── Scene 3 (4.35–6.2s) — ₪412 types in, with a thinking pause before the last digit ── */
    tl.fromTo(g("f10-f-price"), { boxShadow: flat, borderColor: "hsl(201 21% 89%)" },
      { boxShadow: ring, borderColor: "hsl(182 38% 36%)", duration: 0.34, ease: "power2.out" }, 4.35);
    typeAt(g("f10-price"), 4.60, [[0.00, ""], [0.22, "4"], [0.38, "41"], [0.94, "412"]]);
    /* caret — a deterministic square wave stepped on the timeline, never a CSS animation */
    for (var i = 0; i < 8; i++) { tl.set(g("f10-caret"), { opacity: i % 2 ? 0 : 1 }, 4.40 + i * 0.30); }
    tl.set(g("f10-caret"), { opacity: 0 }, 6.78);
    /* the entered value lands */
    tl.fromTo(g("f10-pricewrap"), { scale: 1 }, { scale: 1.06, duration: 0.14, ease: "power2.out" }, 5.62);
    tl.fromTo(g("f10-pricewrap"), { scale: 1.06 }, { scale: 1, duration: 0.30, ease: "power2.out", immediateRender: false }, 5.76);

    /* ── Scene 4 (6.3–8.4s) — the max-deals selector steps to 3 ── */
    tl.fromTo(g("f10-f-price"), { boxShadow: ring, borderColor: "hsl(182 38% 36%)" },
      { boxShadow: flat, borderColor: "hsl(201 21% 89%)", duration: 0.30, ease: "power2.in", immediateRender: false }, 6.26);
    tl.fromTo(g("f10-f-deals"), { boxShadow: flat, borderColor: "hsl(201 21% 89%)" },
      { boxShadow: ring, borderColor: "hsl(182 38% 36%)", duration: 0.32, ease: "power2.out" }, 6.30);
    tl.fromTo(g("f10-hint"), { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 6.42);
    typeAt(g("f10-deals"), 6.54, [[0.00, "דיל אחד"], [0.46, "2 דילים"], [0.96, "3 דילים"]]);
    [7.00, 7.50].forEach(function (at) {
      tl.fromTo(g("f10-deals"), { scale: 1 }, { scale: 1.10, duration: 0.12, ease: "power2.out", immediateRender: false }, at);
      tl.fromTo(g("f10-deals"), { scale: 1.10 }, { scale: 1, duration: 0.26, ease: "power2.out", immediateRender: false }, at + 0.12);
    });
    tl.fromTo(g("f10-f-deals"), { boxShadow: ring, borderColor: "hsl(182 38% 36%)" },
      { boxShadow: flat, borderColor: "hsl(201 21% 89%)", duration: 0.34, ease: "power2.in", immediateRender: false }, 8.32);

    /* ── camera move 2 (8.8–10.4s) — settle back so the whole filled form + control read ── */
    tl.fromTo(cam, { scale: S1 }, { scale: S2, duration: 1.60, ease: "power3.inOut", immediateRender: false }, 8.80);
    tl.fromTo(camin, { x: T1x, y: T1y }, { x: T2x, y: T2y, duration: 1.60, ease: "power3.inOut", immediateRender: false }, 8.80);

    /* ── Scene 5 (9.4–11.3s) — the submit: cursor glide → press-release-spring ── */
    var cur = g("f10-cursor");
    tl.fromTo(cur, { x: 250, opacity: 0 }, { x: btnX - 6, opacity: 1, duration: 1.15, ease: "power2.inOut" }, 9.40);
    tl.fromTo(cur, { y: 1210 }, { y: btnY - 5, duration: 1.15, ease: "power3.inOut" }, 9.40);
    tl.fromTo(cur, { scale: 1 }, { scale: 0.86, duration: 0.14, ease: "power1.in", immediateRender: false }, 10.55);
    tl.fromTo(cur, { scale: 0.86 }, { scale: 1, duration: 0.42, ease: "back.out(1.6)", immediateRender: false }, 10.69);

    var btn = g("f10-btn");
    tl.fromTo(btn, { scale: 1, boxShadow: "0 1px 2px oklch(30% 0.03 240 / 0.04), 0 8px 24px oklch(30% 0.03 240 / 0.06)" },
      { scale: 0.93, boxShadow: "0 1px 2px oklch(30% 0.03 240 / 0.10)", duration: 0.14, ease: "power1.in" }, 10.55);
    tl.fromTo(btn, { scale: 0.93 },
      { scale: 1, duration: 0.60, ease: "back.out(1.8)", immediateRender: false }, 10.69);

    tl.fromTo(g("f10-burst"), { scale: 1, opacity: 0 }, { scale: 4.6, opacity: 0.55, duration: 0.48, ease: "power2.out" }, 10.69);
    tl.to(g("f10-burst"), { opacity: 0, duration: 0.52, ease: "power2.in" }, 11.14);
    tl.fromTo(g("f10-glow2"), { opacity: 0, scale: 0.9 }, { opacity: 0.34, scale: 1.04, duration: 0.86, ease: "power2.out" }, 10.69);

    /* the surface answers: the control flips to its working state */
    tl.fromTo(g("f10-lbl-a"), { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "power2.in" }, 10.74);
    tl.fromTo(g("f10-lbl-b"), { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power2.out" }, 10.86);
    tl.fromTo([g("f10-f-store"), g("f10-f-price"), g("f10-f-deals"), g("f10-hint")],
      { opacity: 1 }, { opacity: 0.52, duration: 0.5, ease: "power2.out", stagger: 0.04, immediateRender: false }, 10.80);

    /* ── Scene 6 (10.9–15.0s) — machine theater; the frame is LOCKED ── */
    tl.fromTo(g("f10-spin"), { rotation: 0 }, { rotation: 1080, duration: 4.10, ease: "none" }, 10.90);
    [11.40, 12.60, 13.80].forEach(function (at) {
      tl.fromTo(g("f10-sheen"), { x: 0, opacity: 0 }, { x: 180, opacity: 0.9, duration: 0.30, ease: "power1.out", immediateRender: false }, at);
      tl.fromTo(g("f10-sheen"), { x: 180, opacity: 0.9 }, { x: 560, opacity: 0, duration: 0.44, ease: "power1.in", immediateRender: false }, at + 0.30);
    });
  })();
</script>
