    typeAt(g("f10-deals"), 5.52, [[0.00, "דיל אחד"], [0.44, "2 דילים"], [0.88, "3 דילים"]]);
    [5.96, 6.40].forEach(function (at) {
      tl.fromTo(g("f10-deals"), { scale: 1 }, { scale: 1.11, duration: 0.12, ease: "power2.out", immediateRender: false }, at);
      tl.fromTo(g("f10-deals"), { scale: 1.11 }, { scale: 1, duration: 0.26, ease: "power2.out", immediateRender: false }, at + 0.12);
    });
    focusOff(g("f10-fdeals"), 6.86);

    /* ── Scene 6 (7.10s) — the form is valid: the control wakes up ── */
    /* AA gate: the pre-valid control still carries white 22px/700 label text, so
       its resting teal sits at 0.82 alpha rather than 0.72 — the lift to full
       --primary when the form validates still reads, and the inactive state
       clears the 3:1 large-text floor instead of landing at 2.78:1. */
    tl.fromTo(btn, { backgroundColor: "hsl(182 38% 36% / 0.82)" },
      { backgroundColor: "hsl(182 38% 36%)", duration: 0.42, ease: "power2.out" }, 7.10);
    tl.fromTo(g("f10-notice"), { opacity: 1 }, { opacity: 0.66, duration: 0.42, ease: "power2.out" }, 7.10);

    /* ── Scene 7 (7.85–9.60s) — the submit: cursor glide → press-release-spring ── */
    var cur = g("f10-cursor");
    tl.fromTo(cur, { x: btnX + 520, opacity: 0 }, { x: btnX - 6, opacity: 1, duration: 1.10, ease: "power2.inOut" }, 7.85);
    tl.fromTo(cur, { y: 1210 }, { y: btnY - 5, duration: 1.10, ease: "power3.inOut" }, 7.85);
    tl.fromTo(cur, { scale: 1 }, { scale: 0.86, duration: 0.14, ease: "power1.in", immediateRender: false }, 8.98);
    tl.fromTo(cur, { scale: 0.86 }, { scale: 1, duration: 0.42, ease: "back.out(1.6)", immediateRender: false }, 9.12);

    tl.fromTo(btn, { scale: 1 }, { scale: 0.93, duration: 0.14, ease: "power1.in" }, 8.98);
    tl.fromTo(btn, { scale: 0.93 }, { scale: 1, duration: 0.60, ease: "back.out(1.8)", immediateRender: false }, 9.12);

    tl.fromTo(g("f10-burst"), { scale: 1, opacity: 0 }, { scale: 4.6, opacity: 0.55, duration: 0.48, ease: "power2.out" }, 9.12);
    tl.to(g("f10-burst"), { opacity: 0, duration: 0.52, ease: "power2.in" }, 9.60);
    tl.fromTo(g("f10-glow2"), { opacity: 0, scale: 0.9 }, { opacity: 0.34, scale: 1.04, duration: 0.86, ease: "power2.out" }, 9.12);

    /* the surface answers: the control flips to its working state */
    tl.fromTo(g("f10-lbl-a"), { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "power2.in" }, 9.16);
    tl.fromTo(g("f10-lbl-b"), { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power2.out" }, 9.28);
    tl.fromTo([g("f10-fstore"), g("f10-confirm"), g("f10-fprice"), g("f10-fdeals")],
      { opacity: 1 }, { opacity: 0.5, duration: 0.5, ease: "power2.out", stagger: 0.04, immediateRender: false }, 9.22);
    tl.set(g("f10-notice"), { textContent: "משלבים דילים…" }, 9.34);
    tl.fromTo(g("f10-notice"), { opacity: 0.66 }, { opacity: 1, duration: 0.40, ease: "power2.out", immediateRender: false }, 9.34);

    /* ── Scene 8 (9.32–12.0s) — the engine runs; the frame is LOCKED.
       The spinner ends exactly on the scene's last frame, so the cut into
       frame 11 lands on a still device with no residual translation.        */
    tl.fromTo(g("f10-spin"), { rotation: 0 }, { rotation: 720, duration: 2.68, ease: "none" }, 9.32);
    [9.75, 10.45, 11.15].forEach(function (at) {
      tl.fromTo(g("f10-sheen"), { x: 0, opacity: 0 }, { x: 180, opacity: 0.9, duration: 0.30, ease: "power1.out", immediateRender: false }, at);
      tl.fromTo(g("f10-sheen"), { x: 180, opacity: 0.9 }, { x: 560, opacity: 0, duration: 0.44, ease: "power1.in", immediateRender: false }, at + 0.30);
    });
  })();
