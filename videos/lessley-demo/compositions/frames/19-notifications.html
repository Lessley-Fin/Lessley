                                  <div class="f19-row-meta">אין פרטים נוספים.</div>
                                </div>

                            </div>

                            <div class="f19-below"><i></i>הכול עדכני</div>
                          </div>

                        </div>

                        <div class="nav">
                          <span class="nav-tab">אופטימיזציה</span>

                      <div class="toast f19-toast" data-camera-target>
                        <span class="f19-toast-ico">
                          <svg viewBox="0 0 24 24" width="24" height="24" fill="none"
                               stroke="hsl(var(--accent-foreground))" stroke-width="1.9" stroke-linecap="round">
                            <path d="M6 9a6 6 0 0 1 12 0c0 4 1.4 5.4 1.4 5.4H4.6S6 13 6 9Z" />
                            <path d="M10 18.4a2.2 2.2 0 0 0 4 0" />
                          </svg>
                        </span>
                        <span class="f19-toast-txt">
                          <span class="f19-toast-head">
                            <b>התראה חדשה</b>
                            <span class="f19-badge">ניתוח</span>
                          </span>
                          <span class="f19-toast-title">הניתוח מוכן</span>

          <div class="rail"><i style="width:100%"></i></div>
        </div>
      </div>

      <script>
        (function () {
          var ID = "19-notifications";
          var root = document.querySelector('[data-composition-id="' + ID + '"]');
          var one = function (s) { return root.querySelector(s); };
          var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

          var world = one(".screen-world");
          var prevPage = one(".f19-prev-page");
          var feedPage = one(".f19-feed-page");
          var toast = one(".f19-toast");
          var sheet = one(".f19-sheet");
          var below = one(".f19-below");
          var rows = all(".f19-row");
          var badges = all(".f19-sheet .f19-badge");
          var arc = one(".f19-arc");
          var spin = one(".f19-spin");
          var check = one(".f19-check");
          var recBody = one(".f19-rec-body");
          var glow = one(".bg-glow");
          var railFill = one(".rail > i");

          // ── the in-phone camera (coordinate-target-zoom, clamped to the screen) ──
          var CX = 205, CY = 456;
          function cam(S, tx, ty) {
            var mx = CX * (S - 1), my = CY * (S - 1);
            var x = S * (CX - tx), y = S * (CY - ty);
            if (x > mx) { x = mx; } if (x < -mx) { x = -mx; }
            if (y > my) { y = my; } if (y < -my) { y = -my; }
            return { scale: S, x: x, y: y };
          }
          var camIn = cam(1.06, 205, 456);       // arriving — frame 18 handed over a +Z push
          var camAnticipate = cam(1.12, 205, 300);
          var camToast = cam(1.42, 205, 115);    // data-camera-target: the toast
          var camFeed = cam(1.16, 205, 456);     // the opened feed
          var camHold = cam(1.30, 205, 456);     // the slow closing push

          var PAGE_H = 642;                      // app-main content height (912 - 133 - 97 - 40)
          var BODY_H = 410;                      // .f19-mask CSS height — authored constant

          var tl = gsap.timeline({ paused: true });

          // ── initial state ────────────────────────────────────────────────
          tl.set(world, { scale: camIn.scale, x: camIn.x, y: camIn.y }, 0);
          tl.set(feedPage, { y: -PAGE_H, opacity: 0, rotation: 0.9 }, 0);
          tl.set(prevPage, { y: 0, opacity: 1 }, 0);
          tl.set(check, { scale: 0, opacity: 0 }, 0);

          // ── Scene 1 (0.0–2.0) — the engine is still working, then finishes ──
          var spinState = { deg: 0 };
          tl.fromTo(spinState, { deg: 0 }, {
            deg: 690, duration: 1.9, ease: "none",
            onUpdate: function () { arc.setAttribute("transform", "rotate(" + spinState.deg + " 20 20)"); }
          }, 0);
          tl.fromTo(recBody, { opacity: 0.5 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.9);
          tl.fromTo(spin, { scale: 1, opacity: 1 }, { scale: 0.4, opacity: 0, duration: 0.28, ease: "power2.in" }, 1.86);
          tl.fromTo(check, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(2)" }, 1.96);

          tl.fromTo(one(".scene-kicker"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.35);
          tl.fromTo(one(".f19-title"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 0.55);

          // ── Scene 2 (2.05–5.3) — the toast lands OVER the live screen ─────
          tl.fromTo(toast, { y: -230, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "back.out(1.25)" }, 2.05);
          tl.fromTo(glow, { opacity: 0.85 }, { opacity: 1.3, duration: 0.4, ease: "power2.out" }, 2.05);
          tl.fromTo(glow, { opacity: 1.3 }, { opacity: 1, duration: 1.1, ease: "power2.inOut", immediateRender: false }, 2.5);

          // the camera is already creeping when the frame opens (cut seam from frame 18),
          // drifting toward the top of the screen just before the toast lands there
          tl.fromTo(world, camIn, {
            scale: camAnticipate.scale, x: camAnticipate.x, y: camAnticipate.y,
            duration: 2.35, ease: "none"
          }, 0);
          tl.fromTo(world, { scale: camAnticipate.scale, x: camAnticipate.x, y: camAnticipate.y }, {
            scale: camToast.scale, x: camToast.x, y: camToast.y,
            duration: 1.4, ease: "power2.inOut", immediateRender: false
          }, 2.35);

          tl.fromTo(one(".f19-body"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 4.0);

          // ── Scene 3 (5.3–6.5) — reactive-displacement: the feed hits the page ──
          var DRIVER_DUR = 1.2, VICTIM_FRACTION = 0.45, TILT = 0.9, FADE_IN_SHARPNESS = 4;
          var driver = { p: 0 };
          tl.fromTo(driver, { p: 0 }, {
            p: 1, duration: DRIVER_DUR, ease: "back.out(1.4)",
            onUpdate: function () {
              var p = driver.p;
              // intruder — the notifications feed, entering from above, tilt settling to 0
              gsap.set(feedPage, {
                y: -PAGE_H * (1 - p),
                rotation: TILT * (1 - p),
                opacity: Math.min(1, p * FADE_IN_SHARPNESS)
              });
              // victim — the previous page, displaced downward, done at VICTIM_FRACTION
              var vp = Math.min(1, p / VICTIM_FRACTION);
              gsap.set(prevPage, { y: PAGE_H * vp, opacity: 1 - vp * 0.9 });
              // the toast is consumed by the thing it announced
              var tp = Math.min(1, p / 0.3);
              gsap.set(toast, { y: -34 * tp, opacity: 1 - tp, scale: 1 - 0.05 * tp });
            }
          }, 5.3);

          tl.fromTo(world, { scale: camToast.scale, x: camToast.x, y: camToast.y }, {
            scale: camFeed.scale, x: camFeed.x, y: camFeed.y,
            duration: 1.3, ease: "power2.inOut", immediateRender: false
          }, 5.7);

          // ── Scene 4 (6.6–13.6) — anchored-layout-expand: the feed opens, sorted by tag ──
          tl.fromTo([sheet, below], { y: -BODY_H }, { y: 0, duration: 0.5, ease: "power3.out" }, 6.6);

          var rowAt = [7.5, 9.1, 10.6, 12.1];
          for (var i = 0; i < rows.length; i++) {
            tl.fromTo(rows[i], { opacity: 0, y: 16 },
              { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, rowAt[i]);
            tl.fromTo(badges[i], { scale: 0.6, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2)" }, rowAt[i] + 0.06);
          }
          tl.fromTo(below, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 12.9);

          // closing push — the camera never stops travelling into the feed
          tl.fromTo(world, { scale: camFeed.scale, x: camFeed.x, y: camFeed.y }, {
            scale: camHold.scale, x: camHold.x, y: camHold.y,
            duration: 7.9, ease: "none", immediateRender: false
          }, 7.1);

          // film-long progress rail: 270s → 285s of 315s
          tl.fromTo(railFill, { scaleX: 0.857 }, { scaleX: 0.905, duration: 15, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines[ID] = tl;
        })();
      </script>
</template>
