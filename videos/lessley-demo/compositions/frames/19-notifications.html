              gsap.set(toast, { y: -40 * tp, opacity: 1 - tp, scale: 1 - 0.05 * tp });
            }
          }, 4.1);

          // ── 5.30–6.95 — the feed arrives as a FULL list ───────────────────
          // The old cut gave one row every two seconds, so for most of the scene the
          // screen was a title over empty space. The real screen is a populated feed:
          // all five rows cascade in inside 1.1s and the list then stands complete.
          tl.fromTo(one(".f19-feed-page .app-h1"), { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 5.3);
          tl.fromTo(one(".f19-feed-page .app-sub"), { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 5.48);

          tl.fromTo(rows, { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.46, stagger: 0.16, ease: "power3.out" }, 5.85);
          tl.fromTo(badges, { scale: 0.6, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.32, stagger: 0.16, ease: "back.out(2)" }, 5.93);

          // ── 7.6–11.2 — the four types are called out, one per narration beat ──
          // ניתוח · מועדונים (two rows) · דיל · מערכת — the badge answers the word.
          var typeAt = [7.6, 8.6, 9.6, 10.6];
          var typeRows = [[rows[0]], [rows[1], rows[3]], [rows[2]], [rows[4]]];
          var typeBadges = [[badges[0]], [badges[1], badges[3]], [badges[2]], [badges[4]]];
          for (var i = 0; i < typeAt.length; i++) {
            var t = typeAt[i];
            tl.fromTo(typeBadges[i], { scale: 1 },
              { scale: 1.12, duration: 0.16, stagger: 0.06, ease: "power2.out", immediateRender: false }, t);
            tl.fromTo(typeBadges[i], { scale: 1.12 },
              { scale: 1, duration: 0.34, stagger: 0.06, ease: "power2.inOut", immediateRender: false }, t + 0.16);
            tl.fromTo(typeRows[i], { scale: 1 },
              { scale: 1.015, duration: 0.18, stagger: 0.06, ease: "power2.out", immediateRender: false }, t);
            tl.fromTo(typeRows[i], { scale: 1.015 },
              { scale: 1, duration: 0.40, stagger: 0.06, ease: "power2.inOut", immediateRender: false }, t + 0.18);
          }

          // film-long progress rail: 217s → 229s of 253s
          tl.fromTo(railFill, { scaleX: 0.857 }, { scaleX: 0.905, duration: 12, ease: "none" }, 0);

          // 11.24 → 12.0 the feed stands complete and completely still.

          window.__timelines = window.__timelines || {};
          window.__timelines[ID] = tl;
        })();
