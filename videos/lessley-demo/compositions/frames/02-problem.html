      <script>
        (function () {
          var ID = "02-problem";
          var ROOT = document.querySelector('[data-composition-id="' + ID + '"]') || document;
          function el(id) { return ROOT.querySelector('[id="' + id + '"]'); }
          function all(sel) { return Array.prototype.slice.call(ROOT.querySelectorAll(sel)); }

          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          window.__timelines[ID] = tl;

          function whip(target, at, offset, dur) {
            tl.fromTo(target, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, at);
            tl.fromTo(target, { y: offset }, { y: 0, duration: dur, ease: "power4.out" }, at);
          }
          function group(v) {
            return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          }

          /* ---- geometry (authored, never measured — deterministic) ----------- */
          var CX = 510, CY = 681;                       // the counter's centre on canvas
          var COLC = [827.25, 615.75, 404.25, 192.75];  // RTL column centres
          var ROWC = [352, 446, 540];                   // chip row centres

          /* ---- persistent rail ---------------------------------------------- */
          gsap.set(el("f02-rail"), { scaleX: 0.048 });
          tl.fromTo(el("f02-rail"), { scaleX: 0.048 }, { scaleX: 0.111, duration: 16, ease: "none" }, 0);

          /* ---- 0.0–1.0s — a plain cut in; the content, not a lens, does the work */
          // The camera entry settle (scale 1.16 → 1.00 plus a 5px blur clear) is
          // withdrawn: this scene never scales, translates or blurs a wrapper.
          tl.fromTo(el("f02-glow"), { opacity: 0.26 }, { opacity: 0.5, duration: 1.5, ease: "power2.out" }, 0.16);

          whip(el("f02-title"), 0.08, 80, 0.18);
          tl.fromTo(el("f02-underline"), { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power3.out" }, 0.24);
          whip(el("f02-b1"), 0.42, 46, 0.14);

          /* ---- Scene 1 + 2 (0.28–4.04s) — depth-scatter-assemble ------------- */
          // Every scattered value is index-derived off the golden angle: byte-identical
          // every render, no Math.random. The cloud spins so the scatter has life, then
          // resolves flat (z:0, rotations 0) into the ledger grid. Travel distances are
          // unchanged — only the arrival cadence is tightened.
          var chips = all(".f02-chip");
          var n = chips.length;
          var GOLDEN = Math.PI * (3 - Math.sqrt(5));
          var RADIUS = 430, Z_NEAR = 420, Z_FAR = -320, TUMBLE = 62;

          tl.fromTo(el("f02-swarm"), { rotationY: 22 }, { rotationY: 0, duration: 4.0, ease: "power1.out" }, 0.28);

          for (var i = 0; i < n; i++) {
            var a = i * GOLDEN;
            var depthT = i / (n - 1);
            var from = {
              x: Math.cos(a) * RADIUS,
              y: Math.sin(a) * RADIUS,
              z: Z_NEAR - depthT * (Z_NEAR - Z_FAR),
              rotationX: Math.sin(a) * TUMBLE,
              rotationY: Math.cos(a) * TUMBLE,
              opacity: 0
            };
            // three recognisable surfaces first, then the density wave
            var at = i < 3 ? 0.28 + i * 0.27 : 1.28 + (i - 3) * 0.245;
            var dur = i < 3 ? 0.88 : 0.80;
            tl.fromTo(
              chips[i],
              from,
              { x: 0, y: 0, z: 0, rotationX: 0, rotationY: 0, opacity: 1, duration: dur, ease: "power3.out" },
              at
            );
          }

          /* ---- Scene 3 (5.28–7.86s) — the frozen counter -------------------- */
          tl.fromTo(
            el("f02-counter"),
            { scale: 0.5, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
            5.28
          );
          whip(el("f02-b2"), 5.96, 44, 0.14);

          // counting-dynamic-scale — the two context figures climb while the ₪ figure
          // grows in visual weight and stays frozen at zero. That contrast IS the beat,
          // so the climb keeps 2.10s rather than the proportional 1.92s.
          var txEl = el("f02-tx"), spEl = el("f02-spend");
          var cs = { tx: 0, sp: 0 };
          tl.fromTo(
            cs, { tx: 0 },
            { tx: 142, duration: 2.10, ease: "power3.out",
              onUpdate: function () { txEl.textContent = group(cs.tx); } },
            5.76
          );
          tl.fromTo(
            cs, { sp: 0 },
            { sp: 5630, duration: 2.10, ease: "power3.out",
              onUpdate: function () { spEl.textContent = group(cs.sp); } },
            5.76
          );
          tl.fromTo(el("f02-figstack"), { scale: 0.62 }, { scale: 1, duration: 2.10, ease: "power3.out" }, 5.76);

          /* ---- Scene 4 (7.92–10.91s) — the close-in ------------------------- */
          // the world crowds the subject: the camera does NOT push here.
          tl.fromTo(el("f02-glow"), { opacity: 0.5 }, { opacity: 0.3, duration: 1.45, ease: "power2.inOut", immediateRender: false }, 7.92);

          var pills = all(".f02-pill");
          var ANG = [30, 90, 150, 210, 270, 330];
          var RX = 330, RY = 165;
          for (var p = 0; p < pills.length; p++) {
            var rad = (ANG[p] * Math.PI) / 180;
            var px = Math.cos(rad) * RX;
            var py = Math.sin(rad) * RY;
            gsap.set(pills[p], { xPercent: -50, yPercent: -50 });
            tl.fromTo(
              pills[p],
              { x: px * 1.7, y: py * 1.7, opacity: 0 },
              { x: px, y: py, opacity: 0.96, duration: 0.80, ease: "power3.out" },
              8.00 + p * 0.32
            );
          }

          // the ledger itself presses inward — surrounded, not zoomed into
          var inward = [];
          for (var c = 0; c < n; c++) {
            var dx = COLC[c % 4] - CX;
            var dy = ROWC[Math.floor(c / 4)] - CY;
            inward.push({ dx: dx, dy: dy });
            tl.fromTo(
              chips[c],
              { x: 0, y: 0 },
              { x: -dx * 0.075, y: -dy * 0.075, duration: 0.75, ease: "power2.inOut", immediateRender: false },
              8.48 + c * 0.032
            );
          }

          tl.fromTo(el("f02-vignette"), { opacity: 0 }, { opacity: 0.5, duration: 2.75, ease: "power2.inOut" }, 8.16);

          /* ---- 10.91–12.10s — the held crowded state (stillness before the break)
             Hold is where the 20% comes from: 1.80s → 1.19s. The break itself keeps
             3.90s of the original 4.60s, so the climax is not what gets clipped.    */

          /* ---- 12.10–16.0s — the frozen counter BREAKS, the space opens ------ */
          tl.fromTo(
            el("f02-breaklight"),
            { scaleX: 0, opacity: 0 },
            { scaleX: 1, opacity: 1, duration: 0.22, ease: "power2.out" },
            12.10
          );
          tl.fromTo(el("f02-counter"), { scale: 1 }, { scale: 1.055, duration: 0.12, ease: "power2.out", immediateRender: false }, 12.22);
          tl.fromTo(el("f02-counter"), { scale: 1.055 }, { scale: 1, duration: 0.50, ease: "power3.out", immediateRender: false }, 12.34);

          // the figure splits along its own middle — the two halves part and stay parted
          tl.fromTo(el("f02-fig-a"), { y: 0, rotation: 0 }, { y: -30, rotation: -2.4, duration: 0.80, ease: "power3.out" }, 12.30);
          tl.fromTo(el("f02-fig-b"), { y: 0, rotation: 0 }, { y: 30, rotation: 2.4, duration: 0.80, ease: "power3.out" }, 12.30);
          tl.fromTo(el("f02-breaklight"), { scaleX: 1 }, { scaleX: 1.5, duration: 0.70, ease: "power3.out", immediateRender: false }, 12.30);

          // center-outward-expansion — the clutter is shoved to the edges, opening
          // the negative space the next frame's phone arrives into.
          for (var o = 0; o < n; o++) {
            tl.fromTo(
              chips[o],
              { x: -inward[o].dx * 0.075, y: -inward[o].dy * 0.075, opacity: 1 },
              {
                x: inward[o].dx * 0.55, y: inward[o].dy * 0.55, opacity: 0.3,
                duration: 1.40, ease: "power2.out", immediateRender: false
              },
              12.38 + o * 0.032
            );
          }
          for (var q = 0; q < pills.length; q++) {
            var r2 = (ANG[q] * Math.PI) / 180;
            tl.fromTo(
              pills[q],
              { x: Math.cos(r2) * RX, y: Math.sin(r2) * RY, opacity: 0.96 },
              {
                x: Math.cos(r2) * RX * 1.85, y: Math.sin(r2) * RY * 1.85, opacity: 0.12,
                duration: 1.30, ease: "power2.out", immediateRender: false
              },
              12.52 + q * 0.045
            );
          }

          tl.fromTo(el("f02-vignette"), { opacity: 0.5 }, { opacity: 0.16, duration: 1.65, ease: "power2.out", immediateRender: false }, 12.75);
          tl.fromTo(
            el("f02-bloom"),
            { scale: 0.35, opacity: 0 },
            { scale: 1.5, opacity: 0.6, duration: 2.10, ease: "power2.out" },
            12.85
          );
          tl.fromTo(el("f02-glow"), { opacity: 0.3 }, { opacity: 0.72, duration: 1.75, ease: "power2.out", immediateRender: false }, 12.95);

          // the counter recedes into the opened space — the forward camera creep that
          // used to run alongside it is withdrawn; only content moves. It is still
          // travelling at the final frame, which is what frame 03 cuts against.
          tl.fromTo(el("f02-counter"), { opacity: 1 }, { opacity: 0.42, duration: 1.95, ease: "power2.in", immediateRender: false }, 14.05);
          tl.fromTo(el("f02-figstack"), { scale: 1 }, { scale: 0.86, duration: 1.95, ease: "power2.in", immediateRender: false }, 14.05);
          tl.fromTo(el("f02-fig-a"), { y: -30 }, { y: -54, duration: 1.65, ease: "power1.in", immediateRender: false }, 14.35);
          tl.fromTo(el("f02-fig-b"), { y: 30 }, { y: 54, duration: 1.65, ease: "power1.in", immediateRender: false }, 14.35);
        })();
      </script>
