          tl.fromTo(el("f02-underline"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.30);
          whip(el("f02-b1"), 0.52, 46, 0.16);

          /* ---- Scene 1 + 2 (0.35–5.0s) — depth-scatter-assemble -------------- */
          // Every scattered value is index-derived off the golden angle: byte-identical
          // every render, no Math.random. The cloud spins so the scatter has life, then
          // resolves flat (z:0, rotations 0) into the ledger grid.
          var chips = all(".f02-chip");
          var n = chips.length;
          var GOLDEN = Math.PI * (3 - Math.sqrt(5));
          var RADIUS = 430, Z_NEAR = 420, Z_FAR = -320, TUMBLE = 62;

          tl.fromTo(el("f02-swarm"), { rotationY: 22 }, { rotationY: 0, duration: 5.0, ease: "power1.out" }, 0.35);

          for (var i = 0; i < n; i++) {
            var a = i * GOLDEN;
            var depthT = i / (n - 1);
            var from = {
              x: Math.cos(a) * RADIUS,
              y: Math.sin(a) * RADIUS,
              z: Z_NEAR - depthT * (Z_NEAR - Z_FAR),
              rotationX: Math.sin(a) * TUMBLE,
              rotationY: Math.cos(a) * TUMBLE,
              opacity: 0
            };
            // three recognisable surfaces first, then the density wave
            var at = i < 3 ? 0.35 + i * 0.33 : 1.60 + (i - 3) * 0.30;
            var dur = i < 3 ? 1.05 : 0.95;
            tl.fromTo(
              chips[i],
              from,
              { x: 0, y: 0, z: 0, rotationX: 0, rotationY: 0, opacity: 1, duration: dur, ease: "power3.out" },
              at
            );
          }

          /* ---- Scene 3 (6.6–9.6s) — the frozen counter ---------------------- */
          tl.fromTo(
            el("f02-counter"),
            { scale: 0.5, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.62, ease: "power3.out" },
            6.60
          );
          whip(el("f02-b2"), 7.45, 44, 0.16);

          // counting-dynamic-scale — the two context figures climb while the ₪ figure
          // grows in visual weight and stays frozen at zero. That contrast IS the beat.
          var txEl = el("f02-tx"), spEl = el("f02-spend");
          var cs = { tx: 0, sp: 0 };
          tl.fromTo(
            cs, { tx: 0 },
            { tx: 142, duration: 2.4, ease: "power3.out",
              onUpdate: function () { txEl.textContent = group(cs.tx); } },
            7.20
          );
          tl.fromTo(
            cs, { sp: 0 },
            { sp: 5630, duration: 2.4, ease: "power3.out",
              onUpdate: function () { spEl.textContent = group(cs.sp); } },
            7.20
          );
          tl.fromTo(el("f02-figstack"), { scale: 0.62 }, { scale: 1, duration: 2.4, ease: "power3.out" }, 7.20);

          /* ---- Scene 4 (9.9–13.6s) — the close-in --------------------------- */
          // the world crowds the subject: the camera does NOT push here.
          tl.fromTo(el("f02-glow"), { opacity: 0.5 }, { opacity: 0.3, duration: 1.8, ease: "power2.inOut", immediateRender: false }, 9.90);

          var pills = all(".f02-pill");
          var ANG = [30, 90, 150, 210, 270, 330];
          var RX = 330, RY = 165;
          for (var p = 0; p < pills.length; p++) {
            var rad = (ANG[p] * Math.PI) / 180;
            var px = Math.cos(rad) * RX;
            var py = Math.sin(rad) * RY;
            gsap.set(pills[p], { xPercent: -50, yPercent: -50 });
            tl.fromTo(
              pills[p],
              { x: px * 1.7, y: py * 1.7, opacity: 0 },
              { x: px, y: py, opacity: 0.96, duration: 0.95, ease: "power3.out" },
              10.00 + p * 0.40
            );
          }

          // the ledger itself presses inward — surrounded, not zoomed into
          var inward = [];
          for (var c = 0; c < n; c++) {
            var dx = COLC[c % 4] - CX;
            var dy = ROWC[Math.floor(c / 4)] - CY;
            inward.push({ dx: dx, dy: dy });
            tl.fromTo(
              chips[c],
              { x: 0, y: 0 },
              { x: -dx * 0.075, y: -dy * 0.075, duration: 0.9, ease: "power2.inOut", immediateRender: false },
              10.60 + c * 0.04
            );
          }

          tl.fromTo(el("f02-vignette"), { opacity: 0 }, { opacity: 0.5, duration: 3.4, ease: "power2.inOut" }, 10.20);

          /* ---- 13.6–15.4s — the held crowded state (stillness before the break) */

          /* ---- 15.4–20.0s — the frozen counter BREAKS, the space opens ------- */
          tl.fromTo(
            el("f02-breaklight"),
            { scaleX: 0, opacity: 0 },
            { scaleX: 1, opacity: 1, duration: 0.24, ease: "power2.out" },
            15.40
          );
          tl.fromTo(el("f02-counter"), { scale: 1 }, { scale: 1.055, duration: 0.14, ease: "power2.out", immediateRender: false }, 15.52);
          tl.fromTo(el("f02-counter"), { scale: 1.055 }, { scale: 1, duration: 0.55, ease: "power3.out", immediateRender: false }, 15.66);

          // the figure splits along its own middle — the two halves part and stay parted
          tl.fromTo(el("f02-fig-a"), { y: 0, rotation: 0 }, { y: -30, rotation: -2.4, duration: 0.9, ease: "power3.out" }, 15.62);
          tl.fromTo(el("f02-fig-b"), { y: 0, rotation: 0 }, { y: 30, rotation: 2.4, duration: 0.9, ease: "power3.out" }, 15.62);
          tl.fromTo(el("f02-breaklight"), { scaleX: 1 }, { scaleX: 1.5, duration: 0.8, ease: "power3.out", immediateRender: false }, 15.62);

          // center-outward-expansion — the clutter is shoved to the edges, opening
          // the negative space the next frame's phone arrives into.
          for (var o = 0; o < n; o++) {
            tl.fromTo(
              chips[o],
              { x: -inward[o].dx * 0.075, y: -inward[o].dy * 0.075, opacity: 1 },
              {
                x: inward[o].dx * 0.55, y: inward[o].dy * 0.55, opacity: 0.3,
                duration: 1.6, ease: "power2.out", immediateRender: false
              },
              15.70 + o * 0.035
            );
          }
          for (var q = 0; q < pills.length; q++) {
            var r2 = (ANG[q] * Math.PI) / 180;
            tl.fromTo(
              pills[q],
              { x: Math.cos(r2) * RX, y: Math.sin(r2) * RY, opacity: 0.96 },
              {
                x: Math.cos(r2) * RX * 1.85, y: Math.sin(r2) * RY * 1.85, opacity: 0.12,
                duration: 1.5, ease: "power2.out", immediateRender: false
              },
              15.86 + q * 0.05
            );
          }

          tl.fromTo(el("f02-vignette"), { opacity: 0.5 }, { opacity: 0.16, duration: 1.9, ease: "power2.out", immediateRender: false }, 16.10);
          tl.fromTo(
            el("f02-bloom"),
            { scale: 0.35, opacity: 0 },
            { scale: 1.5, opacity: 0.6, duration: 2.4, ease: "power2.out" },
            16.20
          );
          tl.fromTo(el("f02-glow"), { opacity: 0.3 }, { opacity: 0.72, duration: 2.0, ease: "power2.out", immediateRender: false }, 16.30);

          // the counter recedes into the opened space and the camera creeps forward —
          // accelerating at the final frame, handing the empty centre to frame 03.
          tl.fromTo(el("f02-counter"), { opacity: 1 }, { opacity: 0.42, duration: 2.1, ease: "power2.in", immediateRender: false }, 17.90);
          tl.fromTo(el("f02-figstack"), { scale: 1 }, { scale: 0.86, duration: 2.1, ease: "power2.in", immediateRender: false }, 17.90);
          tl.fromTo(el("f02-camtarget"), { scale: 1 }, { scale: 1.10, duration: 2.40, ease: "power2.in" }, 17.60);
          tl.fromTo(el("f02-fig-a"), { y: -30 }, { y: -54, duration: 1.80, ease: "power1.in", immediateRender: false }, 18.20);
          tl.fromTo(el("f02-fig-b"), { y: 30 }, { y: 54, duration: 1.80, ease: "power1.in", immediateRender: false }, 18.20);
        })();
      </script>
    </template>
