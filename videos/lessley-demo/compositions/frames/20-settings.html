        .f20-hl { position: absolute; inset: 0; z-index: 0; opacity: 0;

          <div class="rail"><i style="width:100%"></i></div>
        </div>
      </div>

      <script>
        (function () {
          var ID = "20-settings";
          var root = document.querySelector('[data-composition-id="' + ID + '"]');
          var one = function (s) { return root.querySelector(s); };
          var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

          var cursor = one(".f20-cursor");
          var menuPage = one(".f20-menu-page");
          var prefsPage = one(".f20-prefs-page");
          var prefsCard = one(".f20-prefs");
          var head = one(".f20-head");
          var clubChips = all(".f20-g-clubs .pchip");
          var levelChips = all(".f20-g-level .pchip");
          var mutedChips = all(".f20-g-muted .pchip");
          var labels = all(".f20-glabel");
          var saveBtn = one(".f20-save");
          var savedMsg = one(".f20-saved");
          var chips = all(".f20-chips span");
          var railFill = one(".rail > i");

          var hlProfile = one(".f20-r-profile .f20-hl");
          var hlPrefs = one(".f20-r-prefs .f20-hl");
          var hlBanking = one(".f20-r-banking .f20-hl");
          var hlLang = one(".f20-r-lang .f20-hl");
          var hlLogout = one(".f20-r-logout .f20-hl");

          var ripPrefs = one(".f20-rip-prefs i");
          var ripSave = one(".f20-rip-save i");
          var ripBack = one(".f20-rip-back i");

          // No in-phone camera. .screen-world is never transformed — it holds
          // scale 1 / x 0 / y 0 for the whole scene (frame.md, revised 18/08).
          var PAGE_W = 440;   // .app-main width — the view-swap travel distance

          var tl = gsap.timeline({ paused: true });

          tl.set([ripPrefs, ripSave, ripBack], { scale: 0, opacity: 0 }, 0);
          tl.set(cursor, { x: 320, y: 1030, scale: 1 }, 0);

          // every cursor leg is an explicit fromTo — seek-safe at any playhead
          function moveTo(at, dur, fx, fy, tx, ty) {
            tl.fromTo(cursor, { x: fx, y: fy },
              { x: tx, y: ty, duration: dur, ease: "power2.inOut", immediateRender: false }, at);
          }
          // a press: cursor dip + row wash + one ripple ring (cursor-click-ripple)
          function press(at) {
            tl.fromTo(cursor, { scale: 1 }, { scale: 0.84, duration: 0.08, ease: "power2.in" }, at);
            tl.fromTo(cursor, { scale: 0.84 }, { scale: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, at + 0.08);
          }
          function wash(at, hl, held) {
            tl.fromTo(hl, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, at);
            tl.fromTo(hl, { opacity: 1 }, { opacity: held, duration: 0.5, ease: "power2.out", immediateRender: false }, at + 0.3);
          }
          function ripple(at, el) {
            tl.fromTo(el, { scale: 0, opacity: 0.5 },
              { scale: 3.2, opacity: 0, duration: 0.75, ease: "power2.out", immediateRender: false }, at + 0.04);
          }
          function lightChip(at, el) {
            tl.fromTo(el, { opacity: 0.4, color: "hsl(203 13% 67%)" },
              { opacity: 1, color: "hsl(203 36% 96%)", duration: 0.45, ease: "power2.out" }, at);
          }

          // ── initial state — the settings menu is already on screen ────────
          tl.set(prefsPage, { x: -PAGE_W, opacity: 0 }, 0);
          tl.set(menuPage, { x: 0, opacity: 1 }, 0);
          tl.set(chips, { opacity: 0.4 }, 0);

          tl.fromTo(one(".scene-kicker"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
          tl.fromTo(one(".f20-title"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.45);
          tl.fromTo(all(".f20-chips"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.95);

          // ── 0.8–2.6 — the cursor arrives and reads the profile row ────────
          // The 20% retime came out of the dead air between clicks: every travel leg
          // and every read still runs long enough to be followed, but the cursor now
          // leaves for the next target as soon as the current row has answered.
          moveTo(0.8, 0.9, 320, 1030, 300, 335);
          wash(1.8, hlProfile, 0);

          // ── 2.2–3.7 — העדפות is opened; the view pushes in from the start edge ──
          moveTo(2.2, 0.45, 300, 335, 300, 418);
          press(2.75);
          wash(2.75, hlPrefs, 0);
          ripple(2.75, ripPrefs);

          tl.fromTo(menuPage, { x: 0, opacity: 1 },
            { x: 0.34 * PAGE_W, opacity: 0, duration: 0.42, ease: "power3.in", immediateRender: false }, 3.0);
          tl.fromTo(prefsPage, { x: -PAGE_W, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.48, ease: "power3.out", immediateRender: false }, 3.05);
          tl.fromTo(head, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 3.22);
          tl.fromTo(prefsCard, { opacity: 0, scale: 0.94, y: 22 },
            { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.3)" }, 3.18);

          // ── 3.6–6.8 — each preference group reads out on its own cue ──────
          // מועדוני נאמנות — all ten clubs from the clubs collection
          tl.fromTo(labels[0], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 3.6);
          tl.fromTo(clubChips, { opacity: 0, y: 14, scale: 0.86 },
            { opacity: 1, y: 0, scale: 1, duration: 0.3, stagger: 0.045, ease: "back.out(2)" }, 3.72);
          // the ten joined clubs assert themselves — 10 clubs, demo truth
          tl.fromTo(clubChips, { scale: 1 },
            { scale: 1.05, duration: 0.14, stagger: 0.035, ease: "power2.out", immediateRender: false }, 4.55);
          tl.fromTo(clubChips, { scale: 1.05 },
            { scale: 1, duration: 0.28, stagger: 0.035, ease: "power2.inOut", immediateRender: false }, 4.69);
          // "מועדונים," lights on the beat the ten club chips assert themselves
          lightChip(3.85, chips[0]);

          // רמת התאמה
          tl.fromTo(labels[1], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 5.15);
          tl.fromTo(levelChips, { opacity: 0, y: 14, scale: 0.86 },
            { opacity: 1, y: 0, scale: 1, duration: 0.3, stagger: 0.08, ease: "back.out(2)" }, 5.27);
          tl.fromTo(levelChips[1], { scale: 1 }, { scale: 1.07, duration: 0.15, ease: "power2.out", immediateRender: false }, 5.8);
          tl.fromTo(levelChips[1], { scale: 1.07 }, { scale: 1, duration: 0.3, ease: "power2.inOut", immediateRender: false }, 5.95);
          // "רמת סינון" lights on the beat the match-level chips land
          lightChip(5.4, chips[1]);

          // קטגוריות מושתקות
          tl.fromTo(labels[2], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 6.15);
          tl.fromTo(mutedChips, { opacity: 0, y: 14, scale: 0.86 },
            { opacity: 1, y: 0, scale: 1, duration: 0.3, stagger: 0.07, ease: "back.out(2)" }, 6.27);

          // ── 6.95–8.2 — the panel closes on the save button and commits ────
          tl.set(savedMsg, { opacity: 0 }, 0);
          tl.fromTo(saveBtn, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 6.95);
          moveTo(7.1, 0.42, 300, 418, 300, 672);
          press(7.65);
          ripple(7.65, ripSave);
          tl.fromTo(saveBtn, { scale: 1 }, { scale: 0.97, duration: 0.08, ease: "power2.in", immediateRender: false }, 7.65);
          tl.fromTo(saveBtn, { scale: 0.97 }, { scale: 1, duration: 0.24, ease: "back.out(2.2)", immediateRender: false }, 7.73);
          tl.fromTo(savedMsg, { opacity: 0, y: 8 },
            { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, 7.85);

          // ── 8.1–9.3 — back to the menu ────────────────────────────────────
          moveTo(8.1, 0.35, 300, 672, 396, 152);
          press(8.6);
          ripple(8.6, ripBack);
          tl.fromTo(prefsPage, { x: 0, opacity: 1 },
            { x: -PAGE_W, opacity: 0, duration: 0.42, ease: "power3.in", immediateRender: false }, 8.75);
          tl.fromTo(menuPage, { x: 0.34 * PAGE_W, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.46, ease: "power3.out", immediateRender: false }, 8.8);

          // ── 8.95–11.8 — the remaining rows, one per narration beat ────────
          moveTo(8.95, 0.45, 396, 152, 300, 501);
          wash(9.45, hlBanking, 0.45);
          lightChip(9.45, chips[2]);

          // the שפה row still washes, but the locked copy has no line for it,
          // so no chip lights here — the sentence has four phrases, not five.
          moveTo(9.75, 0.35, 300, 501, 300, 584);
          wash(10.15, hlLang, 0.45);

          moveTo(10.55, 0.4, 300, 584, 300, 667);
          wash(11.0, hlLogout, 0.45);
          lightChip(11.0, chips[3]);

          // film-long progress rail: 229s → 241s of 253s
          tl.fromTo(railFill, { scaleX: 0.905 }, { scaleX: 0.952, duration: 12, ease: "none" }, 0);

          // 11.8 → 12.0 the cursor rests on התנתקות and the frame is still.

          window.__timelines = window.__timelines || {};
          window.__timelines[ID] = tl;
        })();
      </script>
</template>
