          var hlLang = one(".f20-lang .f20-hl");
          var hlLogout = one(".f20-logout .f20-hl");

          var rings = all(".f20-rip i");
          var rip1 = all(".f20-rip-1 i");
          var rip2 = all(".f20-rip-2 i");
          var rip3 = all(".f20-rip-3 i");

          // ── the in-phone camera (coordinate-target-zoom, clamped to the screen) ──
          var CX = 205, CY = 456;
          function cam(S, tx, ty) {
            var mx = CX * (S - 1), my = CY * (S - 1);
            var x = S * (CX - tx), y = S * (CY - ty);
            if (x > mx) { x = mx; } if (x < -mx) { x = -mx; }
            if (y > my) { y = my; } if (y < -my) { y = -my; }
            return { scale: S, x: x, y: y };
          }
          var camIn = cam(1.02, 205, 330);     // arriving — already creeping (cut from 19)
          var camDrift = cam(1.06, 205, 330);
          var camMenu = cam(1.24, 205, 330);   // data-camera-target: the menu list
          var camBank = cam(1.42, 205, 692);   // data-camera-target: the banking card
          var camOut = cam(1.47, 205, 692);    // still pushing at the last frame

          var BODY_H = 148;                    // .f20-mask CSS height — authored constant

          var tl = gsap.timeline({ paused: true });

          // rings live in the DOM from t=0 at their click points, scale 0 / opacity 0
          tl.set(rings, { scale: 0, opacity: 0 }, 0);
          tl.set(cursor, { x: 330, y: 980, scale: 1 }, 0);

          // a click: cursor press + target press + ripple burst (cursor-click-ripple)
          function click(at, hl, ripple) {
            tl.fromTo(cursor, { scale: 1 }, { scale: 0.84, duration: 0.08, ease: "power2.in" }, at);
            tl.fromTo(cursor, { scale: 0.84 }, { scale: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, at + 0.08);
            tl.fromTo(hl, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, at);
            tl.fromTo(hl, { opacity: 1 }, { opacity: 0.4, duration: 0.5, ease: "power2.out", immediateRender: false }, at + 0.3);
            tl.fromTo(ripple, { scale: 0, opacity: 0.5 },
              { scale: 3.2, opacity: 0, duration: 0.75, ease: "power2.out", stagger: 0.09, immediateRender: false },
              at + 0.04);
          }
          // every cursor leg is an explicit fromTo — seek-safe at any playhead
          function moveTo(at, dur, fx, fy, tx, ty) {
            tl.fromTo(cursor, { x: fx, y: fy },
              { x: tx, y: ty, duration: dur, ease: "power2.inOut", immediateRender: false }, at);
          }
          function lightChip(at, el) {
            tl.fromTo(el, { opacity: 0.4, color: "hsl(203 13% 67%)" },
              { opacity: 1, color: "hsl(203 36% 96%)", duration: 0.45, ease: "power2.out" }, at);
          }

          // ── entry: the camera is already creeping in (cut seam from frame 19) ──
          tl.fromTo(world, camIn, {
            scale: camDrift.scale, x: camDrift.x, y: camDrift.y, duration: 2.4, ease: "none"
          }, 0);

          tl.fromTo(one(".scene-kicker"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.35);
          tl.fromTo(one(".f20-title"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 0.55);
          tl.fromTo(one(".f20-chips"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.2);
          tl.set(chips, { opacity: 0.4 }, 0);

          // ── Scene 1 (0.8–3.6) — the cursor arrives and opens the profile ──
          moveTo(0.8, 1.0, 330, 980, 300, 244);
          click(2.0, hlProfile, rip1);
          lightChip(2.1, chips[0]);
          tl.fromTo(world, { scale: camDrift.scale, x: camDrift.x, y: camDrift.y }, {
            scale: camMenu.scale, x: camMenu.x, y: camMenu.y,
            duration: 1.2, ease: "power2.inOut", immediateRender: false
          }, 2.4);

          // ── Scene 2 (3.9–8.5) — preferences springs open (anchored-layout-expand) ──
          moveTo(3.9, 0.6, 300, 244, 300, 326);
          click(4.55, hlPrefs, rip2);
          lightChip(4.7, chips[1]);
          tl.fromTo([sheet, below], { y: -BODY_H }, { y: 0, duration: 0.5, ease: "power3.out" }, 4.7);
          tl.fromTo(subs, { opacity: 0 },
            { opacity: 1, duration: 0.26, stagger: 0.07, ease: "power2.out" }, 4.83);
          // each preference reads out on its own cue
          tl.fromTo(subVals[0], { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 5.5);
          tl.fromTo(subVals[1], { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 6.7);
          tl.fromTo(subVals[2], { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 7.9);

          // ── Scene 3 (8.6–11.0) — banking: the menu closes, the card takes the frame ──
          moveTo(8.6, 0.45, 300, 326, 300, 556);
          click(9.05, hlBanking, rip3);
          lightChip(9.2, chips[2]);
          tl.fromTo([sheet, below], { y: 0 }, { y: -BODY_H, duration: 0.3, ease: "power3.in", immediateRender: false }, 9.2);
          // the cursor stays on the row it clicked while the row travels up with the collapse
          moveTo(9.2, 0.3, 300, 556, 300, 408);
          tl.fromTo(bank, { opacity: 0, scale: 0.92, y: 18 },
            { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.4)" }, 9.55);
          tl.fromTo(world, { scale: camMenu.scale, x: camMenu.x, y: camMenu.y }, {
            scale: camBank.scale, x: camBank.x, y: camBank.y,
            duration: 1.35, ease: "power2.inOut", immediateRender: false
          }, 9.7);

          // ── Scene 4 (10.4–15.0) — each linked card sharpens the match; then שפה / התנתקות ──
          moveTo(10.4, 0.7, 300, 408, 300, 700);
          tl.fromTo(bankRing, { opacity: 0, scale: 1.08 },
            { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 11.5);
          tl.fromTo(bankNote, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 12.4);

          moveTo(13.4, 0.55, 300, 700, 300, 482);
          tl.fromTo(hlLang, { opacity: 0 }, { opacity: 0.55, duration: 0.3, ease: "power2.out" }, 13.9);
          lightChip(13.6, chips[3]);
          moveTo(14.25, 0.5, 300, 482, 300, 548);
          tl.fromTo(hlLogout, { opacity: 0 }, { opacity: 0.55, duration: 0.3, ease: "power2.out" }, 14.7);
          lightChip(14.4, chips[4]);

          // the push never fully stops — frame 21 arrives on the inverse of it
          tl.fromTo(world, { scale: camBank.scale, x: camBank.x, y: camBank.y }, {
            scale: camOut.scale, x: camOut.x, y: camOut.y,
            duration: 1.6, ease: "none", immediateRender: false
          }, 13.4);

          // film-long progress rail: 285s → 300s of 315s
          tl.fromTo(railFill, { scaleX: 0.905 }, { scaleX: 0.952, duration: 15, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines[ID] = tl;
        })();
      </script>
</template>
