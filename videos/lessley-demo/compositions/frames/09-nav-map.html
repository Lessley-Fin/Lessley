      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          /* ── the STAGE camera: one .world wrapper, T = -offset x S ────────
             There is no phone in this scene, so no in-phone camera exists to
             remove — this traverse is the film's one pull-back and it stays. */
          var world = document.getElementById("f09-world");
          function pose(id, S, biasX, biasY) {
            var el = document.getElementById(id);
            var W = world.offsetWidth, H = world.offsetHeight;
            var ox = 0, oy = 0, n = el;
            while (n && n !== world) { ox += n.offsetLeft; oy += n.offsetTop; n = n.offsetParent; }
            var cx = ox + el.offsetWidth / 2, cy = oy + el.offsetHeight / 2;
            return {
              x: -(cx - W / 2) * S + (biasX || 0),
              y: -(cy - H / 2) * S + (biasY || 0),
              scale: S
            };
          }
          var PAN = 1.70, STRIP = 1.65, LAND = 1.95;
          var P1 = pose("f09-st1", PAN), P2 = pose("f09-st2", PAN);
          var P3 = pose("f09-st3", PAN), P4 = pose("f09-st4", PAN);
          var PB = pose("f09-bell", STRIP, 0, 250);
          var PA = pose("f09-avatar", STRIP, 0, 250);
          /* the hand-off: thumb 1 lands phone-shaped on frame 10's phone mark
             (cx 754 under the tightened 80px stage padding) */
          var PM = pose("f09-thumb1", 1.45, 754 - 960, 0);
          var PL = pose("f09-thumb1", LAND, 754 - 960, 0);

          /* ── Scene 1 (0.0–1.0s) — INVERSE-ZOOM arrival: something bigger lands */
          tl.fromTo("#f09-world", { x: 0, y: 0, scale: 1.18 },
            { x: 0, y: 0, scale: 1, duration: 0.88, ease: "power3.out" }, 0);

          /* the four screens spread out as stations (waterfall-entry) */
          var st = [
            { id: "#f09-st1", at: 0.42, dy: 96, d: 0.22 },
            { id: "#f09-st2", at: 0.64, dy: 78, d: 0.19 },
            { id: "#f09-st3", at: 0.82, dy: 68, d: 0.17 },
            { id: "#f09-st4", at: 0.98, dy: 60, d: 0.16 }
          ];
          for (var i = 0; i < st.length; i++) {
            tl.set(st[i].id, { opacity: 1, y: st[i].dy }, st[i].at);
            tl.to(st[i].id, { y: 0, duration: st[i].d, ease: "power4.out" }, st[i].at);
          }

          tl.fromTo("#f09-p1", { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.50, ease: "power3.out" }, 1.14);
          tl.fromTo("#f09-p2", { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.50, ease: "power3.out" }, 1.44);

          /* ── Scenes 2–5 — the pan traverse; each station is named on arrival */
          function nameStation(n, at) {
            tl.set("#f09-lb" + n, { opacity: 1, y: 46 }, at);
            tl.to("#f09-lb" + n, { y: 0, duration: 0.24, ease: "power4.out" }, at);
            tl.set("#f09-ds" + n, { opacity: 1, y: 34 }, at + 0.14);
            tl.to("#f09-ds" + n, { y: 0, duration: 0.22, ease: "power4.out" }, at + 0.14);
            tl.fromTo("#f09-nav" + n, { scale: 0.72 },
              { scale: 1, duration: 0.5, ease: "back.out(2.2)" }, at + 0.04);

          /* Retimed to 12s: the traverse keeps all four stops and keeps naming
             each station on arrival — the cut comes out of the dwell after each
             name lands, so the camera never travels faster than it did at 15s. */
          tl.to("#f09-world", { x: P1.x, y: P1.y, scale: P1.scale,
            duration: 1.10, ease: "power2.inOut" }, 1.70);

            duration: 0.52, ease: "power2.inOut" }, 3.14);
          nameStation(2, 3.76);

            duration: 0.40, ease: "power2.inOut" }, 4.84);
          nameStation(4, 5.34);

          /* the cascade resolves into the composed layout — all four at once */
          tl.to("#f09-world", { x: 0, y: 0, scale: 1,
            duration: 1.00, ease: "power2.inOut" }, 5.88);

          /* ── Scene 6 (6.9–10.4s) — the top bar: bell, red badge, avatar ─── */
          tl.set("#f09-bell", { opacity: 1, y: 54 }, 6.90);
