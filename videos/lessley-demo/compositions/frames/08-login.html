      <script>
        (function () {
          var F = 1 / 60;
          var tl = gsap.timeline({ paused: true });

          /* ── in-phone camera — pushes once, then LOCKS for the whole cycle */
          var world = document.getElementById("f08-world");
          var btn = document.getElementById("f08-btn0");

          function camPose(target, S) {
            var W = world.offsetWidth, H = world.offsetHeight;
            var ox = 0, oy = 0, n = target;
            while (n && n !== world) { ox += n.offsetLeft; oy += n.offsetTop; n = n.offsetParent; }
            var cx = ox + target.offsetWidth / 2, cy = oy + target.offsetHeight / 2;
            var tx = -(cx - W / 2) * S, ty = -(cy - H / 2) * S;
            var mx = (S - 1) * W / 2, my = (S - 1) * H / 2;
            if (tx > mx) tx = mx; if (tx < -mx) tx = -mx;
            if (ty > my) ty = my; if (ty < -my) ty = -my;
            return { x: tx, y: ty, scale: S };
          }
          var FORM_POSE = camPose(btn, 1.22);

          /* ── entry: 07 left rising, so 08 arrives still travelling upward ─ */
          tl.fromTo("#f08-content", { y: 64 },
            { y: 0, duration: 0.62, ease: "power3.out" }, 0);

          /* ── Scene 1 (0.0–1.6s) — stage title, then the surface establishes */
          tl.set("#f08-t1", { opacity: 1, y: 82 }, 0.10);
          tl.to("#f08-t1", { y: 0, duration: 0.20, ease: "power4.out" }, 0.10);
          tl.fromTo("#f08-p1", { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.46);
          tl.fromTo("#f08-p2", { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.74);

          /* the anchor settles ONCE — after this it is never tweened again */
          tl.fromTo("#f08-anchor", { opacity: 0, y: 24 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.62);

          /* ── Scene 2 (1.7–3.1s) — camera pushes into the form, then locks ─ */
          tl.to("#f08-phone", { scale: 1.20, duration: 1.4, ease: "power2.inOut" }, 1.70);
          tl.fromTo("#f08-world",
            { x: 0, y: 0, scale: 1 },
            { x: FORM_POSE.x, y: FORM_POSE.y, scale: FORM_POSE.scale,
              duration: 1.4, ease: "power2.inOut" }, 1.70);

          /* ── the cursor is the actor: click → morph, three times ─────────── */
          function press(at, ripple) {
            tl.to("#f08-cursor", { scale: 0.84, duration: 0.08, ease: "power2.in" }, at);
            tl.to("#f08-cursor", { scale: 1, duration: 0.10, ease: "power2.out" }, at + 0.08);
            tl.fromTo(ripple, { scale: 0.14, opacity: 0.85 },
              { scale: 2.6, opacity: 0, duration: 0.72, ease: "power2.out",
                immediateRender: false }, at + 0.04);
          }

          tl.set("#f08-cursor", { opacity: 1, x: 296, y: 906, scale: 1 }, 3.30);
          tl.to("#f08-cursor", { x: 196, y: 528, duration: 0.72, ease: "power3.out" }, 3.38);
          press(4.14, "#f08-rip1");

          tl.to("#f08-cursor", { x: 327, y: 406, duration: 0.66, ease: "power2.inOut" }, 7.02);
          press(7.74, "#f08-rip2");

          tl.to("#f08-cursor", { x: 196, y: 467, duration: 0.60, ease: "power2.inOut" }, 9.78);
          press(10.44, "#f08-rip3");

          /* ── theme-crossfade-morph: four pre-styled skins, one anchor ────── */
          var MORPH = 0.32;
          var skins = ["#f08-skin1", "#f08-skin2", "#f08-skin3"];
          var prev = [".f08-skin-0", "#f08-skin1", "#f08-skin2"];
          var at = [4.30, 7.90, 10.60];
          for (var k = 0; k < skins.length; k++) {
            tl.fromTo(skins[k], { opacity: 0 },
              { opacity: 1, duration: MORPH, ease: "power2.inOut", immediateRender: false }, at[k]);
            tl.to(prev[k], { opacity: 0, duration: MORPH, ease: "power2.inOut" }, at[k]);
          }

          /* ── Scene 3 (11.3–13.4s) — payoff state, the cursor rests, HOLD ── */
          tl.fromTo("#f08-btn3", { scale: 0.962 },
            { scale: 1, duration: 0.55, ease: "back.out(1.7)" }, 11.34);
          tl.fromTo("#f08-glow", { opacity: 0.82 },
            { opacity: 1, duration: 1.0, ease: "power2.out" }, 11.30);

          /* ── the seam: the frame recedes so 09 can arrive as a pull-back ── */
          tl.to("#f08-content", { scale: 0.90, duration: 1.6, ease: "power2.in" }, 13.40);

          window.__timelines = window.__timelines || {};
          window.__timelines["08-login"] = tl;
        })();
      </script>
