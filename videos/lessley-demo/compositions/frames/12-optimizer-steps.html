                        </div>
                        <div class="f12-fade"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="device-island"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="rail"><i id="f12-rail"></i></div>
</div>

<script>
  (function () {
    var ID = "12-optimizer-steps";
    var D = 13;
    var SW = 410, SH = 912, SCX = SW / 2, SCY = SH / 2;
    var BODY_H = 288;   /* authored constant — equals .f12-mask / .f12-sheet CSS height */

    var g = function (id) { return document.getElementById(id); };
    var cam = g("f12-cam"), camin = g("f12-camin");

    function offsetOf(el, root) {
      var x = 0, y = 0, n = el;
      while (n && n !== root) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
      return { x: x + el.offsetWidth / 2 - SCX, y: y + el.offsetHeight / 2 - SCY };
    }
    var offMask = g("f12-mask").offsetHeight ? offsetOf(g("f12-mask"), camin) : { x: 0, y: -55 };

    /* Peak scale is capped: the screen-world crops 205*(1-1/S) px per side and the
       app's line starts sit 40px in. 1.20 -> 34px crop, so nothing is ever clipped. */
    var S0 = 1.10, S1 = 1.20, S2 = 1.02;      /* inherited -> push on the steps -> pull out */
    var T0x = 0, T0y = 26;                    /* continues frame 11's exit framing */
    var T1x = -offMask.x, T1y = -offMask.y;   /* T = -offset (nested wrappers) */
    var T2x = 0, T2y = 10;

    var tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;

    tl.fromTo(g("f12-rail"), { scaleX: 0.514286 }, { scaleX: 0.555556, duration: D, ease: "none" }, 0);

    /* camera holds the inherited framing while the accordion opens */
    tl.fromTo(cam, { scale: S0 }, { scale: S0, duration: 2.60, ease: "none" }, 0);
    tl.fromTo(camin, { x: T0x, y: T0y }, { x: T0x, y: T0y, duration: 2.60, ease: "none" }, 0);

    /* ── Scene 1 (0.2–1.0s) — the trigger: the row takes focus, the chevron turns ── */
    tl.fromTo(g("f12-head"), { backgroundColor: "hsl(0 0% 100%)" },
      { backgroundColor: "hsl(179 50% 88% / 0.55)", duration: 0.26, ease: "power2.out" }, 0.72);
    tl.fromTo(g("f12-head"), { backgroundColor: "hsl(179 50% 88% / 0.55)" },
      { backgroundColor: "hsl(0 0% 100%)", duration: 0.62, ease: "power2.out", immediateRender: false }, 1.02);
    tl.fromTo(g("f12-chev"), { rotation: 0 }, { rotation: -90, duration: 0.48, ease: "power3.out" }, 0.94);

    /* ── Scene 2 (1.0–1.55s) — anchored-layout-expand: ONE tween drives the sheet AND
       everything downstream, so the travelling bottom edge never separates from it.  */
    tl.fromTo([g("f12-sheet"), g("f12-below")], { y: -BODY_H },
      { y: 0, duration: 0.55, ease: "power3.out" }, 1.00);

    /* ── Scene 3 (1.85–7.0s) — the three steps land one at a time, balance updating ──
       The running balance is a property tween (not an onUpdate callback) so every
       seeked frame renders the right number.                                        */
    function balBeat(rowId, at, from, to, first) {
      tl.fromTo(g(rowId), { opacity: 0, y: 24, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, at);
      tl.fromTo(g(rowId), { borderColor: "hsl(182 38% 36% / 0.75)", backgroundColor: "hsl(179 50% 88% / 0.55)" },
        { borderColor: "hsl(201 21% 89% / 0.7)", backgroundColor: "hsl(198 28% 94% / 0.55)", duration: 0.9, ease: "power2.out" }, at + 0.45);

      tl.fromTo(g("f12-runv"), { innerText: from },
        { innerText: to, duration: 0.55, ease: "power2.out", snap: { innerText: 1 }, immediateRender: !!first }, at + 0.35);
      tl.fromTo(g("f12-run"), { scale: 1 }, { scale: 1.12, duration: 0.16, ease: "power2.out", immediateRender: false }, at + 0.35);
      tl.fromTo(g("f12-run"), { scale: 1.12 }, { scale: 1, duration: 0.40, ease: "power2.out", immediateRender: false }, at + 0.51);
    }
    balBeat("f12-s1", 1.85, 412, 350, true);
    balBeat("f12-s2", 4.30, 350, 330, false);
    balBeat("f12-s3", 6.20, 330, 317, false);

    /* ── camera move 1 (2.6–4.3s) — coordinate-target-zoom onto the step list:
       the one time in the film the frame goes inside the screen to read figures. */
    tl.fromTo(cam, { scale: S0 }, { scale: S1, duration: 1.70, ease: "power3.inOut", immediateRender: false }, 2.60);
    tl.fromTo(camin, { x: T0x, y: T0y }, { x: T1x, y: T1y, duration: 1.70, ease: "power3.inOut", immediateRender: false }, 2.60);

    /* ── Scene 4 (7.5–9.3s) — provenance: which club or card each benefit came from ── */
    [["f12-src1", 7.50], ["f12-src2", 8.10], ["f12-src3", 8.70]].forEach(function (p) {
      tl.fromTo(g(p[0]), { backgroundColor: "hsl(179 50% 88% / 0)", color: "hsl(208 11% 46%)" },
        { backgroundColor: "hsl(179 50% 88% / 0.95)", color: "hsl(182 73% 18%)", duration: 0.26, ease: "power2.out" }, p[1]);
      tl.fromTo(g(p[0]), { backgroundColor: "hsl(179 50% 88% / 0.95)", color: "hsl(182 73% 18%)" },
        { backgroundColor: "hsl(179 50% 88% / 0)", color: "hsl(208 11% 46%)", duration: 0.70, ease: "power2.out", immediateRender: false }, p[1] + 0.52);
    });

    /* ── camera move 2 (9.4–11.0s) — the pull-out: the whole result page reads,
       and "אפשרויות נוספות" arrives underneath it.                              */
    tl.fromTo(cam, { scale: S1 }, { scale: S2, duration: 1.60, ease: "power3.out", immediateRender: false }, 9.40);
    tl.fromTo(camin, { x: T1x, y: T1y }, { x: T2x, y: T2y, duration: 1.60, ease: "power3.out", immediateRender: false }, 9.40);

    tl.fromTo(g("f12-more"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 9.70);
    tl.fromTo(g("f12-g1"), { opacity: 0, x: -22 }, { opacity: 1, x: 0, duration: 0.46, ease: "power3.out" }, 10.30);
    tl.fromTo(g("f12-g2"), { opacity: 0, x: -22 }, { opacity: 1, x: 0, duration: 0.46, ease: "power3.out" }, 10.52);
  })();
</script>
</template>
