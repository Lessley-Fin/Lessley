[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deal-optimizer"
version = "0.1.0"
description = "Layered-DAG deal stacking optimizer — finds the cheapest legal combination of compatible deals"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
# HTTP surface (api.py) — the engine itself stays dependency-light.
service = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pymongo>=4.6,<5.0",
    # Edge/auth configuration, read the same way Personalization reads its own.
    "pydantic-settings>=2.0,<3.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.4,<1.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
deal-optimizer = "deal_optimizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deal_optimizer"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
