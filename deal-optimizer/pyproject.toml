[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deal-optimizer"
version = "0.1.0"
description = "Layered-DAG deal stacking optimizer — finds the cheapest legal combination of compatible deals"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.4,<1.0",
]

[project.scripts]
deal-optimizer = "deal_optimizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deal_optimizer"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
