[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lessley-deals"
version = "0.1.0"
description = "Deals scraping and store resolution system for Israeli retail"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27,<1.0",
    "selectolax>=0.3,<1.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
    "rapidfuzz>=3.0,<4.0",
    "beautifulsoup4>=4.12,<5.0",
    "curl-cffi>=0.7,<1.0",
    "pymongo>=4.8,<5.0",
    "python-dotenv>=1.0,<2.0",
    "openai>=1.40,<2.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44,<2.0", "playwright-stealth>=1.0,<2.0"]
api = ["fastapi>=0.111,<1.0", "uvicorn>=0.30,<1.0"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.4,<1.0",
    "respx>=0.21,<1.0",
]

[project.scripts]
deals = "lessley_deals.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lessley_deals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that do real I/O (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
