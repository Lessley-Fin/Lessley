services:
  # --- RabbitMQ Service ---
  rabbitmq:
    image: rabbitmq:4.1.4-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MongoDB Service ---
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Mongo Express (MongoDB GUI) ---
  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_PASS}
      ME_CONFIG_MONGODB_URL: mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${DB_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${DB_PASS}
      ME_CONFIG_REQUEST_SIZE: ${DB_FILE_LIMIT_SIZE}
    depends_on:
      - mongodb

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/tmp/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS}
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - loki

  # --- Your Microservices ---
  gateway:
    image: lessley/gateway:dev
    build:
      context: ../lessley-backend/Lessley.Gateway.Api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5001:8080" # Map host 5001 to container 8080
    environment:
      # 1. Development Mode (Enables Swagger)
      - ASPNETCORE_ENVIRONMENT=Development

      # CRITICAL: Use the service names (rabbitmq, postgres) not localhost
      - ConnectionStrings__MongoDb=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/${DB_NAME}?authSource=admin

      # 2. JWT Config (Using double underscore __ to represent nesting)
      - JwtConfig__Key=${JWT_KEY}
      - JwtConfig__Issuer=${JWT_ISSUER}
      - JwtConfig__Audience=${JWT_AUDIENCE}

      # 3. Bootstrap Config
      - Bootstrap__Key=${BOOTSTRAP_KEY}
      - Bootstrap__Username=${BOOTSTRAP_USER}
      - Bootstrap__Password=${BOOTSTRAP_PASSWORD}
      - Bootstrap__Email=${BOOTSTRAP_EMAIL}

      - OpenFinanceConfig__ClientId=${OpenFinanceConfig_ClientId}
      - OpenFinanceConfig__ClientSecret=${OpenFinanceConfig_ClientSecret}

      # 4. RabbitMQ Connection
      - ConnectionStrings__RabbitMq=amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/

      # 5. Logging Configuration
      - Loki__Url=${LOKI_URL}

      # 6. Deal Optimizer (service name, not localhost)
      - OptimizerConfig__BaseUrl=http://deal-optimizer:8003
    depends_on:
      - mongodb
      - rabbitmq
      - loki
      - deal-optimizer

  
  # --- Deals Pipeline (on-demand) ---
  deals-pipeline:
    image: lessley/deals:dev
    build:
      context: ../lessley-deals
      target: base
    profiles: ["tools"]
    volumes:
      - deals_data:/app/data
    environment:
      - DEALS_LOG_LEVEL=${DEALS_LOG_LEVEL:-INFO}
      - DEALS_AUTO_MATCH_THRESHOLD=${DEALS_AUTO_MATCH_THRESHOLD:-0.90}
      - DEALS_REVIEW_THRESHOLD=${DEALS_REVIEW_THRESHOLD:-0.50}
      - DEALS_STORAGE=mongo
      - MONGO_URI=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/${DB_NAME}?authSource=admin
      - MONGO_DB=${DB_NAME}
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["python", "-m", "lessley_deals.cli.main"]
    command: ["scrape", "--all", "--hot-fetch-details"]

  # --- Deals Worker (long-running scraper scheduler) ---
  # Owns the whole loop: schedule → scrape → normalize → match → version →
  # persist, one independent asyncio task per source. Schedules come from
  # lessley-deals/data/seed/schedules.json (biweekly: 1st + 15th), overridable
  # per source at runtime with DEALS_SCHEDULE_<SOURCE>=off|<cron>|<interval>.
  deals-worker:
    image: lessley/deals:worker
    build:
      context: ../lessley-deals
      target: worker
    restart: always
    env_file:
      - .env
    environment:
      # Explicit values win over env_file — .env's MONGO_URI points at the host.
      - MONGO_URI=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/${DB_NAME}?authSource=admin
      - MONGO_DB=${DB_NAME}
      - DEALS_STORAGE=mongo
      - DEALS_DATA_DIR=/app/data
      - DEALS_VERSIONING=1
      - DEALS_MAX_CONCURRENCY=3
      - DEALS_SHUTDOWN_GRACE=60
      - DEALS_LOG_LEVEL=${DEALS_LOG_LEVEL:-INFO}
      - DEALS_AUTO_MATCH_THRESHOLD=${DEALS_AUTO_MATCH_THRESHOLD:-0.90}
      - DEALS_REVIEW_THRESHOLD=${DEALS_REVIEW_THRESHOLD:-0.50}
      # Parse each deal's terms into a structured `constraints` block — this is
      # what gives deal-optimizer real combinability instead of "unknown".
      # Costs one LLM call per deal that has terms, and needs
      # COLLEGE_API_BASE/COLLEGE_MODEL_* or OPENAI_API_KEY; without those every
      # parse is logged and skipped (never fatal), so this stays a no-op until
      # credentials are added to .env.
      - DEALS_ENRICH_CONSTRAINTS=1
      # Fetch each HOT benefit's detail page. All 7 benefit types are scraped
      # either way (the adapter's own default) — details are what carry
      # terms_and_conditions, which the constraints stage above needs.
      - HOT_FETCH_DETAILS=1
      - HOT_REQUEST_DELAY=${HOT_REQUEST_DELAY:-1.5}
      - HOT_DETAILS_DELAY=${HOT_DETAILS_DELAY:-2.0}
      # The llm:* scraper sources are separate from constraints enrichment above
      # and stay off: they need the same credentials and would fail every run.
      - DEALS_LLM_SOURCES=0
    volumes:
      # Raw payloads and the review queue stay on disk for replay/auditing.
      - deals_worker_data:/app/data
      # The whole seed dir bound read-only on top of the volume. Docker only
      # copies the image's content into a named volume when that volume is first
      # created, so without this an edited — or newly added — seed file (clubs,
      # schedules, stores) never reaches an existing deployment. Now a restart
      # is enough, and the repo stays the single source of truth.
      - ../lessley-deals/data/seed:/app/data/seed:ro
    depends_on:
      mongodb:
        condition: service_healthy
    # SIGTERM triggers a cooperative drain; must exceed DEALS_SHUTDOWN_GRACE.
    stop_grace_period: 90s
    deploy:
      resources:
        limits:
          # Chromium is the memory hog; raise alongside DEALS_MAX_CONCURRENCY.
          memory: 2G

  # --- Deals Review CLI (interactive) ---
  deals-review:
    image: lessley/deals:dev
    profiles: ["tools"]
    volumes:
      - deals_data:/app/data
    stdin_open: true
    tty: true
    environment:
      - DEALS_STORAGE=mongo
      - MONGO_URI=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/${DB_NAME}?authSource=admin
      - MONGO_DB=${DB_NAME}
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["python", "-m", "lessley_deals.cli.main"]
    command: ["review"]

  # --- Deals Tests ---
  deals-test:
    image: lessley/deals:test
    build:
      context: ../lessley-deals
      target: test
    profiles: ["test"]
    volumes:
      - deals_test_data:/app/test_data

  # --- Lessley Personalization Service ---
  personalization:
    image: lessley/personalization:dev
    build:
      context: ../lessley-backend/Lessley.Personalization
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5002:8001"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ASPNETCORE_ENVIRONMENT=Development
      # Required (no default) by config/settings.py::Settings — the service
      # refuses to start without it.
      - Environment=Development
      - RabbitMQ_Enabled=False
      - CONNECTIONSTRINGS_RABBIT=amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/
      - ConnectionStrings_MongoDb=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/
      - OpenFinanceConfig_ClientId=${OpenFinanceConfig_ClientId}
      - OpenFinanceConfig_ClientSecret=${OpenFinanceConfig_ClientSecret}
      - OpenFinanceConfig_BaseUrl=https://api.open-finance.ai
      - Loki_Url=${LOKI_URL}/loki/api/v1/push
    depends_on:
      - rabbitmq
      - mongodb
      - loki

  # --- Deal Optimizer (layered-DAG stacking engine, HTTP) ---
  deal-optimizer:
    image: lessley/deal-optimizer:dev
    build:
      context: ../deal-optimizer
      target: service
    restart: always
    ports:
      - "5003:8003"
    environment:
      - PYTHONUNBUFFERED=1
      # Reads the same deals collection the deals-pipeline writes to.
      - MONGO_URI=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/${DB_NAME}?authSource=admin
      - MONGO_DB=${DB_NAME}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mongodb:
        condition: service_healthy

# Defined volumes for persistence
volumes:
  rabbitmq_data:
  mongodb_data:
  deals_data:
  deals_worker_data:
  deals_test_data:
  loki_data:
