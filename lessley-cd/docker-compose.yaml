services:
  # --- RabbitMQ Service ---
  rabbitmq:
    image: rabbitmq:4.1.4-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MongoDB Service ---
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Mongo Express (MongoDB GUI) ---
  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_PASS}
      ME_CONFIG_MONGODB_URL: mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${DB_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${DB_PASS}
    depends_on:
      - mongodb

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/tmp/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS}
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - loki

  # --- Your Microservices ---
  gateway:
    image: lessley/gateway:dev
    build:
      context: ../lessley-backend/Lessley.Gateway.Api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5001:8080" # Map host 5001 to container 8080
    environment:
      # 1. Development Mode (Enables Swagger)
      - ASPNETCORE_ENVIRONMENT=Development

      # CRITICAL: Use the service names (rabbitmq, postgres) not localhost
      - ConnectionStrings__MongoDb=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/${DB_NAME}?authSource=admin

      # 2. JWT Config (Using double underscore __ to represent nesting)
      - JwtConfig__Key=${JWT_KEY}
      - JwtConfig__Issuer=${JWT_ISSUER}
      - JwtConfig__Audience=${JWT_AUDIENCE}

      # 3. Bootstrap Config
      - Bootstrap__Key=${BOOTSTRAP_KEY}
      - Bootstrap__Username=${BOOTSTRAP_USER}
      - Bootstrap__Password=${BOOTSTRAP_PASSWORD}
      - Bootstrap__Email=${BOOTSTRAP_EMAIL}

      - OpenFinanceConfig__ClientId=${OpenFinanceConfig_ClientId}
      - OpenFinanceConfig__ClientSecret=${OpenFinanceConfig_ClientSecret}

      # 4. Logging Configuration
      - Loki__Url=${LOKI_URL}
    depends_on:
      - mongodb   
      - loki

  
  # --- Deals Pipeline (on-demand) ---
  deals-pipeline:
    image: lessley/deals:dev
    build:
      context: ../lessley-deals
      target: base
    profiles: ["tools"]
    volumes:
      - deals_data:/app/data
    environment:
      - DEALS_LOG_LEVEL=${DEALS_LOG_LEVEL:-INFO}
      - DEALS_AUTO_MATCH_THRESHOLD=${DEALS_AUTO_MATCH_THRESHOLD:-0.90}
      - DEALS_REVIEW_THRESHOLD=${DEALS_REVIEW_THRESHOLD:-0.50}
      - DEALS_STORAGE=mongo
      - MONGO_URI=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/${DB_NAME}?authSource=admin
      - MONGO_DB=${DB_NAME}
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["python", "-m", "lessley_deals.cli.main"]
    command: ["scrape", "--all", "--hot-fetch-details"]

  # --- Deals Review CLI (interactive) ---
  deals-review:
    image: lessley/deals:dev
    profiles: ["tools"]
    volumes:
      - deals_data:/app/data
    stdin_open: true
    tty: true
    environment:
      - DEALS_STORAGE=mongo
      - MONGO_URI=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/${DB_NAME}?authSource=admin
      - MONGO_DB=${DB_NAME}
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["python", "-m", "lessley_deals.cli.main"]
    command: ["review"]

  # --- Deals Tests ---
  deals-test:
    image: lessley/deals:test
    build:
      context: ../lessley-deals
      target: test
    profiles: ["test"]
    volumes:
      - deals_test_data:/app/test_data

  # --- Lessley Personalization Service ---
  personalization:
    image: lessley/personalization:dev
    build:
      context: ../lessley-backend/Lessley.Personalization
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5002:8001"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ_Enabled=False
      - ConnectionStrings_Rabbit=amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/
      - OpenFinanceConfig_ClientId=${OpenFinanceConfig_ClientId}
      - OpenFinanceConfig_ClientSecret=${OpenFinanceConfig_ClientSecret}
      - OpenFinanceConfig_BaseUrl=https://api.open-finance.ai
      - Loki_Url=${LOKI_URL}/loki/api/v1/push
    depends_on:
      - rabbitmq
      - mongodb
      - loki

# Defined volumes for persistence
volumes:
  rabbitmq_data:
  mongodb_data:
  deals_data:
  deals_test_data:
  loki_data:
