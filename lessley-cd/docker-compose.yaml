  #     - HOT_REQUEST_DELAY=${HOT_REQUEST_DELAY:-1.5}
  #     - HOT_DETAILS_DELAY=${HOT_DETAILS_DELAY:-2.0}
  #     # The llm:* scraper sources are separate from constraints enrichment above
  #     # and stay off: they need the same credentials and would fail every run.
  #     - DEALS_LLM_SOURCES=0
  #   volumes:
  #     # Raw payloads and the review queue stay on disk for replay/auditing.
  #     - deals_worker_data:/app/data
  #     # The whole seed dir bound read-only on top of the volume. Docker only
  #     # copies the image's content into a named volume when that volume is first
  #     # created, so without this an edited — or newly added — seed file (clubs,
  #     # schedules, stores) never reaches an existing deployment. Now a restart
  #     # is enough, and the repo stays the single source of truth.
  #     - ../lessley-deals/data/seed:/app/data/seed:ro
  #   networks:
  #     - backend
  #   depends_on:
  #     mongodb:
  #       condition: service_healthy
  #   # SIGTERM triggers a cooperative drain; must exceed DEALS_SHUTDOWN_GRACE.
  #   stop_grace_period: 90s
  #   deploy:
  #     resources:
  #       limits:
  #         # Chromium is the memory hog; raise alongside DEALS_MAX_CONCURRENCY.
  #         memory: 2G

  # --- Deals Review CLI (interactive) ---
  # deals-review:
  #   image: lessley/deals:dev
  #   profiles: ["tools"]
  #   volumes:
  #     - deals_data:/app/data
  #   stdin_open: true
  #   tty: true
  #   environment:
