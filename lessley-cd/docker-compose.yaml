# ── Lessley DEVELOPMENT stack ─────────────────────────────────────────────────
# Dev mirrors production EXACTLY: same Caddy operation and same networking.
#   * Caddy is the ONLY host-published web edge. It terminates TLS, serves the built
#     React SPA, and routes /api/v1 + /hubs to the owning service BY SERVICE NAME over
#     the private `backend` network — byte-for-byte the same Caddyfile as prod.
#   * The browser talks ONLY to Caddy (https://localhost). It never addresses the
#     gateway or personalization directly, and never knows personalization exists.
#
# Dev differs from docker-compose.prod.yaml ONLY in the ways tasks.txt allows:
#   1. URLs           — DOMAIN=localhost (Caddy auto-issues an internal-CA cert) vs our
#                       college DOMAIN + a pre-issued cert (CADDY_TLS_DIRECTIVE) in prod.
#                       Same Caddyfile.
#   2. Swagger / docs  — ASPNETCORE_ENVIRONMENT/Environment=Development here → Swagger
#                       (/swagger) and FastAPI /docs are ON; prod runs Production → OFF.
#   3. mongo-express   — present here for DB browsing; removed in prod.
# Plus dev-only conveniences that DO NOT touch Caddy or the edge networking:
#   - infra + service ports are also host-published so you can reach Swagger
#     (localhost:8001/swagger), FastAPI docs (localhost:8002/docs), Mongo (27017),
#     RabbitMQ (5672/15672), Grafana (3000), mongo-express (8081) from the host.
#   - HSTS is disabled (max-age=0) so https://localhost does not force other local
#     http projects to https.
#
# Usage:  .\manage.bat infra up   (mongo, rabbit, loki, grafana, mongo-express, caddy)
#         .\manage.bat app build  (gateway, personalization)
# Rebuild the SPA after frontend changes:  docker compose up -d --build caddy
# First run (trust the local cert): see lessley-cd/README.md.

networks:
  web:        # public edge (Caddy only)
  backend:    # private app/infra network — services reach each other by name
    internal: false   # keep false so containers can reach the internet (Let's Encrypt, Open Finance)

services:
  # ── Edge: TLS termination + SPA host + API reverse proxy ────────────────────
  # Built from the frontend Dockerfile so the image bundles the compiled SPA at
  # /srv/frontend; the Caddyfile (mounted below) serves it and routes /api/v1 + /hubs.
  # Identical to the prod `caddy` service except DOMAIN=localhost and HSTS disabled.
  caddy:
    build:
      context: ../lessley-frontend
      dockerfile: Dockerfile
    image: lessley/edge:1.0.6
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      # localhost → Caddy serves HTTPS with its own internal CA (no ACME involved).
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-dev@lessley.local}
      # Disable HSTS in dev so https://localhost cannot pin other localhost http apps.
      - HSTS_MAX_AGE=max-age=0
      # Stamped onto every request Caddy forwards, so services can prove it came from the edge.
      - EDGE_API_KEY=${EDGE_API_KEY:-dev-edge-key}
      # Optional: a full `tls` directive to make Caddy load a pre-issued cert instead of
      # automatic HTTPS. See ./certs mount below and lessley-cd/CUSTOM-CA-CERT.md.
      - CADDY_TLS_DIRECTIVE=${CADDY_TLS_DIRECTIVE:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
      - backend
    depends_on:
      - gateway
      - personalization
      - deal-optimizer

  # --- RabbitMQ Service ---
  rabbitmq:
    image: rabbitmq:4.1.4-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MongoDB Service ---
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Mongo Express (MongoDB GUI) — DEV ONLY (removed in prod) ---
  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_PASS}
      ME_CONFIG_MONGODB_URL: mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${DB_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${DB_PASS}
      ME_CONFIG_REQUEST_SIZE: ${DB_FILE_LIMIT_SIZE}
    networks:
      - backend
    depends_on:
      - mongodb

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/tmp/loki
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS}
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    networks:
      - backend
    depends_on:
      - loki

  # --- Gateway (reached from the edge as gateway:5001, same as prod) ---
  gateway:
    image: lessley/gateway:1.0.6
    container_name: gateway
    build:
      context: ../lessley-backend/Lessley.Gateway.Api
      dockerfile: Dockerfile
    restart: always
    # Host-published for dev tooling only (Swagger at http://localhost:8001/swagger).
    # Caddy still reaches it privately as gateway:5001 — the edge path is identical to prod.
    ports:
      - "8001:5001"
    environment:
      # Development mode → Swagger enabled (the only intended dev/prod behavioural delta).
      - ASPNETCORE_ENVIRONMENT=Development
      # Same container port as prod so the Caddyfile's `reverse_proxy gateway:5001` is identical.
      - ASPNETCORE_HTTP_PORTS=5001

      # Reach infra by service name over the backend network.
      - ConnectionStrings__MongoDb=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/${DB_NAME}?authSource=admin
      - ConnectionStrings__RabbitMq=amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/

      - JwtConfig__Key=${JWT_KEY}
      - JwtConfig__Issuer=${JWT_ISSUER}
      - JwtConfig__Audience=${JWT_AUDIENCE}

      - Bootstrap__Key=${BOOTSTRAP_KEY}
      - Bootstrap__Username=${BOOTSTRAP_USER}
      - Bootstrap__Password=${BOOTSTRAP_PASSWORD}
      - Bootstrap__Email=${BOOTSTRAP_EMAIL}

      - OpenFinanceConfig__ClientId=${OpenFinanceConfig_ClientId}
      - OpenFinanceConfig__ClientSecret=${OpenFinanceConfig_ClientSecret}
      # Where the bank-linking journey returns the user. Without it Open Finance has nowhere
      # to send them and they never come back to the SPA. Same origin as the edge.
      - OpenFinanceConfig__RedirectUrl=https://${DOMAIN:-localhost}/optimizer

      # The Gateway never calls Personalization over HTTP. It only needs to recognise the
      # edge: Caddy stamps X-Edge-Key on every request it forwards here.
      - Edge__ApiKey=${EDGE_API_KEY:-dev-edge-key}

      # Transactional email. Left disabled by default in dev: the verification / reset /
      # sign-in codes are written to the gateway's log instead, so the flows can be walked
      # locally with no SMTP account (`docker compose logs -f gateway`). Point SMTP_HOST at a
      # local MailHog or a Mailtrap inbox and flip SMTP_ENABLED=true to exercise real delivery.
      - EmailConfig__Enabled=${SMTP_ENABLED:-false}
      - EmailConfig__Host=${SMTP_HOST:-}
      - EmailConfig__Port=${SMTP_PORT:-587}
      - EmailConfig__UserName=${SMTP_USER:-}
      - EmailConfig__Password=${SMTP_PASSWORD:-}
      - EmailConfig__FromAddress=${SMTP_FROM_ADDRESS:-}
      - EmailConfig__FromName=${SMTP_FROM_NAME:-Lessley}
      - EmailConfig__AppUrl=https://${DOMAIN:-localhost}

      # SPA is served same-origin by Caddy, so no CORS is needed. Restrict Host.
      - AllowedHosts=${DOMAIN:-localhost}

      - Loki__Url=${LOKI_URL}
    networks:
      - backend
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      loki:
        condition: service_started

  # --- Deals Pipeline (on-demand) ---
