  # --- Personalization (internal only; reached as personalization:5002, same as prod) ---
  personalization:
    image: lessley/personalization:1.0.6
    container_name: personalization
    build:
      context: ../lessley-backend/Lessley.Personalization
      dockerfile: Dockerfile
    restart: always
    # Host-published for dev tooling only (FastAPI docs at http://localhost:8002/docs).
    ports:
      - "8002:5002"
    # No env_file here on purpose: bulk-importing lessley-cd/.env would also inject its
    # LOKI_URL (bare, no push path) alongside the Loki_Url below (correct, push path
    # appended) — two different case-sensitive keys that pydantic-settings' case-insensitive
    # matching resolves non-deterministically (whichever lands in os.environ last wins), so
    # Personalization could silently bind the wrong one and fail to reach Loki. Every setting
    # this service needs is already listed explicitly below; keep it that way.
    environment:
      - PYTHONUNBUFFERED=1
      # Same container port as prod.
      - APP_PORT=5002
      # Development → FastAPI /docs enabled (the only intended dev/prod behavioural delta).
      # Required (no default) by config/settings.py::Settings — the service
      # refuses to start without it.
      - Environment=Development
      - RabbitMQ_Enabled=True
      - CONNECTIONSTRINGS_RABBIT=amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/
      - ConnectionStrings_MongoDb=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/
      - OpenFinanceConfig_ClientId=${OpenFinanceConfig_ClientId}
      - OpenFinanceConfig_ClientSecret=${OpenFinanceConfig_ClientSecret}
      - OpenFinanceConfig_BaseUrl=https://api.open-finance.ai
      # Same X-Edge-Key gate as prod: only Caddy may reach this service.
      - Edge_ApiKey=${EDGE_API_KEY:-dev-edge-key}
      - Loki_Url=${LOKI_URL}/loki/api/v1/push
    networks:
      - backend
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      loki:
        condition: service_started

  # --- Deal Optimizer (edge-exposed as deal-optimizer:5003, same as prod) ---
  # Reached by the SPA at /api/v1/optimizer/*, which Caddy forward_auths and proxies
  # here — the Gateway is not in that path.
  deal-optimizer:
    image: lessley/deal-optimizer:1.0.6
    container_name: optimizer
    build:
      context: ../deal-optimizer
      target: service
    restart: always
    # Host-published for dev tooling only (FastAPI docs at http://localhost:8003/docs).
    # Caddy still reaches it privately as deal-optimizer:5003 — identical to prod.
    ports:
      - "8003:5003"
    environment:
      - PYTHONUNBUFFERED=1
      # Same container port as prod.
      - APP_PORT=5003
      # Development → FastAPI /docs enabled (the only intended dev/prod behavioural delta).
      - Environment=Development
      # Reads the same deals collection the deals-pipeline writes to.
      - MONGO_URI=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/${DB_NAME}?authSource=admin
      - MONGO_DB=${DB_NAME}
      # Same X-Edge-Key gate as prod: only Caddy may reach this service.
      - Edge_ApiKey=${EDGE_API_KEY:-dev-edge-key}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/optimizer/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    depends_on:
      mongodb:
        condition: service_healthy

# Defined volumes for persistence
volumes:
  rabbitmq_data:
  mongodb_data:
  deals_data:
  deals_worker_data:
  deals_test_data:
  loki_data:
  caddy_data:
  caddy_config:
